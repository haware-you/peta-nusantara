<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Two designed themes, not one inverted (PRD NFR-7).

     PRD 16's objection to a light ground was real: a gold radial gradient on
     paper reads as a stain. The fix is to change what the bloom IS per theme.
     On near-black it is screen-blended light, radiating from a centre. On
     paper it is multiply-blended pigment — an ink wash, as on a hand-tinted
     chart. Same data, different physics. The light ground echoes the timeline
     artifact's paper so the two views read as siblings.

     Three viewer states: an explicit choice stamps data-theme on the root;
     the default "system" state stamps nothing and only prefers-color-scheme
     applies. So: bare :root is the complete LIGHT set, the media query
     redefines to dark unless light was chosen, and [data-theme="dark"] wins
     the other way. Every token exists here first. */
  :root{
    color-scheme: light;
    --ease-out:      cubic-bezier(.22, 1, .36, 1);   /* theme-independent */
    --ground:        #f3ede0;
    /* Paper chart: the sea leans cool and the land leans warm so that ochre
       pigment multiplied onto land reads as a tint, not as mud. */
    --ocean:         oklch(92.5% 0.014 215);
    --ocean-hi:      oklch(95% 0.010 215);
    --ocean-deep:    oklch(88.5% 0.018 215);
    --land:          oklch(91.5% 0.026 88);
    --land-edge:     oklch(76% 0.055 85);
    --gold:          #96691a;
    --gold-warm:     #b5822a;
    --route:         #1f7a70;
    --route-hi:      #146a60;
    --colonial:      #4a3aa7;
    --colonial-fill: rgba(74,58,167,0.12);
    --ink-1:         #221c14;
    --ink-2:         #5b5347;
    --ink-3:         #8c8371;
    --line:          #ddd2ba;
    --surface:       #fbf8f1;
    --surface-2:     #f1eadb;
    --surface-3:     #e8dfcb;
    --accent-line:   #cfa863;
    --panel-bg:      rgba(251,248,241,0.92);
    --swatch-line:   rgba(34,28,20,0.18);
    --halo:          rgba(251,248,241,0.92);   /* text halo, so labels sit on the ground */

    /* Controls are ink, not gold. Gold is a legend entry (influence, the time
       cursor); a language button must not share a colour with Majapahit. */
    --ui:            oklch(24% 0.012 70);
    --ui-on:         #fbf8f1;
    --ui-ring:       oklch(30% 0.02 70);
    --sel-wash:      rgba(150,105,26,0.07);    /* selected power: a wash of its own colour */
    --terracotta:    #905831;
    --terracotta-soft: rgba(144, 88, 49, 0.12);
    --terracotta-wash: rgba(144, 88, 49, 0.08);
    --terracotta-hi:   #7d4b29;
    --terracotta-fg:   #fbf8f1;
    --shadow-soft:   0 18px 40px rgba(31, 24, 17, 0.12);

    /* Influence: pigment on paper. Sienna rather than the UI gold, multiplied. */
    --bloom:         oklch(56% 0.13 55);
    --bloom-swatch:  oklch(56% 0.13 55 / 0.55);
    --blend:         multiply;
    --bh0:.62; --bh1:.36; --bh2:.13; --bh3:0;    /* high confidence: tight */
    --bm0:.46; --bm1:.28; --bm2:.10; --bm3:0;    /* medium */
    --bl0:.32; --bl1:.21; --bl2:.08; --bl3:0;    /* low: diffuse — uncertainty is visible */
    --glow-fill:       oklch(56% 0.13 55 / 0.07);
    --glow-stroke:     oklch(56% 0.13 55 / 0.45);
    --glow-fill-sel:   oklch(56% 0.13 55 / 0.10);
    --glow-stroke-sel: oklch(56% 0.13 55 / 0.75);
    --gold-glow-a:     rgba(150,105,26,0.22);
    --gold-glow-b:     rgba(150,105,26,0.30);
    --vanmook:       #2a2116;

    /* Faction channel — separate from the influence channel, because these
       are 20th-century political blocs, not mandala spheres. */
    --f-nat:         #b8402f;   /* republican / nationalist (PNI) */
    --f-islam:       #2f7d4f;   /* Islamic (Masyumi, NU, Darul Islam) */
    --f-komunis:     #a8446f;   /* communist (PKI) — deliberately not red, see README */
    --f-kristen:     #2f6fae;   /* Christian parties (Parkindo, Partai Katolik) */
    --f-none:        #b3a892;
    /* 1965-66 — its own channel, never "influence". Burnt umber, not red:
       red is PNI's and the Republic's colour, and the killings are a record. */
    --violence:      oklch(38% 0.08 35);
    --violence-text: oklch(38% 0.08 35);
    --mig:           #2c7d93;   /* Austronesian migration */
    --mig-text:      #1f6478;

    /* Scrubber ruler */
    --rl-base:  #ddd2ba; --rl-major: #a89b83; --rl-minor: #cfc4aa;
    --rl-break: #b5905a; --rl-lab:   #8c8371;
    --dens:     #96691a; --dens-a: .18; --thr: #96691a;
    --grat:     #d3dcdd;

    /* Timeline category colours, light variants — carried from the chart.
       Modern is near-ink rather than the chart's red: red already belongs to
       the Republic here, and modern is the era the chrome itself lives in. */
    --cat-classical: #2a78d6; --cat-islamic: #eb6834; --cat-modern: oklch(40% 0.02 60);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:        #0c0b09;
      --ocean:         #0f1115;
      --ocean-hi:      #12151a;
      --ocean-deep:    #0b0d10;
      --land:          #272219;
      --land-edge:     #3d3626;
      --gold:          #d9ab55;
      --gold-warm:     #f0c877;
      --route:         #3f9d92;
      --route-hi:      #63c8bb;
      --colonial:      #9085e9;
      --colonial-fill: rgba(144,133,233,0.10);
      --ink-1:         #f3ecdd;
      --ink-2:         #a89b83;
      --ink-3:         #6e6555;
      --line:          #2a2419;
      --surface:       #14120e;
      --surface-2:     #1c1913;
      --surface-3:     #231e16;
      --accent-line:   #4a3c1e;
      --panel-bg:      rgba(14,12,9,0.90);
      --swatch-line:   rgba(255,255,255,0.18);
      --halo:          rgba(12,11,9,0.90);
      --ui:            oklch(92% 0.012 80);
      --ui-on:         #14120e;
      --ui-ring:       oklch(88% 0.02 80);
      --sel-wash:      rgba(217,171,85,0.07);
      --bloom:         #d9ab55;
      --bloom-swatch:  rgba(217,171,85,0.62);
      --terracotta:    #c98a5e;
      --terracotta-soft: rgba(201, 138, 94, 0.16);
      --terracotta-wash: rgba(201, 138, 94, 0.10);
      --terracotta-hi:   #d99e73;
      --terracotta-fg:   #1a1209;
      --blend:         screen;
      --bh0:.62; --bh1:.34; --bh2:.11; --bh3:0;
      --bm0:.44; --bm1:.26; --bm2:.09; --bm3:0;
      --bl0:.30; --bl1:.20; --bl2:.08; --bl3:0;
      --glow-fill:       rgba(217,171,85,0.05);
      --glow-stroke:     rgba(217,171,85,0.30);
      --glow-fill-sel:   rgba(217,171,85,0.075);
      --glow-stroke-sel: rgba(217,171,85,0.55);
      --gold-glow-a:     rgba(217,171,85,0.20);
      --gold-glow-b:     rgba(217,171,85,0.34);
      --vanmook:       #e8dcc0;
      --f-nat:         #d0503f;
      --f-islam:       #46a06a;
      --f-komunis:     #c9628f;
      --f-kristen:     #5b9bd5;
      --f-none:        #574f42;
      --violence:      oklch(55% 0.09 35);
      --violence-text: oklch(80% 0.06 35);
      --mig:           #7fb6c9;
      --mig-text:      #9fd0de;
      --rl-base:  #2a2419; --rl-major: #4a4232; --rl-minor: #2f2a1e;
      --rl-break: #5a4a26; --rl-lab:   #6e6555;
      --dens:     #d9ab55; --dens-a: .16; --thr: #d9ab55; --grat: #1a1e24;
      --cat-classical: #3987e5; --cat-islamic: #e07a44; --cat-modern: oklch(78% 0.02 80);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:        #0c0b09;
    --ocean:         #0f1115;
    --ocean-hi:      #12151a;
    --ocean-deep:    #0b0d10;
    --land:          #272219;
    --land-edge:     #3d3626;
    --gold:          #d9ab55;
    --gold-warm:     #f0c877;
    --route:         #3f9d92;
    --route-hi:      #63c8bb;
    --colonial:      #9085e9;
    --colonial-fill: rgba(144,133,233,0.10);
    --ink-1:         #f3ecdd;
    --ink-2:         #a89b83;
    --ink-3:         #6e6555;
    --line:          #2a2419;
    --surface:       #14120e;
    --surface-2:     #1c1913;
    --surface-3:     #231e16;
    --accent-line:   #4a3c1e;
    --panel-bg:      rgba(14,12,9,0.90);
    --swatch-line:   rgba(255,255,255,0.18);
    --halo:          rgba(12,11,9,0.90);
    --ui:            oklch(92% 0.012 80);
    --ui-on:         #14120e;
    --ui-ring:       oklch(88% 0.02 80);
    --sel-wash:      rgba(217,171,85,0.07);
    --bloom:         #d9ab55;
    --bloom-swatch:  rgba(217,171,85,0.62);
    --terracotta:    #c98a5e;
    --terracotta-soft: rgba(201, 138, 94, 0.16);
    --terracotta-wash: rgba(201, 138, 94, 0.10);
    --terracotta-hi:   #d99e73;
    --terracotta-fg:   #1a1209;
    --blend:         screen;
    --bh0:.62; --bh1:.34; --bh2:.11; --bh3:0;
    --bm0:.44; --bm1:.26; --bm2:.09; --bm3:0;
    --bl0:.30; --bl1:.20; --bl2:.08; --bl3:0;
    --glow-fill:       rgba(217,171,85,0.05);
    --glow-stroke:     rgba(217,171,85,0.30);
    --glow-fill-sel:   rgba(217,171,85,0.075);
    --glow-stroke-sel: rgba(217,171,85,0.55);
    --gold-glow-a:     rgba(217,171,85,0.20);
    --gold-glow-b:     rgba(217,171,85,0.34);
    --vanmook:       #e8dcc0;
    --f-nat:         #d0503f;
    --f-islam:       #46a06a;
    --f-komunis:     #c9628f;
    --f-kristen:     #5b9bd5;
    --f-none:        #574f42;
    --violence:      oklch(55% 0.09 35);
    --violence-text: oklch(80% 0.06 35);
    --mig:           #7fb6c9;
    --mig-text:      #9fd0de;
    --rl-base:  #2a2419; --rl-major: #4a4232; --rl-minor: #2f2a1e;
    --rl-break: #5a4a26; --rl-lab:   #6e6555;
    --dens:     #d9ab55; --dens-a: .16; --thr: #d9ab55; --grat: #1a1e24;
    --cat-classical: #3987e5; --cat-islamic: #e07a44; --cat-modern: oklch(78% 0.02 80);
  }

  /* SVG built by script carries classes, not colours; these resolve them. */
  #bloom-high   .s0{ stop-color: var(--bloom); stop-opacity: var(--bh0); }
  #bloom-high   .s1{ stop-color: var(--bloom); stop-opacity: var(--bh1); }
  #bloom-high   .s2{ stop-color: var(--bloom); stop-opacity: var(--bh2); }
  #bloom-high   .s3{ stop-color: var(--bloom); stop-opacity: var(--bh3); }
  #bloom-medium .s0{ stop-color: var(--bloom); stop-opacity: var(--bm0); }
  #bloom-medium .s1{ stop-color: var(--bloom); stop-opacity: var(--bm1); }
  #bloom-medium .s2{ stop-color: var(--bloom); stop-opacity: var(--bm2); }
  #bloom-medium .s3{ stop-color: var(--bloom); stop-opacity: var(--bm3); }
  #bloom-low    .s0{ stop-color: var(--bloom); stop-opacity: var(--bl0); }
  #bloom-low    .s1{ stop-color: var(--bloom); stop-opacity: var(--bl1); }
  #bloom-low    .s2{ stop-color: var(--bloom); stop-opacity: var(--bl2); }
  #bloom-low    .s3{ stop-color: var(--bloom); stop-opacity: var(--bl3); }
  .dens{ fill: var(--dens); fill-opacity: var(--dens-a); }
  .rl-base{ stroke: var(--rl-base); stroke-width:1; }
  .rl-major{ stroke: var(--rl-major); stroke-width:.8; }
  .rl-minor{ stroke: var(--rl-minor); stroke-width:.8; }
  .rl-break{ stroke: var(--rl-break); stroke-width:1; stroke-dasharray:2 3; }
  .rl-lab{ fill: var(--rl-lab); font-size:9px; font-family:'IBM Plex Mono', monospace; }
  #thr{ stroke: var(--thr); stroke-width:1; stroke-opacity:.55; }
  .dutch-dot{ fill: var(--colonial); fill-opacity:.30; stroke: var(--colonial); stroke-width:1.1; vector-effect: non-scaling-stroke; r: calc(4.5px / var(--mz)); }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--ground);
    color: var(--ink-1);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; font-weight:700; margin:0; text-wrap: balance; }

  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .app{
    display: grid;
    grid-template-rows: auto minmax(0,1fr) auto;
    min-height: 100vh;
  }
  /* On desktop the middle row must be bounded, or a long rail (the prologue,
     a selected entity's three answers) stretches it past the viewport and the
     map's slice-fit zooms in to fill the taller box. Bounded, the rail scrolls
     inside itself and the map stays put. Mobile stacks and flows instead. */
  @media (min-width: 901px){
    .app{ height: 100vh; }
  }

  /* ============================ Header ============================ */
  .head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 20px; flex-wrap: wrap;
    padding: 16px 22px 13px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.15em;
    text-transform: uppercase; color: var(--ink-3); font-weight:600; margin-bottom:5px;
  }
  .head h1{ font-size: clamp(1.25rem, 2.4vw, 1.7rem); letter-spacing:-0.01em; line-height:1.1; }
  .head .sub{ color: var(--ink-2); font-size:0.84rem; margin-top:4px; max-width: 54ch; }

  .controls{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
  .ctl-row{ display:flex; gap:8px; align-items:center; flex-wrap: wrap; justify-content:flex-end; }

  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background: var(--surface-2); }
  .seg button{
    appearance:none; border:none; background:transparent; color: var(--ink-2);
    font: inherit; font-weight:600; font-size:0.76rem; padding:7px 14px; cursor:pointer;
    transition: background .14s, color .14s;
  }
  .seg button:hover{ color: var(--ink-1); }
  .seg button.active{ background: var(--ui); color: var(--ui-on); }
  .seg button:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:-2px; }

  /* Not a toggle, so no knob: a way back to the front door. Ink, like
     every other control on the plate. */
  .ghost{
    border:1px solid var(--line); border-radius:999px; background: var(--surface-2);
    padding:7px 14px; cursor:pointer; font:inherit; font-weight:600;
    font-size:0.75rem; color: var(--ink-2);
    transition: color .14s, border-color .14s;
  }
  .ghost:hover{ color: var(--ink-1); border-color: var(--ink-3); }
  .ghost:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }

  .pill{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-radius:999px; background: var(--surface-2);
    padding:6px 13px 6px 6px; cursor:pointer; font:inherit; font-weight:600;
    font-size:0.75rem; color: var(--ink-2);
    transition: color .14s, border-color .14s;
  }
  .pill .knob{
    width:28px; height:17px; border-radius:999px; background: var(--surface-3);
    border:1px solid var(--line); position:relative; flex-shrink:0; transition: background .15s;
  }
  .pill .knob::after{
    content:''; position:absolute; top:1px; left:1px; width:13px; height:13px;
    border-radius:50%; background: var(--ink-3); transition: transform .15s, background .15s;
  }
  .pill.on{ color: var(--ink-1); border-color: var(--ink-3); }
  .pill.on .knob{ background: var(--ui); border-color: var(--ui); }
  .pill.on .knob::after{ transform: translateX(11px); background: var(--ui-on); }
  /* The sea-lanes toggle wears the colour of the layer it switches on. */
  #routes-btn.on .knob{ background: var(--route); border-color: var(--route); }
  #routes-btn.on .knob::after{ background: var(--surface); }
  .pill:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }

  /* ============================ Stage ============================ */
  .stage{
    display: grid;
    grid-template-columns: minmax(0,1fr) 336px;
    min-height: 0;
  }

  .map-wrap{
    position: relative;
    background:
      radial-gradient(120% 90% at 50% 42%, var(--ocean-hi) 0%, var(--ocean) 45%, var(--ocean-deep) 100%);
    overflow: hidden;
    min-height: 340px;
  }
  /* --mz is the live zoom factor. The map scales; the chart's furniture does
     not, so anything that must hold its size on screen divides by it. Strokes
     use non-scaling-stroke, which does the same job natively. */
  svg.map{ display:block; width:100%; height:100%; --mz:1; touch-action:pan-y; }
  svg.map.grabbing{ cursor:grabbing; }

  /* Standing caveat — PRD 08 binding rule 2. Present in every era view. */
  .caveat{
    position:absolute; left:16px; bottom:12px; pointer-events:none;
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.09em;
    text-transform: uppercase; color: var(--ink-3); max-width: 46ch; line-height:1.5;
  }
  .caveat b{ color: var(--gold); font-weight:600; }

  .era-badge{
    position:absolute; left:16px; top:14px; pointer-events:none;
  }
  .era-badge .yr{
    font-family:'IBM Plex Mono', monospace; font-size:1.55rem; font-weight:600;
    color: var(--ink-1); line-height:1; letter-spacing:-0.01em;
  }
  .era-badge .nm{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.13em;
    text-transform: uppercase; color: var(--gold); margin-top:6px; font-weight:600;
  }
  .era-badge .ct{ font-size:0.74rem; color: var(--ink-3); margin-top:3px; }

  .legend-map{
    position:absolute; right:14px; top:14px; pointer-events:none;
    display:grid; gap:5px; justify-items:end;
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.05em;
    color: var(--ink-3);
  }
  .legend-map div{ display:flex; align-items:center; gap:7px; }
  .legend-map i{ width:22px; height:0; display:block; flex-shrink:0; }
  .lg-bloom{ height:9px; border-radius:2px; background: linear-gradient(90deg, var(--bloom-swatch), transparent); }
  .lg-hard{ height:9px; border-radius:2px; border:1px solid var(--colonial); background: var(--colonial-fill); }
  .lg-route{ border-top:1.5px dashed var(--route); }

  /* Zoom controls, typographic like the rest of the plate: a plus, a minus,
     and a readout that doubles as the way back to the whole archipelago. */
  .zoom-ctl{ position:absolute; right:14px; bottom:14px; display:grid; gap:4px; }
  .zoom-ctl button{
    appearance:none; cursor:pointer; padding:0; width:30px; height:26px; line-height:1;
    background: var(--panel-bg); border:1px solid var(--line); border-radius:6px;
    color: var(--ink-2); font:inherit; font-weight:600; font-size:0.82rem;
    transition: color .14s, border-color .14s;
  }
  .zoom-ctl button:hover:not(:disabled){ color: var(--ink-1); border-color: var(--ink-3); }
  .zoom-ctl button:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }
  .zoom-ctl button:disabled{ opacity:0.38; cursor:default; }
  #zoom-reset{
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.02em; height:22px; color: var(--ink-3);
  }

  /* ============================ Detail rail ============================ */
  .rail{
    border-left:1px solid var(--line);
    background: var(--surface);
    padding: 18px 20px 22px;
    overflow-y: auto;
    min-height: 0;
  }
  .rail-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600; margin-bottom:4px;
  }
  .rail h2{ font-size:1.12rem; letter-spacing:-0.005em; }
  .rail-count{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color: var(--gold); margin-top:5px; }
  .rail-empty{ color: var(--ink-3); font-size:0.86rem; line-height:1.6; margin-top:14px; }

  .ent-list{ display:grid; gap:9px; margin-top:15px; }
  .ent{
    --cat: var(--ink-3);
    background: var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:12px 14px; cursor:pointer; text-align:left;
    font:inherit; color:inherit; width:100%;
    transition: border-color .14s, background .14s;
  }
  .ent:hover{ background: var(--surface-3); }
  .ent:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }
  /* Selected = the power whose bloom you are looking at: a wash of its colour. */
  .ent.sel{ border-color: var(--gold); background: var(--sel-wash); }
  /* Timeline category as a leading mark, so the two views stay siblings. */
  .ent.c-classical{ --cat: var(--cat-classical); }
  .ent.c-islamic{ --cat: var(--cat-islamic); }
  .ent.c-colonial{ --cat: var(--colonial); }
  .ent.c-modern{ --cat: var(--cat-modern); }
  .ent .en{ font-weight:600; font-size:0.88rem; line-height:1.3; }
  .ent .en::before{
    content:''; display:inline-block; width:8px; height:8px; border-radius:50%;
    background: var(--cat); margin-right:8px; vertical-align:1px;
  }
  .ent .ey{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color: var(--ink-2); margin-top:3px; }
  .ent .ed{ font-size:0.82rem; color: var(--ink-2); line-height:1.55; margin-top:7px; display:none; }
  .ent.sel .ed{ display:block; }
  .ent .tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-2);
    border:1px solid var(--line); border-radius:3px; padding:1px 5px; margin-left:6px;
    vertical-align:1px;
  }
  .ent .conf{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color: var(--ink-3);
    margin-top:6px; display:none;
  }
  .ent.sel .conf{ display:block; }

  /* Why here / how power worked / how it ended — the study layer. Each answer
     is keyed by a hanging monospace label so the three read as a set. */
  .ent .lore{ display:none; margin-top:11px; }
  .ent.sel .lore{ display:grid; gap:9px; }
  .lore .lr{ font-size:0.82rem; color: var(--ink-2); line-height:1.6; }
  .lore .lk{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.13em; text-transform:uppercase; color: var(--ink-3);
    font-weight:600; margin-bottom:2px;
  }

  /* Prologue milestone list */
  .ms-list{ display:grid; gap:7px; margin-top:10px; }
  .ms{ display:grid; gap:1px; }
  .ms-y{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.06em;
    color: var(--gold); font-variant-numeric: tabular-nums;
  }
  .ms-n{ font-size:0.8rem; color: var(--ink-2); line-height:1.45; }
  .conf-inline{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.64rem;
    color: var(--ink-3); margin-top:6px;
  }

  /* Study mode blurs names until revealed (FR-7). */
  .app.study .ent .en, .app.study .ent .ey{ filter: blur(5px); transition: filter .13s; }
  .app.study .ent:hover .en, .app.study .ent:hover .ey,
  .app.study .ent.sel .en, .app.study .ent.sel .ey,
  .app.study .ent.rv .en, .app.study .ent.rv .ey{ filter:none; }
  .app.study .rlabel text{ filter: blur(calc(4px / var(--mz))); transition: filter .13s; }
  .app.study .rlabel.rv text, .app.study .rlabel:hover text{ filter:none; }

  .study-hint{
    font-size:0.76rem; color: var(--ink-2); line-height:1.55;
    margin-top:12px; display:none;
  }
  .app.study .study-hint{ display:block; }

  /* ============================ Scrubber ============================ */
  .scrub{
    background: var(--surface);
    border-top:1px solid var(--line);
    padding: 12px 22px 15px;
  }
  /* The scrubber rises into place as the door clears, so the reader lands
     on the control the last panel just told them to use. Clipped for the
     duration so the rise cannot hand the page a scrollbar. */
  .app.arriving{ overflow:hidden; }
  .app.arriving .scrub{ animation: scrubRise .62s var(--ease-out) both; }
  @keyframes scrubRise{
    from{ transform: translateY(100%); opacity:0 }
    to{ transform:none; opacity:1 }
  }

  /* The rail slides out and the map takes the room. */
  .stage{ position:relative; transition: grid-template-columns .42s var(--ease-out); overflow:hidden; }

  /* The panel's control rides the panel's own edge, so it is where the
     thing it operates is rather than buried in the header. Ink and
     hairline, like every other control on the plate. */
  .rail-tab{
    position:absolute; top:50%; right:336px; z-index:4;
    transform: translateY(-50%);
    width:22px; height:56px; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-2);
    background: var(--panel-bg);
    border:1px solid var(--line); border-right:none;
    border-radius:6px 0 0 6px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: right .42s var(--ease-out), color .14s var(--ease-out), border-color .14s var(--ease-out);
  }
  .rail-tab:hover{ color: var(--ink-1); border-color: var(--ink-3); }
  .rail-tab:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }
  .rail-tab svg{
    width:8px; height:14px; fill:none; stroke:currentColor;
    stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
    transform: rotate(180deg);
    transition: transform .42s var(--ease-out);
  }
  .app.rail-off .rail-tab{ right:0; }
  .app.rail-off .rail-tab svg{ transform:none; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .rail{ transition: transform .42s var(--ease-out), opacity .26s var(--ease-out); }
  .app.rail-off .stage{ grid-template-columns: minmax(0,1fr) 0px; }
  .app.rail-off .rail{ transform: translateX(100%); opacity:0; }
  .scrub-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:16px; margin-bottom:7px; flex-wrap:wrap;
  }
  .scrub-title{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600;
  }
  .scrub-hint{ font-size:0.72rem; color: var(--ink-3); }

  .track{ position: relative; height: 62px; }

  /* density histogram + engraved ruler live in one SVG behind the input */
  svg.ruler{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  input[type=range].era{
    -webkit-appearance:none; appearance:none;
    position:absolute; left:0; right:0; top:20px;
    width:100%; height:26px; margin:0; background:transparent; cursor:pointer;
  }
  input[type=range].era::-webkit-slider-runnable-track{ height:26px; background:transparent; }
  input[type=range].era::-moz-range-track{ height:26px; background:transparent; }
  input[type=range].era::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:15px; height:15px; border-radius:50%;
    background: var(--gold-warm); border:none; margin-top:5.5px;
    box-shadow: 0 0 0 4px var(--gold-glow-a), 0 0 14px 4px var(--gold-glow-b);
  }
  input[type=range].era::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%;
    background: var(--gold-warm); border:none;
    box-shadow: 0 0 0 4px var(--gold-glow-a), 0 0 14px 4px var(--gold-glow-b);
  }
  input[type=range].era:focus{ outline:none; }
  input[type=range].era:focus-visible::-webkit-slider-thumb{
    box-shadow: 0 0 0 3px var(--ground), 0 0 0 5px var(--ui-ring);
  }
  input[type=range].era:focus-visible::-moz-range-thumb{
    box-shadow: 0 0 0 3px var(--ground), 0 0 0 5px var(--ui-ring);
  }

  /* Era ticks are dots, not labels: 15 eras will not fit as text on a phone,
     and the badge above already names the current one. Each dot is a jump. */
  .era-names{ position:relative; height:28px; margin-top:3px; }
  /* The hit area is wider than the dot: 24px so a thumb can land on it. */
  .era-dot{
    position:absolute; top:-3px; transform: translateX(-50%);
    width:24px; height:20px; padding:0; border:none; background:transparent; cursor:pointer;
  }
  .era-dot::after{
    content:''; display:block; width:5px; height:5px; border-radius:50%;
    background: var(--ink-3); margin:7px auto 0; transition: background .14s var(--ease-out), transform .14s var(--ease-out);
  }
  .era-dot:hover::after{ background: var(--ink-2); }
  .era-dot.on::after{ background: var(--gold); transform: scale(1.55); }
  .era-dot:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:1px; border-radius:4px; }
  .era-cur{
    position:absolute; top:15px; transform: translateX(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; letter-spacing:0.08em;
    color: var(--gold); white-space:nowrap; pointer-events:none;
  }

  /* ============================ Map primitives ============================ */
  .land{ fill: var(--land); stroke: var(--land-edge); stroke-width:0.7; stroke-linejoin:round; vector-effect: non-scaling-stroke; }
  .graticule{ stroke: var(--grat); stroke-width:0.5; fill:none; vector-effect: non-scaling-stroke; }

  .region-hit{ fill: transparent; cursor:pointer; outline:none; }
  .region-hit:hover + .region-glow, .region-hit:focus-visible + .region-glow{ opacity:1; }
  .region-glow{
    fill: var(--glow-fill); stroke: var(--glow-stroke);
    stroke-width:0.8; stroke-dasharray:4 4; opacity:0; pointer-events:none; vector-effect: non-scaling-stroke;
    transition: opacity .16s;
  }
  .region-glow.sel{ opacity:1; fill: var(--glow-fill-sel); stroke: var(--glow-stroke-sel); stroke-dasharray:none; }
  .region-hit:focus-visible + .region-glow{ stroke: var(--ui-ring); stroke-width:1.4; stroke-dasharray:none; }

  .rlabel text{
    font-family:'IBM Plex Mono', monospace; font-size: calc(8.5px / var(--mz)); letter-spacing:0.11em;
    text-transform: uppercase; fill: var(--ink-3); text-anchor:middle;
    pointer-events:none; transition: fill .16s;
  }
  .rlabel.sel text, .rlabel.hot text{ fill: var(--ink-2); }

  /* screen on dark (adds light), multiply on paper (adds pigment) */
  .influence{ mix-blend-mode: var(--blend); pointer-events:none; }
  .bloom{ transition: opacity .3s var(--ease-out); }

  .hard{ pointer-events:none; }
  .hard .hp{
    fill: var(--colonial-fill); stroke: var(--colonial);
    stroke-width:0.9; stroke-linejoin:round; vector-effect: non-scaling-stroke;
    transition: opacity .3s var(--ease-out);
  }

  .route{
    fill:none; stroke: var(--route); stroke-width:1.1; stroke-dasharray:5 4; vector-effect: non-scaling-stroke;
    opacity:0.30; transition: opacity .3s var(--ease-out), stroke .3s var(--ease-out);
  }
  .route.hot{ opacity:0.95; stroke: var(--route-hi); stroke-width:1.5; }
  .route-label{
    font-family:'IBM Plex Mono', monospace; font-size: calc(7.5px / var(--mz)); letter-spacing:0.13em;
    text-transform:uppercase; fill: var(--route); opacity:0.5;
    pointer-events:none; transition: opacity .3s var(--ease-out), fill .3s var(--ease-out);
  }
  .route-label.hot{ opacity:1; fill: var(--route-hi); }

  /* ---- Faction overlays (1945-49, 1955, 1965-66) ----
     By the 1940s every side is drawing lines, including the Republic. So these
     render with harder edges than the mandala blooms — the same logic as PRD 08
     rule 4, carried forward. Where control was genuinely diffuse (guerrilla
     zones, party support) the edge stays dashed and the fill stays weak. */
  .ov{ pointer-events:none; }
  .ov-zone{ stroke-width:1.1; stroke-linejoin:round; fill-opacity:0.15; vector-effect: non-scaling-stroke; }
  .ov-zone.soft{ stroke-dasharray:5 4; fill-opacity:0.09; }
  .z-nat{ fill: var(--f-nat); stroke: var(--f-nat); }
  .z-islam{ fill: var(--f-islam); stroke: var(--f-islam); }
  .z-komunis{ fill: var(--f-komunis); stroke: var(--f-komunis); }
  .z-kristen{ fill: var(--f-kristen); stroke: var(--f-kristen); }
  .z-none{ fill: var(--f-none); stroke: var(--f-none); }
  .z-belanda{ fill: var(--colonial); stroke: var(--colonial); }

  /* The Van Mook Line was negotiated and surveyed — it gets a real edge. */
  .vanmook{ fill:none; stroke: var(--vanmook); stroke-width:1.6; stroke-dasharray:9 3 2 3; vector-effect: non-scaling-stroke; }
  .vanmook-label{
    font-family:'IBM Plex Mono', monospace; font-size: calc(7.5px / var(--mz)); letter-spacing:0.12em;
    text-transform:uppercase; fill: var(--vanmook); opacity:0.85;
  }

  .ov-mark circle{ fill:none; stroke-width:1.3; vector-effect: non-scaling-stroke; r: calc(var(--r,4.5) * 1px / var(--mz)); }
  .ov-mark text{
    font-family:'IBM Plex Mono', monospace; font-size: calc(7.5px / var(--mz)); letter-spacing:0.08em;
    fill: var(--ink-1); text-anchor:middle;
    paint-order: stroke; stroke: var(--halo); stroke-width: calc(2.6px / var(--mz)); stroke-linejoin:round;
    transform: translateY(calc(-9px / var(--mz)));
  }

  /* 1965-66 is rendered as intensity, never as territory. No bloom, no glow:
     a flat hatch that reads as a record rather than as power radiating. */
  .kill-zone{ stroke: var(--violence); stroke-width:1; fill:url(#hatch); vector-effect: non-scaling-stroke; }
  .kill-label{
    font-family:'IBM Plex Mono', monospace; font-size: calc(7px / var(--mz)); letter-spacing:0.1em;
    fill: var(--violence-text); text-anchor:middle;
    paint-order: stroke; stroke: var(--halo); stroke-width: calc(2.4px / var(--mz)); stroke-linejoin:round;
    transform: translateY(calc(11px / var(--mz)));
  }

  .ov-legend{
    position:absolute; left:16px; bottom:52px;
    background: var(--panel-bg); border:1px solid var(--line);
    border-radius:8px; padding:10px 13px; max-width: 330px;
    display:none;
  }
  .ov-legend.on{ display:block; }
  .ov-legend h4{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.13em;
    text-transform:uppercase; color: var(--gold); margin:0 0 6px; font-weight:600;
  }
  .ov-legend .rows{ display:grid; gap:4px; }
  .ov-legend .r{ display:flex; align-items:center; gap:8px; font-size:0.72rem; color: var(--ink-2); }
  .ov-legend .sw{ width:13px; height:9px; border-radius:2px; flex-shrink:0; border:1px solid var(--swatch-line); }
  .ov-legend .note{
    font-size:0.68rem; color: var(--ink-3); line-height:1.5; margin-top:8px;
    border-top:1px solid var(--line); padding-top:7px;
  }

  /* Overlay explainer in the rail. The 1965-66 variant is the one place the
     page raises its voice, and even there only by a border and a heading. */
  .ov-block{
    border:1px solid var(--accent-line);
    border-radius:8px; padding:12px 14px; margin-bottom:16px; background: var(--sel-wash);
  }
  .ov-block.grave{ border-color: var(--violence); background: oklch(from var(--violence) l c h / 0.06); }
  .ov-block h3{
    font-family:'Fraunces', Georgia, serif; font-size:0.98rem; margin:0 0 3px; line-height:1.25;
  }
  .ov-block .kicker{
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem; letter-spacing:0.13em;
    text-transform:uppercase; color: var(--gold); font-weight:600; margin-bottom:5px;
  }
  .ov-block.grave .kicker{ color: var(--violence-text); }
  .ov-block p{ font-size:0.82rem; color: var(--ink-2); line-height:1.6; margin:7px 0 0; }
  .ov-block .caution{
    font-size:0.78rem; color: var(--ink-2); line-height:1.6; margin-top:9px;
    border-top:1px solid var(--line); padding-top:8px;
  }
  .ov-block .caution b{ color: var(--f-komunis); font-weight:600; }
  .ov-rows{ display:grid; gap:4px; margin-top:9px; }
  .ov-rows .r{ display:flex; align-items:center; gap:8px; font-size:0.76rem; color: var(--ink-2); }
  .ov-rows .sw{ width:12px; height:12px; border-radius:3px; flex-shrink:0; border:1px solid var(--swatch-line); }
  .ov-rows .rr{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color: var(--ink-3); }

  /* Austronesian migration — a fifth channel again, because this is neither
     influence, control, nor party support. It is where everyone came from. */
  .mig{ pointer-events:none; }
  .mig path{
    fill:none; stroke: var(--mig); stroke-width:1.4; stroke-dasharray:7 5; opacity:0.8; vector-effect: non-scaling-stroke;
  }
  .mig text{
    font-family:'IBM Plex Mono', monospace; font-size: calc(8px / var(--mz)); letter-spacing:0.12em;
    text-transform:uppercase; fill: var(--mig-text); text-anchor:middle;
    paint-order: stroke; stroke: var(--halo); stroke-width: calc(2.6px / var(--mz)); stroke-linejoin:round;
  }

  .node{ pointer-events:none; transition: opacity .3s var(--ease-out); }
  .node circle{ fill: var(--gold-warm); r: calc(var(--r,2.6) * 1px / var(--mz)); }
  .node text{
    font-family:'IBM Plex Mono', monospace; font-size: calc(8px / var(--mz)); letter-spacing:0.06em;
    fill: var(--ink-1); text-anchor:middle;
    paint-order: stroke; stroke: var(--halo); stroke-width: calc(2.6px / var(--mz)); stroke-linejoin:round;
  }
  .app.study .node text{ filter: blur(calc(4px / var(--mz))); }
  .app.study .node.rv text{ filter:none; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      transition-duration: .001ms !important;
      animation-duration: .001ms !important;
    }
  }

  /* ============================ Landing ============================
     DESIGN.md §2, "The Landing / Introduction Surface": the front door,
     deliberately warmer than the plate. Frosted glass, a soft shadow and
     Accent Terracotta are permitted HERE and nowhere else; the moment the
     reader crosses into the map the strict rules resume.

     It is a fixed overlay with its OWN scroll container, which is what
     lets scroll drive the sequence without breaking "don't move the frame
     on the reader's behalf": the instrument underneath keeps every gesture
     it already claimed, and its viewBox is never touched from here. */
  body.landing-open{ overflow:hidden; }

  .landing{
    position:fixed; inset:0; z-index:60;
    overflow-y:auto; overflow-x:hidden;
    overscroll-behavior: contain;
    background: var(--ground);
    transition: opacity .5s var(--ease-out);
  }
  .landing[hidden]{ display:none; }
  .landing.dismissing{ opacity:0; pointer-events:none; }

  /* The stage stays put while the panels scroll over it. */
  .lsticky{ position:sticky; top:0; height:100dvh; overflow:hidden; background: var(--ocean); }
  .lmap{ display:block; width:100%; height:100%; }
  /* A ground wash so mono copy stays legible over land and bloom alike. */
  .lveil{
    position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, var(--ground) 0%, rgba(0,0,0,0) 62%);
    opacity:0.90;
  }

  .lpanels{ position:relative; z-index:1; margin-top:-100dvh; }
  .lpanel{
    min-height:100dvh; display:flex; align-items:center;
    padding: 88px clamp(20px, 7vw, 110px) 56px;
  }
  .lpanel[data-step="1"]{ align-items:flex-end; }
  .lpanel[data-step="3"]{ align-items:flex-start; }
  .lpanel-end{ justify-content:center; text-align:left; }

  .lcard{
    max-width: 46ch;
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:10px;
    padding: clamp(20px, 3vw, 32px);
    box-shadow: 0 22px 50px -26px rgba(12,11,9,0.55);
  }
  .lcard-wide{ max-width: 54ch; }

  .lkicker{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:0.62rem; font-weight:600; letter-spacing:0.15em; text-transform:uppercase;
    color: var(--terracotta); margin-bottom:14px;
  }
  .lcard h2{
    font-size: clamp(1.55rem, 3.4vw, 2.4rem); line-height:1.08; letter-spacing:-0.015em;
    color: var(--ink-1); margin-bottom:14px;
  }

  /* The opening panel is a headline, not a card. Brand register permits the
     typographic risk here, and the veil already puts near-solid ground under
     it, so the frosted panel would only shrink the type for nothing. */
  .lhero{
    background:none; border:0; box-shadow:none; padding:0; max-width:none;
    -webkit-backdrop-filter:none; backdrop-filter:none;
  }
  .lhero .lkicker{ font-size:0.68rem; margin-bottom:20px; }
  .lhero h2{
    font-size: clamp(2.5rem, 7.2vw, 5.4rem); line-height:0.96; letter-spacing:-0.035em;
    max-width: 14ch; margin-bottom:22px;
  }
  .lhero p{ font-size:1.02rem; line-height:1.55; max-width:46ch; }
  .lcard p{
    font-size:0.88rem; line-height:1.65; color: var(--ink-2); max-width:60ch; margin:0;
  }
  .lcard p + p{ margin-top:11px; }

  /* Staggered reveal: opacity and transform only. */
  .lreveal{
    opacity:0; transform: translateY(20px);
    transition: opacity .72s var(--ease-out), transform .72s var(--ease-out);
  }
  .lpanel.in .lreveal{ opacity:1; transform:none; }
  .lpanel.in .lreveal:nth-child(2){ transition-delay:.09s; }
  .lpanel.in .lreveal:nth-child(3){ transition-delay:.18s; }
  .lpanel.in .lreveal:nth-child(4){ transition-delay:.27s; }

  .lcue{ display:flex; align-items:center; gap:11px; margin-top:26px; }
  .lcue span{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:0.6rem; font-weight:600; letter-spacing:0.15em; text-transform:uppercase;
    color: var(--ink-3);
  }
  .lcue i{
    display:block; width:56px; height:1px; background: var(--terracotta);
    transform-origin:left center; animation: lcue 2.6s var(--ease-out) infinite;
  }
  @keyframes lcue{
    0%{ transform:scaleX(.18); opacity:.3 }
    52%{ transform:scaleX(1); opacity:1 }

  if (idN !== enN) console.warn('Peta Nusantara — bilingual string count mismatch', idN, enN);
})();

/* ==================================================================
   LORE — the study layer. Three questions per polity, in the order a
   learner actually needs them:

     why   — why HERE? the geographic logic. This is the map's thesis:
             most of these powers are explained by position.
     power — how power was actually exercised. Rarely territory; usually
             chokepoints, tribute, rice surplus, or monopoly.
     end   — how it ended, because that is what the timeline shows and
             the map cannot.

   Kept separate from DATA for the same reason MAPX is: the timeline owns
   the entity records, this file only annotates them.
   ================================================================== */
function L(wId, wEn, pId, pEn, eId, eEn){
  return { why:{id:wId, en:wEn}, power:{id:pId, en:pEn}, end:{id:eId, en:eEn} };
}

DATA.forEach(function(e, i){
  if (!e.hardEdge) return;
  var grp = el('g', { opacity:0 });
  LAND.forEach(function(ring, ri){
    /* include a landmass if any of its vertices fall within reach of a node */
    var pts = ring.split(' ');
    var within = false;
    for (var q=0; q<pts.length && !within; q+=2){
      var c = pts[q].split(',');
      var lo = +c[0], la = +c[1];
      within = e.nodes.some(function(n){
        var dx = lo - n.lon, dy = la - n.lat;
        return Math.sqrt(dx*dx + dy*dy) <= e.reach;
      });
    }
    if (within) grp.appendChild(el('polygon', { class:'hp', points:LAND_PTS[ri] }));
  });
  gHard.appendChild(grp);
  hardNodes[i] = grp;
});
svg.appendChild(gHard);

/* --- sea lanes --- */

var routeNodes = {};
ROUTES.forEach(function(r){

/* --- influence bloom, screen-blended so overlaps add like light --- */
var gInf = el('g', { class:'influence' });
var bloomNodes = {};
DATA.forEach(function(e, i){
  if (e.hardEdge && e.wide) return;      /* archipelago-wide powers use the hard edge instead */
  var grp = el('g', { class:'bloom', opacity:0 });
  e.nodes.forEach(function(n){
    var mult = n.kind === 'capital' ? 1 : (n.kind === 'port' ? 0.72 : 0.55);
    var r = e.reach * TIER_SCALE[e.conf] * mult * VIEW.k;
    grp.appendChild(el('circle', {
      cx:px(n.lon).toFixed(1), cy:py(n.lat).toFixed(1), r:r.toFixed(1),

});

/* --- which region does each landmass belong to? Used so the election and
       1965-66 layers tint actual land rather than the region rectangles,
       which would flood the sea with colour. --- */
var RING_REGION = LAND.map(function(ring){
  var pts = ring.split(' '), sx = 0, sy = 0, n = 0;
  for (var i=0;i<pts.length;i++){
    var c = pts[i].split(',');
    sx += +c[0]; sy += +c[1]; n++;
  }
  var clon = sx/n, clat = sy/n, hit = null;
  for (var r=0;r<REGIONS.length;r++){
    if (pointInPoly(clon, clat, REGIONS[r].poly)){ hit = REGIONS[r].id; break; }
  }
  return hit;
});

function activeOverlay(y){
  if (y >= 1945 && y <= 1949){
    var ph = null;
    for (var i=0;i<REV_PHASES.length;i++){
      if (y >= REV_PHASES[i].from && y <= REV_PHASES[i].to){ ph = REV_PHASES[i]; break; }
    }
    return { id:'revolusi', phase:ph };
  }
  if (y >= 1955 && y <= 1958) return { id:'pemilu55' };
  if (y >= 1965 && y <= 1966) return { id:'killings' };
  return null;
}

function poly2pts(poly){
  return poly.map(function(p){ return px(p[0]).toFixed(1) + ',' + py(p[1]).toFixed(1); }).join(' ');
}

var ovSig = null;
function buildOverlay(ov){
  var sig = ov ? (ov.id + ':' + (ov.phase ? ov.phase.from : '') + ':' + S.lang) : 'none';
  if (sig === ovSig) return;
  ovSig = sig;
  while (gOv.firstChild) gOv.removeChild(gOv.firstChild);
  if (!ov) return;

  if (ov.id === 'revolusi' && ov.phase){
    var ph = ov.phase;

    /* Dutch claim first, so republican zones read as sitting inside it. */
    if (ph.dutchAll){
      LAND_PTS.forEach(function(p){
        gOv.appendChild(el('polygon', { class:'ov-zone z-belanda', points:p }));
      });
    }
    (ph.zones || []).forEach(function(z){
      gOv.appendChild(el('polygon', {
        class:'ov-zone z-' + z.fac + (z.soft ? ' soft' : ''), points:poly2pts(z.poly)
      }));
    });
    (ph.dutchDots || []).forEach(function(d){
      gOv.appendChild(el('circle', {
        cx:px(d[0]).toFixed(1), cy:py(d[1]).toFixed(1), r:4.5,
        class:'dutch-dot'
      }));
    });
    (ph.vanmook || []).forEach(function(poly){
      gOv.appendChild(el('polygon', { class:'vanmook', points:poly2pts(poly) }));
      var t = el('text', { class:'vanmook-label',
        x:px(110.6).toFixed(1), y:py(-8.7).toFixed(1), 'text-anchor':'middle' });
      t.textContent = S.lang === 'id' ? 'GARIS VAN MOOK · RENVILLE 1948' : 'VAN MOOK LINE · RENVILLE 1948';
      gOv.appendChild(t);
    });
  }

  if (ov.id === 'pemilu55'){
    LAND.forEach(function(ring, ri){
      var reg = RING_REGION[ri];
      var e = reg && PEMILU55[reg];
      if (!e) return;
      gOv.appendChild(el('polygon', { class:'ov-zone z-' + e.fac, points:LAND_PTS[ri] }));
    });
  }

  if (ov.id === 'killings'){
    var kset = {};
    KILL_ZONES.forEach(function(k){ kset[k.region] = k; });
    LAND.forEach(function(ring, ri){
      if (!kset[RING_REGION[ri]]) return;
      gOv.appendChild(el('polygon', { class:'kill-zone', points:LAND_PTS[ri] }));
    });
    KILL_ZONES.forEach(function(k){
      var reg = REGIONS.filter(function(r){ return r.id === k.region; })[0];
      if (!reg) return;
      var t = el('text', { class:'kill-label',
        x:px(reg.lab[0]).toFixed(1), y:py(reg.lab[1]).toFixed(1) });
      t.textContent = k.note[S.lang];
      gOv.appendChild(t);
    });
  }
}

var markSig = null;
function buildMarks(y){
  var act = [];
  MARKS.forEach(function(m, i){ if (y >= m.from && y <= m.to) act.push(i); });
  var sig = act.join(',') + ':' + S.lang;
  if (sig === markSig) return;
  markSig = sig;
  while (gMarks.firstChild) gMarks.removeChild(gMarks.firstChild);

  var COL = { nat:'var(--f-nat)', islam:'var(--f-islam)', komunis:'var(--f-komunis)', violence:'var(--violence)' };
  act.forEach(function(i){
    var m = MARKS[i];
    var g = el('g', { class:'ov-mark' });
    g.appendChild(el('circle', {
      cx:px(m.lon).toFixed(1), cy:py(m.lat).toFixed(1), r:5.5, style:'--r:5.5;stroke:' + (COL[m.fac] || 'var(--gold)')
    }));
    g.appendChild(el('circle', {
      cx:px(m.lon).toFixed(1), cy:py(m.lat).toFixed(1), r:1.8,
      style:'--r:1.8;fill:' + (COL[m.fac] || 'var(--gold)'), stroke:'none'
    }));
    var t = el('text', { x:px(m.lon).toFixed(1), y:py(m.lat).toFixed(1) });
    t.textContent = m.label[S.lang];
    g.appendChild(t);
    gMarks.appendChild(g);
  });
}

/* --- region hit + highlight layer. Hit areas are their own layer so
       Ternate and Tidore stay tappable at true scale (NFR-5). --- */

/* ==================================================================
   SCRUBBER — engraved ruler + density track
   ================================================================== */
var ruler = document.getElementById('ruler');
var range = document.getElementById('era-range');
var eraNames = document.getElementById('era-names');
var RW = 1000, RH = 62;                 /* ruler is drawn in its own units and stretched */
ruler.setAttribute('viewBox', '0 0 ' + RW + ' ' + RH);
function rx(pos){ return (pos / PMAX) * RW; }

(function buildRuler(){
  /* density: how many entities are active at each sample. Sparse centuries
     then read as "little recorded here" rather than broken UI (FR-8c). */
  var SAMPLES = 200, counts = [], max = 0;
  for (var i=0;i<SAMPLES;i++){
    var y = yearFromPos((i + 0.5) / SAMPLES * PMAX);
    var c = 0;
    DATA.forEach(function(e){ if (activeAt(e, y)) c++; });
    counts.push(c); if (c > max) max = c;
  }
  var gd = el('g');
  var bw = RW / SAMPLES;
  counts.forEach(function(c, i){
    var h = max ? (c / max) * 20 : 0;
    gd.appendChild(el('rect', {
      x:(i*bw).toFixed(2), y:(20 - h).toFixed(2), width:(bw + 0.35).toFixed(2), height:h.toFixed(2),
      class:'dens'
    }));
  });
  ruler.appendChild(gd);

  /* engraved ruler: dense hairline minors, sparse taller majors */
  var gt = el('g');
  gt.appendChild(el('line', { x1:0, y1:33, x2:RW, y2:33, class:'rl-base' }));
  SEGMENTS.forEach(function(s){
    var minor = s.step / 2;
    for (var y = s.yStart; y <= s.yEnd; y += minor){
      var isMajor = (y % s.step === 0);
      var X = rx(posFromYear(y));
      gt.appendChild(el('line', {
        x1:X.toFixed(2), y1:33, x2:X.toFixed(2), y2:(isMajor ? 41 : 37).toFixed(2),
        class: isMajor ? 'rl-major' : 'rl-minor'
      }));
    }
  });
  ruler.appendChild(gt);

  /* scale-break marks: the scale changes, so the UI says so (FR-8a) */
  var gb = el('g');
  [SEGMENTS[1].pStart, SEGMENTS[2].pStart].forEach(function(p){
    var X = rx(p);
    gb.appendChild(el('line', { x1:X.toFixed(2), y1:8, x2:X.toFixed(2), y2:47,
      class:'rl-break' }));
  });
  ruler.appendChild(gb);

  /* throughline + handle bloom, so the current position is findable
     without hunting for the disc */
  var gh = el('g');
  var thr = el('line', { id:'thr', x1:0, y1:4, x2:0, y2:52 });
  gh.appendChild(thr);
  ruler.appendChild(gh);
  ruler._thr = thr;

  /* year labels under the majors, one per segment boundary + a few anchors */
  var gl = el('g');
  [300, 1000, 1500, 1800, 1945, NOW].forEach(function(y){
    var X = rx(posFromYear(y));
    var anchor = y === 300 ? 'start' : (y === NOW ? 'end' : 'middle');
    var t = el('text', { x:X.toFixed(2), y:57, 'text-anchor':anchor,
      class:'rl-lab' });
    t.textContent = y === NOW ? String(NOW) : String(y);
    gl.appendChild(t);
  });
  ruler.appendChild(gl);
})();

/* Era ticks: clickable dots, with only the active era named beneath. */
var eraCur = document.createElement('div');
eraCur.className = 'era-cur';
ERAS.forEach(function(era, i){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'era-dot';
  b.style.left = ((posFromYear(era.y) / PMAX) * 100).toFixed(3) + '%';
  b.dataset.i = i;
  b.addEventListener('click', function(){ setYear(ERAS[i].y); });
  eraNames.appendChild(b);
});
eraNames.appendChild(eraCur);

function currentEra(){
  var found = ERAS[0];
  for (var i=0;i<ERAS.length;i++) if (S.year >= ERAS[i].y) found = ERAS[i];
  return found;
}
function nearestEraIndex(year){
  var best = 0, bd = Infinity;
  ERAS.forEach(function(e, i){
    var d = Math.abs(posFromYear(e.y) - posFromYear(year));
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}

/* Free scrub while dragging; the handle settles on an era on release. */
range.addEventListener('input', function(){
  S.year = yearFromPos(+range.value);
  render();
});
/* The handle used to settle on the nearest era when released, which meant
   the only reachable years were the 17 in ERAS. Across the 371-year gap
   between 671 and 1042 that discarded everything in between, and five
   polities became unreachable outright: Tarumanagara, the Sailendra
   dynasty, Ancient Mataram, Singhasari and Pajang. Borobudur and
   Prambanan had no year you could stand on. The dots below are still one
   jump each, and the arrow keys still step era to era, so the nameable
   states are not lost; the scrubber simply keeps the year you chose. */
range.addEventListener('keydown', function(ev){
  /* Shift steps year by year, for a reader aiming at a specific date. */
  if (ev.shiftKey) return;
  var idx = nearestEraIndex(S.year), next = null;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp'){
    next = Math.min(ERAS.length - 1, S.year >= ERAS[idx].y && idx < ERAS.length-1 ? idx + 1 : idx);
  } else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown'){
    next = Math.max(0, S.year <= ERAS[idx].y ? idx - 1 : idx);
  } else if (ev.key === 'Home'){ next = 0; }
  else if (ev.key === 'End'){ next = ERAS.length - 1; }
  if (next !== null){ ev.preventDefault(); setYear(ERAS[next].y); }
});

function setYear(y){
  S.year = y;
  range.value = Math.round(posFromYear(y));
  LS.set('nusantara-map-year', String(y));
  render();
}

/* ==================================================================
   SELECTION
   ================================================================== */
var hotRegion = null;
function setHot(id, on){
  hotRegion = on ? id : null;
  var n = labelNodes[id];
  if (n) n.g.classList.toggle('hot', on);
}
function selectRegion(id){
  S.region = id;
  S.entity = null;
  var n = labelNodes[id];
  if (n) n.g.classList.add('rv');
  render();
}
function clearSelection(){
  S.region = null; S.entity = null;
  render();
}
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape') clearSelection();
});

/* ==================================================================
   RENDER
   ================================================================== */
var rail = document.getElementById('rail');
var badgeYear = document.getElementById('badge-year');
var badgeEra = document.getElementById('badge-era');
var badgeCount = document.getElementById('badge-count');

function render(){
  var y = S.year;
  var ov = activeOverlay(y);

  /* --- map layers --- */
  var activeRouteIds = {};
  var activeCount = 0;
  DATA.forEach(function(e, i){
    var on = activeAt(e, y);
    if (on){
      activeCount++;
      e.routes.forEach(function(r){ activeRouteIds[r] = true; });
    }
    if (bloomNodes[i]) bloomNodes[i].setAttribute('opacity', on ? 1 : 0);
    /* While a faction overlay owns the map, the generic colonial hard edge
       would draw violet over every landmass and fight it. The overlay is the
       more precise statement for these years, so it wins. */
    if (hardNodes[i]) hardNodes[i].setAttribute('opacity', (on && !ov) ? 1 : 0);
    if (entNodeEls[i]) entNodeEls[i].setAttribute('opacity', on ? 0.9 : 0);
  });

  ROUTES.forEach(function(r){
    var n = routeNodes[r.id];
    var show = S.routes;
    n.path.style.display = show ? '' : 'none';
    n.text.style.display = show ? '' : 'none';
    n.path.classList.toggle('hot', !!activeRouteIds[r.id]);
    n.text.classList.toggle('hot', !!activeRouteIds[r.id]);
    n.text.textContent = r.label[S.lang];
  });

  REGIONS.forEach(function(r){
    var n = regionNodes[r.id], l = labelNodes[r.id];
    n.glow.classList.toggle('sel', S.region === r.id);
    l.g.classList.toggle('sel', S.region === r.id);
    l.text.textContent = r.label[S.lang];
    n.hit.setAttribute('aria-label', r.label[S.lang]);
  });

  /* --- era badge --- */
  var era = currentEra();
  badgeYear.textContent = y >= NOW ? String(NOW) : String(y);
  badgeEra.textContent = era[S.lang];
  badgeCount.textContent = activeCount + ' ' + T('entities');

  /* --- era dots: only the active one is named --- */
  var curIdx = ERAS.indexOf(era);
  Array.prototype.forEach.call(eraNames.querySelectorAll('.era-dot'), function(b, i){
    b.classList.toggle('on', i === curIdx);
    b.setAttribute('aria-label', ERAS[i][S.lang] + ' · ' + ERAS[i].y);
    b.title = ERAS[i][S.lang];
  });
  eraCur.textContent = era[S.lang];
  var curPct = (posFromYear(era.y) / PMAX) * 100;
  eraCur.style.left = Math.min(93, Math.max(7, curPct)).toFixed(2) + '%';

  /* --- faction overlays --- */
  buildOverlay(ov);
  buildMarks(y);
  renderOverlayLegend(ov);

  /* --- prologue: before any kingdom is recorded --- */
  var prologue = y < 350;
  gMig.style.display = prologue ? '' : 'none';
  migText.textContent = T('migrationLabel');

  /* --- scrubber throughline --- */
  var X = rx(posFromYear(y));
  ruler._thr.setAttribute('x1', X.toFixed(2));
  ruler._thr.setAttribute('x2', X.toFixed(2));

  renderRail();
}

var FAC_HEX = { nat:'var(--f-nat)', islam:'var(--f-islam)', komunis:'var(--f-komunis)', kristen:'var(--f-kristen)', none:'var(--f-none)', belanda:'var(--colonial)' };
var ovLegendEl = document.getElementById('ov-legend');

function renderOverlayLegend(ov){
  if (!ov){ ovLegendEl.classList.remove('on'); ovLegendEl.innerHTML = ''; return; }
  var title, rows = [], note;

  if (ov.id === 'revolusi'){
    title = T('ovRevolusi');
    rows = [['nat', T('facNat')], ['belanda', T('facBelanda')]];
    if (S.year === 1948) rows.push(['komunis', T('facKomunis')]);
    if (S.year >= 1949) rows.push(['islam', T('facIslam')]);
    note = T('ovRevolusiNote');
  } else if (ov.id === 'pemilu55'){
    title = T('ovPemilu');
    rows = [['nat','PNI'], ['islam','Masyumi · NU'], ['kristen', T('facKristen')], ['none', T('facNone')]];
    note = T('ovPemiluNote');
  } else {
    title = T('ovKill');
    rows = [];
    note = T('ovKillNote');
  }

  var html = '<h4>' + esc(title) + '</h4>';
  if (rows.length){
    html += '<div class="rows">';
    rows.forEach(function(r){
      html += '<div class="r"><span class="sw" style="background:' + FAC_HEX[r[0]] + '"></span>' + esc(r[1]) + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="note">' + esc(note) + '</div>';
  ovLegendEl.innerHTML = html;
  ovLegendEl.classList.add('on');
}

/* The rail carries the substance. The legend is a key; this is the argument. */
function overlayBlockHtml(ov){
  if (!ov) return '';

  if (ov.id === 'revolusi'){
    var ph = ov.phase;
    if (!ph) return '';
    var h = '<div class="ov-block">' +
      '<div class="kicker">' + esc(T('ovRevolusi')) + '</div>' +
      '<h3>' + esc(ph.title[S.lang]) + '</h3>' +
      '<p>' + esc(ph.body[S.lang]) + '</p>';
    if (S.year === 1948){
      h += '<div class="caution"><b>' + esc(T('facKomunis')) + '.</b> ' + esc(T('pkiNote')) + '</div>';
    }
    return h + '</div>';
  }

  if (ov.id === 'pemilu55'){
    var h2 = '<div class="ov-block">' +
      '<div class="kicker">' + esc(T('ovPemilu')) + '</div>' +
      '<h3>' + esc(S.lang === 'id' ? 'Empat blok, satu peta' : 'Four blocs, one map') + '</h3>' +
      '<p>' + esc(T('ovPemiluNote')) + '</p>';
    /* Runner-up is where the PKI actually lives on this map. */

/* ==================================================================
   ZOOM + PAN

   The plate is something you lean over, not a camera that flies. Only the
   viewBox moves: every layer keeps its map coordinates, and --mz tells the
   CSS how far to counter-scale the furniture so labels, hairlines and node
   dots hold their size on screen while the geography grows. Blooms are the
   deliberate exception. A sphere of influence has real extent, so it scales
   with the land it covers.
   ================================================================== */
var mapWrap = document.querySelector('.map-wrap');
var zBtnIn  = document.getElementById('zoom-in');
var zBtnOut = document.getElementById('zoom-out');
var zBtnRst = document.getElementById('zoom-reset');
var ZMIN = 1, ZMAX = 8, ZSTEP = 1.5;
var VB = { x:0, y:0, w:W, h:H };
var zTween = null, zFallback = null;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function zNow(){ return W / VB.w; }

function applyView(){
  /* Never let the frame leave the plate. At 1x this pins it to the origin. */
  VB.x = Math.max(0, Math.min(W - VB.w, VB.x));
  VB.y = Math.max(0, Math.min(H - VB.h, VB.y));
  svg.setAttribute('viewBox', VB.x.toFixed(2) + ' ' + VB.y.toFixed(2) + ' ' + VB.w.toFixed(2) + ' ' + VB.h.toFixed(2));
  var z = zNow(), zoomed = z > 1.001;
  svg.style.setProperty('--mz', z.toFixed(4));
  /* At the default frame the page owns touch, so the map never traps a
     scroll. Once zoomed the map takes it: one finger pans, two pinch. */
  svg.style.touchAction = zoomed ? 'none' : 'pan-y';
  svg.style.cursor = zoomed ? 'grab' : '';
  zBtnOut.disabled = !zoomed;
  zBtnRst.disabled = !zoomed;
  zBtnIn.disabled  = z >= ZMAX - 1e-4;
  zBtnRst.textContent = (z < 10 ? z.toFixed(1) : String(Math.round(z))) + '\u00d7';
}

function toMap(clientX, clientY){
  var m = svg.getScreenCTM();
  if (!m) return { x: VB.x + VB.w / 2, y: VB.y + VB.h / 2 };
  var p = svg.createSVGPoint();
  p.x = clientX; p.y = clientY;
  return p.matrixTransform(m.inverse());
}

/* Zoom about a fixed map point, so the thing under the cursor stays put. */
function zoomTo(z, ax, ay){
  z = Math.max(ZMIN, Math.min(ZMAX, z));
  if (ax == null){ ax = VB.x + VB.w / 2; ay = VB.y + VB.h / 2; }
  var fx = (ax - VB.x) / VB.w, fy = (ay - VB.y) / VB.h;
  VB.w = W / z; VB.h = H / z;
  VB.x = ax - fx * VB.w; VB.y = ay - fy * VB.h;
  applyView();
}

function stopTween(){
  if (zTween){ cancelAnimationFrame(zTween); zTween = null; }
  if (zFallback){ clearTimeout(zFallback); zFallback = null; }
}

function zoomAnim(target){
  target = Math.max(ZMIN, Math.min(ZMAX, target));
  stopTween();
  var from = zNow();
  if (REDUCED || Math.abs(target - from) < 1e-4){ zoomTo(target); return; }
  var ax = VB.x + VB.w / 2, ay = VB.y + VB.h / 2, t0 = 0;
  /* Frames are paused in a background tab, and a press that quietly does
     nothing is worse than one that skips the tween. Land it either way. */
  zFallback = setTimeout(function(){ zFallback = null; stopTween(); zoomTo(target, ax, ay); }, 400);
  zTween = requestAnimationFrame(function step(ts){
    if (!t0) t0 = ts;
    var k = Math.min(1, (ts - t0) / 180);
    zoomTo(from + (target - from) * (1 - Math.pow(1 - k, 3)), ax, ay);
    if (k < 1){ zTween = requestAnimationFrame(step); }
    else { zTween = null; clearTimeout(zFallback); zFallback = null; }
  });
}

zBtnIn.addEventListener('click',  function(){ zoomAnim(zNow() * ZSTEP); });
zBtnOut.addEventListener('click', function(){ zoomAnim(zNow() / ZSTEP); });
zBtnRst.addEventListener('click', function(){ zoomAnim(ZMIN); });

mapWrap.addEventListener('wheel', function(ev){
  var d = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 400 : 1);
  var next = zNow() * Math.pow(1.0018, -d);
  /* Already at the full frame and still scrolling out: let the page have it. */
  if (next <= ZMIN && zNow() <= ZMIN) return;
  ev.preventDefault();
  stopTween();
  var a = toMap(ev.clientX, ev.clientY);
  zoomTo(next, a.x, a.y);
}, { passive:false });

/* Drag to pan, two fingers to pinch. A drag that travelled is not a click,
   so aiming at Sumatra and missing never selects the wrong region.

   A lone finger at the fitted frame belongs to the page's own vertical
   scroll: we still record it (so a second finger can be recognised as a
   pinch pair) but don't let it move the map. touchIdle tracks that case;
   it is recomputed whenever the finger count changes, so a pinch that
   zooms in and then drops to one finger hands off straight into panning,
   the way a normal map app does. */
var pts = {}, nPts = 0, lastPt = null, pinchDist = 0, travelled = 0, touchIdle = false;

function livePts(){
  var out = [];
  for (var k in pts) if (pts.hasOwnProperty(k)) out.push(pts[k]);
  return out;
}

svg.addEventListener('pointerdown', function(ev){
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  pts[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
  nPts++;
  if (nPts === 1){
    lastPt = { x:ev.clientX, y:ev.clientY }; travelled = 0;
    touchIdle = (ev.pointerType !== 'mouse' && zNow() <= 1.001);
  } else if (nPts === 2){
    touchIdle = false; /* two fingers is always a deliberate pinch */
    var p = livePts();
    pinchDist = Math.sqrt(Math.pow(p[1].x - p[0].x, 2) + Math.pow(p[1].y - p[0].y, 2));
  }
  stopTween();
});

svg.addEventListener('pointermove', function(ev){
  if (!pts[ev.pointerId]) return;
  pts[ev.pointerId].x = ev.clientX; pts[ev.pointerId].y = ev.clientY;

  if (nPts >= 2){
    var p = livePts();
    var d = Math.sqrt(Math.pow(p[1].x - p[0].x, 2) + Math.pow(p[1].y - p[0].y, 2));
    if (pinchDist > 0 && d > 0){
      var a = toMap((p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2);
      zoomTo(zNow() * (d / pinchDist), a.x, a.y);
    }
    pinchDist = d;
    travelled = 99;
    return;
  }

  if (!lastPt || touchIdle) return;
  var m = svg.getScreenCTM();
  if (!m || !m.a) return;
  var dx = ev.clientX - lastPt.x, dy = ev.clientY - lastPt.y;
  travelled += Math.abs(dx) + Math.abs(dy);
  VB.x -= dx / m.a; VB.y -= dy / m.d;
  lastPt.x = ev.clientX; lastPt.y = ev.clientY;
  if (travelled > 4) svg.classList.add('grabbing');
  applyView();
});

function endPointer(ev){
  if (pts[ev.pointerId]){ delete pts[ev.pointerId]; nPts = Math.max(0, nPts - 1); }
  if (nPts < 2) pinchDist = 0;
  if (nPts === 1){
    /* One finger remains after a pinch, or after a second touch lifted.
       Re-arm panning from wherever the zoom level actually landed. */
    var rem = livePts()[0];
    if (rem) lastPt = { x:rem.x, y:rem.y };
    touchIdle = zNow() <= 1.001;
  }
  if (nPts === 0){ lastPt = null; svg.classList.remove('grabbing'); }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', endPointer);

svg.addEventListener('click', function(ev){
  if (travelled > 4){ ev.stopPropagation(); ev.preventDefault(); travelled = 0; }
}, true);

mapWrap.addEventListener('keydown', function(ev){
  var step = VB.w * 0.18;
  if (ev.key === '+' || ev.key === '=') zoomAnim(zNow() * ZSTEP);
  else if (ev.key === '-' || ev.key === '_') zoomAnim(zNow() / ZSTEP);
  else if (ev.key === '0') zoomAnim(ZMIN);
  else if (ev.key === 'ArrowLeft'){ VB.x -= step; applyView(); }
  else if (ev.key === 'ArrowRight'){ VB.x += step; applyView(); }
  else if (ev.key === 'ArrowUp'){ VB.y -= step; applyView(); }
  else if (ev.key === 'ArrowDown'){ VB.y += step; applyView(); }
  else return;
  ev.preventDefault();
});

applyView();

/* ==================================================================
   THE LANDING — the front door (DESIGN.md §2)

   Scroll drives a camera over three islands, one per beat of the
   argument: Sumatra for position, Java for uncertainty, Borneo for the
   surveyed line. Each beat draws the entity it is actually about, read
   out of DATA rather than redrawn, so the door cannot drift from the
   plate behind it.

   This moves a frame, which the plate forbids. It is allowed here for
   two reasons: it is not the instrument's frame (the map's own viewBox
   is never touched from this module, and the landing is a separate SVG
   on a separate surface), and the reader drives it by scrolling rather
   than having it moved under an aim. The only camera move the reader
   does not drive is the closing zoom out, and that one answers a click.

   The imagery is the chart drawing itself. No photograph: heritage
   decoration is a stated anti-reference, and the marks are the
   argument.
   ================================================================== */
(function(){
  var landing = document.getElementById('landing');
  if (!landing) return;

  var lsvg = document.getElementById('lmap');
  lsvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  /* ---- the camera ---------------------------------------------- */
  var ASPECT = W / H;

  /* Frame an island whole. The box is grown, never cropped, to reach
     the plate's aspect, because "do not crop the archipelago to fill a
     box" governs the geography on this surface too. */
  function shot(west, east, south, north){
    var x0 = px(west), x1 = px(east), y0 = py(north), y1 = py(south);
    var w = x1 - x0, h = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    if (w / h < ASPECT) w = h * ASPECT; else h = w / ASPECT;
    return { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
  }

  var FULL    = { x:0, y:0, w:W, h:H };
  var SUMATRA = shot( 94.4, 107.6, -6.6,  6.4);
  var JAVA    = shot(104.6, 118.6, -9.4, -4.8);
  var BORNEO  = shot(108.5, 119.5, -1.0,  7.4);

  /* Pull a frame back toward the plate without reaching it. */
  function eased(base, factor){
    var w = base.w / factor, h = base.h / factor;
    return { x: base.x + (base.w - w) / 2, y: base.y + (base.h - h) / 2, w:w, h:h };
  }

  /* One keyframe per panel. The last card pulls back to the archipelago
     but stops just short of the plate, so the closing click still has
     somewhere to travel. At 1.25x the whole chain stays in frame, Aceh
     and Timor included, and the click is a settle rather than a reveal. */
  var ARCHIPELAGO = eased(FULL, 1.25);
  var SHOTS = [FULL, SUMATRA, JAVA, BORNEO, ARCHIPELAGO];

  var marks = [];              /* node dots and captions, counter-scaled */

  function applyCam(vb){
    lsvg.setAttribute('viewBox',
      vb.x.toFixed(1) + ' ' + vb.y.toFixed(1) + ' ' + vb.w.toFixed(1) + ' ' + vb.h.toFixed(1));
    /* The Furniture Holds Rule: zoom scales the geography, never the
       chart's furniture. Blooms are the deliberate exception, because
       their extent is a claim about the world. */
    var z = W / vb.w;
    lsvg.style.setProperty('--lz', z.toFixed(3));
    var r = 3 / z, dy = 9 / z;
    for (var i = 0; i < marks.length; i++){
      marks[i].c.setAttribute('r', r.toFixed(2));
      marks[i].t.setAttribute('y', (marks[i].y - dy).toFixed(2));
    }
  }

  function lerpBox(a, b, t){
    return { x:a.x + (b.x-a.x)*t, y:a.y + (b.y-a.y)*t,
             w:a.w + (b.w-a.w)*t, h:a.h + (b.h-a.h)*t };
  }
  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function camAt(s){
    var i = Math.max(0, Math.min(SHOTS.length - 2, Math.floor(s)));
    var t = clamp01(s - i);
    return lerpBox(SHOTS[i], SHOTS[i+1], 1 - Math.pow(1 - t, 3));
  }

  /* ---- stage: the same geometry and the same marks as the plate ---- */
  var lGrat = el('g', { class:'graticule' });
  for (var lo = 95; lo <= 140; lo += 5) lGrat.appendChild(el('line', { x1:px(lo), y1:0, x2:px(lo), y2:H }));
  for (var la = 5; la >= -10; la -= 5) lGrat.appendChild(el('line', { x1:0, y1:py(la), x2:W, y2:py(la) }));
  lsvg.appendChild(lGrat);

  var lLand = el('g');
  LAND_PTS.forEach(function(p){ lLand.appendChild(el('polygon', { class:'land', points:p })); });
  lsvg.appendChild(lLand);

  function entity(idName){
    for (var i = 0; i < DATA.length; i++) if (DATA[i].name.id === idName) return DATA[i];
    return null;
  }

  /* Same construction as the plate's blooms, including the tier scale,
     so a medium-confidence power reads as visibly more diffuse. */
  function bloomFor(e){
    var g = el('g', { class:'bloom', opacity:0 });
    e.nodes.forEach(function(n){
      var mult = n.kind === 'capital' ? 1 : (n.kind === 'port' ? 0.72 : 0.55);
      var r = e.reach * TIER_SCALE[e.conf] * mult * VIEW.k;
      g.appendChild(el('circle', {
        cx: px(n.lon).toFixed(1), cy: py(n.lat).toFixed(1), r: r.toFixed(1),
        fill: 'url(#bloom-' + e.conf + ')'
      }));
    });
    return g;
  }

  function nodesFor(e){
    var g = el('g', { opacity:0 });
    e.nodes.forEach(function(n){
      var cy = py(n.lat);
      var c = el('circle', { class:'lnode', cx:px(n.lon).toFixed(1), cy:cy.toFixed(1), r:3 });
      var t = el('text', { class:'lncap', x:px(n.lon).toFixed(1), y:(cy - 9).toFixed(1) });
      marks.push({ c:c, t:t, y:cy, label:n.label });
      g.appendChild(c); g.appendChild(t);
    });
    return g;
  }

  var SRI = entity('Sriwijaya');          /* Sumatra, high confidence */
  var MAJ = entity('Majapahit');          /* Java, medium confidence  */
  var NEI = entity('Hindia Belanda');     /* the surveyed edge        */

  var gInfL    = el('g', { class:'influence' });
  var sriBloom = bloomFor(SRI); gInfL.appendChild(sriBloom);
  var majBloom = bloomFor(MAJ); gInfL.appendChild(majBloom);
  lsvg.appendChild(gInfL);

  /* The only hard stroke permitted on this stage, by the Surveyed Edge
     Rule. Same ring-within-reach test the plate runs. */
  var lHard = el('g', { class:'hard', opacity:0 });
  LAND.forEach(function(ring, ri){
    var pts = ring.split(' '), within = false;
    for (var q = 0; q < pts.length && !within; q += 2){
      var c = pts[q].split(','), rlo = +c[0], rla = +c[1];
      within = NEI.nodes.some(function(n){
        var dx = rlo - n.lon, dy = rla - n.lat;
        return Math.sqrt(dx * dx + dy * dy) <= NEI.reach;
      });
    }
    if (within) lHard.appendChild(el('polygon', { class:'hp', points: LAND_PTS[ri] }));
  });
  lsvg.appendChild(lHard);

  var sriNodes = nodesFor(SRI); lsvg.appendChild(sriNodes);
  var majNodes = nodesFor(MAJ); lsvg.appendChild(majNodes);

  function fillCaps(){
    for (var i = 0; i < marks.length; i++) marks[i].t.textContent = marks[i].label[S.lang];
  }

  /* ---- what is drawn at each point in the scroll ---- */
  var panels = Array.prototype.slice.call(landing.querySelectorAll('.lpanel'));
  function inAt(s, at){ return clamp01((s - at) / 0.7); }

  function stageAt(s){
    var sri = inAt(s, 0.45) * (1 - inAt(s, 1.50));
    var maj = inAt(s, 1.50) * (1 - inAt(s, 2.50));
    sriBloom.setAttribute('opacity', sri.toFixed(3));
    sriNodes.setAttribute('opacity', sri.toFixed(3));
    majBloom.setAttribute('opacity', maj.toFixed(3));
    majNodes.setAttribute('opacity', maj.toFixed(3));
    lHard.setAttribute('opacity', inAt(s, 2.40).toFixed(3));
    applyCam(camAt(s));
  }

  var curS = 0, ticking = false, flying = false;
  function onScroll(){
    if (flying || ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var max = landing.scrollHeight - landing.clientHeight;
      curS = (max > 0 ? landing.scrollTop / max : 0) * (panels.length - 1);
      stageAt(curS);
    });
  }

  /* ---- crossing in and back out ---- */
  var closing = null;

  function openDoor(){
    clearTimeout(closing);
    flying = false;
    landing.hidden = false;
    void landing.offsetHeight;               /* so a reopen fades rather than jumps */
    landing.classList.remove('dismissing');
    document.body.classList.add('landing-open');
    landing.scrollTop = 0;
    curS = 0;
    fillCaps();
    if (REDUCED){
      /* No scroll dependency: the whole argument is present at rest. */
      sriBloom.setAttribute('opacity', 0.7); sriNodes.setAttribute('opacity', 1);
      majBloom.setAttribute('opacity', 0.7); majNodes.setAttribute('opacity', 1);
      lHard.setAttribute('opacity', 1);
      applyCam(FULL);
      panels.forEach(function(p){ p.classList.add('in'); });
    } else {
      panels.forEach(function(p){ p.classList.remove('in'); });
      panels[0].classList.add('in');
      stageAt(0);
    }
    document.getElementById('l-skip').focus({ preventScroll:true });
  }

  function closeDoor(){
    if (landing.hidden) return;
    document.body.classList.remove('landing-open');
    landing.classList.add('dismissing');
    /* The scrubber rises into place as the door clears, so the reader
       arrives at the control the last panel just told them to use. */
    app.classList.remove('arriving');
    void app.offsetHeight;
    app.classList.add('arriving');
    var done = function(){
      landing.hidden = true;
      flying = false;
      var er = document.getElementById('era-range');
      if (er) er.focus();
    };
    if (REDUCED) done(); else closing = setTimeout(done, 520);
  }

  /* The last camera move, and the only one the reader does not drive:
     Borneo pulls back to the whole archipelago before the door clears,
     so the instrument is already framed when it arrives. */
  function zoomOutAndEnter(){
    if (REDUCED || flying){ closeDoor(); return; }
    flying = true;
    var from = camAt(curS), t0 = null, D = 900;
    var step = function(ts){
      if (t0 === null) t0 = ts;
      var t = clamp01((ts - t0) / D);
      applyCam(lerpBox(from, FULL, 1 - Math.pow(1 - t, 4)));
      if (t < 1) requestAnimationFrame(step); else closeDoor();
    };
    requestAnimationFrame(step);
  }

  landing.addEventListener('scroll', onScroll, { passive:true });
  document.getElementById('l-enter').addEventListener('click', zoomOutAndEnter);
  document.getElementById('l-skip').addEventListener('click', closeDoor);
  landing.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeDoor(); });

  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if (en.isIntersecting) en.target.classList.add('in'); });
    }, { root: landing, threshold: 0.3 });
    panels.forEach(function(p){ io.observe(p); });
  } else {
    panels.forEach(function(p){ p.classList.add('in'); });
  }

  /* The door carries its own language pair, because the header's sits
     behind it. setLang is the map's own, so the two cannot drift. */
  var lId = document.getElementById('l-id'), lEn = document.getElementById('l-en');
  function markLang(){
    lId.classList.toggle('active', S.lang === 'id');
    lEn.classList.toggle('active', S.lang === 'en');
    fillCaps();
  }
  lId.addEventListener('click', function(){ setLang('id'); markLang(); });
  lEn.addEventListener('click', function(){ setLang('en'); markLang(); });
  document.getElementById('btn-id').addEventListener('click', markLang);
  document.getElementById('btn-en').addEventListener('click', markLang);
  markLang();

  /* The way back, in the header where the other controls live. */
  var introBtn = document.getElementById('intro-btn');
  if (introBtn) introBtn.addEventListener('click', openDoor);

  /* The door opens on every visit, by request. */
  openDoor();
})();


})();
</script>
