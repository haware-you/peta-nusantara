/* ==================================================================
   ZOOM + PAN

   The plate is something you lean over, not a camera that flies. Only the
   viewBox moves: every layer keeps its map coordinates, and --mz tells the
   CSS how far to counter-scale the furniture so labels, hairlines and node
   dots hold their size on screen while the geography grows. Blooms are the
   deliberate exception. A sphere of influence has real extent, so it scales
   with the land it covers.
   ================================================================== */
var mapWrap = document.querySelector('.map-wrap');
var zBtnIn  = document.getElementById('zoom-in');
var zBtnOut = document.getElementById('zoom-out');
var zBtnRst = document.getElementById('zoom-reset');
var ZMIN = 1, ZMAX = 8, ZSTEP = 1.5;
var VB = { x:0, y:0, w:W, h:H };
var zTween = null, zFallback = null;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function zNow(){ return W / VB.w; }

function applyView(){
  /* Never let the frame leave the plate. At 1x this pins it to the origin. */
  VB.x = Math.max(0, Math.min(W - VB.w, VB.x));
  VB.y = Math.max(0, Math.min(H - VB.h, VB.y));
  svg.setAttribute('viewBox', VB.x.toFixed(2) + ' ' + VB.y.toFixed(2) + ' ' + VB.w.toFixed(2) + ' ' + VB.h.toFixed(2));
  var z = zNow(), zoomed = z > 1.001;
  svg.style.setProperty('--mz', z.toFixed(4));
  /* At the default frame the page owns touch, so the map never traps a
     scroll. Once zoomed the map takes it: one finger pans, two pinch. */
  svg.style.touchAction = zoomed ? 'none' : 'pan-y';
  svg.style.cursor = zoomed ? 'grab' : '';
  zBtnOut.disabled = !zoomed;
  zBtnRst.disabled = !zoomed;
  zBtnIn.disabled  = z >= ZMAX - 1e-4;
  zBtnRst.textContent = (z < 10 ? z.toFixed(1) : String(Math.round(z))) + '\u00d7';
}

function toMap(clientX, clientY){
  var m = svg.getScreenCTM();
  if (!m) return { x: VB.x + VB.w / 2, y: VB.y + VB.h / 2 };
  var p = svg.createSVGPoint();
  p.x = clientX; p.y = clientY;
  return p.matrixTransform(m.inverse());
}

/* Zoom about a fixed map point, so the thing under the cursor stays put. */
function zoomTo(z, ax, ay){
  z = Math.max(ZMIN, Math.min(ZMAX, z));
  if (ax == null){ ax = VB.x + VB.w / 2; ay = VB.y + VB.h / 2; }
  var fx = (ax - VB.x) / VB.w, fy = (ay - VB.y) / VB.h;
  VB.w = W / z; VB.h = H / z;
  VB.x = ax - fx * VB.w; VB.y = ay - fy * VB.h;
  applyView();
}

function stopTween(){
  if (zTween){ cancelAnimationFrame(zTween); zTween = null; }
  if (zFallback){ clearTimeout(zFallback); zFallback = null; }
}

function zoomAnim(target){
  target = Math.max(ZMIN, Math.min(ZMAX, target));
  stopTween();
  var from = zNow();
  if (REDUCED || Math.abs(target - from) < 1e-4){ zoomTo(target); return; }
  var ax = VB.x + VB.w / 2, ay = VB.y + VB.h / 2, t0 = 0;
  /* Frames are paused in a background tab, and a press that quietly does
     nothing is worse than one that skips the tween. Land it either way. */
  zFallback = setTimeout(function(){ zFallback = null; stopTween(); zoomTo(target, ax, ay); }, 400);
  zTween = requestAnimationFrame(function step(ts){
    if (!t0) t0 = ts;
    var k = Math.min(1, (ts - t0) / 180);
    zoomTo(from + (target - from) * (1 - Math.pow(1 - k, 3)), ax, ay);
    if (k < 1){ zTween = requestAnimationFrame(step); }
    else { zTween = null; clearTimeout(zFallback); zFallback = null; }
  });
}

zBtnIn.addEventListener('click',  function(){ zoomAnim(zNow() * ZSTEP); });
zBtnOut.addEventListener('click', function(){ zoomAnim(zNow() / ZSTEP); });
zBtnRst.addEventListener('click', function(){ zoomAnim(ZMIN); });

mapWrap.addEventListener('wheel', function(ev){
  var d = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 400 : 1);
  var next = zNow() * Math.pow(1.0018, -d);
  /* Already at the full frame and still scrolling out: let the page have it. */
  if (next <= ZMIN && zNow() <= ZMIN) return;
  ev.preventDefault();
  stopTween();
  var a = toMap(ev.clientX, ev.clientY);
  zoomTo(next, a.x, a.y);
}, { passive:false });

/* Drag to pan, two fingers to pinch. A drag that travelled is not a click,
   so aiming at Sumatra and missing never selects the wrong region.

   A lone finger at the fitted frame belongs to the page's own vertical
   scroll: we still record it (so a second finger can be recognised as a
   pinch pair) but don't let it move the map. touchIdle tracks that case;
   it is recomputed whenever the finger count changes, so a pinch that
   zooms in and then drops to one finger hands off straight into panning,
   the way a normal map app does. */
var pts = {}, nPts = 0, lastPt = null, pinchDist = 0, travelled = 0, touchIdle = false;

function livePts(){
  var out = [];
  for (var k in pts) if (pts.hasOwnProperty(k)) out.push(pts[k]);
  return out;
}

svg.addEventListener('pointerdown', function(ev){
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  pts[ev.pointerId] = { x:ev.clientX, y:ev.clientY };
  nPts++;
  if (nPts === 1){
    lastPt = { x:ev.clientX, y:ev.clientY }; travelled = 0;
    touchIdle = (ev.pointerType !== 'mouse' && zNow() <= 1.001);
  } else if (nPts === 2){
    touchIdle = false; /* two fingers is always a deliberate pinch */
    var p = livePts();
    pinchDist = Math.sqrt(Math.pow(p[1].x - p[0].x, 2) + Math.pow(p[1].y - p[0].y, 2));
  }
  stopTween();
});

svg.addEventListener('pointermove', function(ev){
  if (!pts[ev.pointerId]) return;
  pts[ev.pointerId].x = ev.clientX; pts[ev.pointerId].y = ev.clientY;

  if (nPts >= 2){
    var p = livePts();
    var d = Math.sqrt(Math.pow(p[1].x - p[0].x, 2) + Math.pow(p[1].y - p[0].y, 2));
    if (pinchDist > 0 && d > 0){
      var a = toMap((p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2);
      zoomTo(zNow() * (d / pinchDist), a.x, a.y);
    }
    pinchDist = d;
    travelled = 99;
    return;
  }

  if (!lastPt || touchIdle) return;
  var m = svg.getScreenCTM();
  if (!m || !m.a) return;
  var dx = ev.clientX - lastPt.x, dy = ev.clientY - lastPt.y;
  travelled += Math.abs(dx) + Math.abs(dy);
  VB.x -= dx / m.a; VB.y -= dy / m.d;
  lastPt.x = ev.clientX; lastPt.y = ev.clientY;
  if (travelled > 4) svg.classList.add('grabbing');
  applyView();
});

function endPointer(ev){
  if (pts[ev.pointerId]){ delete pts[ev.pointerId]; nPts = Math.max(0, nPts - 1); }
  if (nPts < 2) pinchDist = 0;
  if (nPts === 1){
    /* One finger remains after a pinch, or after a second touch lifted.
       Re-arm panning from wherever the zoom level actually landed. */
    var rem = livePts()[0];
    if (rem) lastPt = { x:rem.x, y:rem.y };
    touchIdle = zNow() <= 1.001;
  }
  if (nPts === 0){ lastPt = null; svg.classList.remove('grabbing'); }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', endPointer);

svg.addEventListener('click', function(ev){
  if (travelled > 4){ ev.stopPropagation(); ev.preventDefault(); travelled = 0; }
}, true);

mapWrap.addEventListener('keydown', function(ev){
  var step = VB.w * 0.18;
  if (ev.key === '+' || ev.key === '=') zoomAnim(zNow() * ZSTEP);
  else if (ev.key === '-' || ev.key === '_') zoomAnim(zNow() / ZSTEP);
  else if (ev.key === '0') zoomAnim(ZMIN);
  else if (ev.key === 'ArrowLeft'){ VB.x -= step; applyView(); }
  else if (ev.key === 'ArrowRight'){ VB.x += step; applyView(); }
  else if (ev.key === 'ArrowUp'){ VB.y -= step; applyView(); }
  else if (ev.key === 'ArrowDown'){ VB.y += step; applyView(); }
  else return;
  ev.preventDefault();
});

applyView();

/* ==================================================================
   BOOT
   ================================================================== */
S.lang  = LS.get('nusantara-map-lang', 'id') === 'en' ? 'en' : 'id';
var savedTheme = LS.get('nusantara-map-theme', '');
S.theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : '';
S.study = LS.get('nusantara-map-study', '0') === '1';
S.routes = LS.get('nusantara-map-routes', '1') === '1';
S.rail = LS.get('nusantara-map-rail', '1') === '1';
S.lanes = LS.get('nusantara-map-lanes', '0') === '1';
try { S.revealed = JSON.parse(LS.get('nusantara-map-revealed', '{}')) || {}; } catch(e){ S.revealed = {}; }
var savedYear = parseInt(LS.get('nusantara-map-year', '1365'), 10);
S.year = isNaN(savedYear) ? 1365 : savedYear;

app.classList.toggle('study', S.study);
studyBtn.classList.toggle('on', S.study);
studyBtn.setAttribute('aria-pressed', S.study ? 'true' : 'false');
routesBtn.classList.toggle('on', S.routes);
routesBtn.setAttribute('aria-pressed', S.routes ? 'true' : 'false');
applyRail();

range.value = Math.round(posFromYear(S.year));
applyChrome();
render();

/* ==================================================================
   THE LANDING — the front door (DESIGN.md §2)

   Scroll drives a camera over three islands, one per beat of the
   argument: Sumatra for position, Java for uncertainty, Borneo for the
   surveyed line. Each beat draws the entity it is actually about, read
   out of DATA rather than redrawn, so the door cannot drift from the
   plate behind it.

   This moves a frame, which the plate forbids. It is allowed here for
   two reasons: it is not the instrument's frame (the map's own viewBox
   is never touched from this module, and the landing is a separate SVG
   on a separate surface), and the reader drives it by scrolling rather
   than having it moved under an aim. The only camera move the reader
   does not drive is the closing zoom out, and that one answers a click.

   The imagery is the chart drawing itself. No photograph: heritage
   decoration is a stated anti-reference, and the marks are the
   argument.
   ================================================================== */
(function(){
  var landing = document.getElementById('landing');
  if (!landing) return;

  var lsvg = document.getElementById('lmap');
  lsvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  /* ---- the camera ---------------------------------------------- */
  var ASPECT = W / H;

  /* Frame an island whole. The box is grown, never cropped, to reach
     the plate's aspect, because "do not crop the archipelago to fill a
     box" governs the geography on this surface too. */
  function shot(west, east, south, north){
    var x0 = px(west), x1 = px(east), y0 = py(north), y1 = py(south);
    var w = x1 - x0, h = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    if (w / h < ASPECT) w = h * ASPECT; else h = w / ASPECT;
    return { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
  }

  var FULL    = { x:0, y:0, w:W, h:H };
  var SUMATRA = shot( 94.4, 107.6, -6.6,  6.4);
  var JAVA    = shot(104.6, 118.6, -9.4, -4.8);
  var BORNEO  = shot(108.5, 119.5, -1.0,  7.4);

  /* Pull a frame back toward the plate without reaching it. */
  function eased(base, factor){
    var w = base.w / factor, h = base.h / factor;
    return { x: base.x + (base.w - w) / 2, y: base.y + (base.h - h) / 2, w:w, h:h };
  }

  /* One keyframe per panel. The last card pulls back to the archipelago
     but stops just short of the plate, so the closing click still has
     somewhere to travel. At 1.25x the whole chain stays in frame, Aceh
     and Timor included, and the click is a settle rather than a reveal. */
  var ARCHIPELAGO = eased(FULL, 1.25);
  var SHOTS = [FULL, SUMATRA, eased(JAVA, 0.82), BORNEO, ARCHIPELAGO];

  var marks = [];              /* node dots and captions, counter-scaled */

  function applyCam(vb){
    lsvg.setAttribute('viewBox',
      vb.x.toFixed(1) + ' ' + vb.y.toFixed(1) + ' ' + vb.w.toFixed(1) + ' ' + vb.h.toFixed(1));
    /* The Furniture Holds Rule: zoom scales the geography, never the
       chart's furniture. Blooms are the deliberate exception, because
       their extent is a claim about the world. */
    var z = W / vb.w;
    lsvg.style.setProperty('--lz', z.toFixed(3));
    var r = 3 / z, dy = 9 / z;
    for (var i = 0; i < marks.length; i++){
      marks[i].c.setAttribute('r', r.toFixed(2));
      marks[i].t.setAttribute('y', (marks[i].y - dy).toFixed(2));
    }
  }

  function lerpBox(a, b, t){
    return { x:a.x + (b.x-a.x)*t, y:a.y + (b.y-a.y)*t,
             w:a.w + (b.w-a.w)*t, h:a.h + (b.h-a.h)*t };
  }
  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function camAt(s){
    var i = Math.max(0, Math.min(SHOTS.length - 2, Math.floor(s)));
    var t = clamp01(s - i);
    return lerpBox(SHOTS[i], SHOTS[i+1], 1 - Math.pow(1 - t, 3));
  }

  /* ---- stage: the same geometry and the same marks as the plate ---- */
  var lGrat = el('g', { class:'graticule' });
  for (var lo = 95; lo <= 140; lo += 5) lGrat.appendChild(el('line', { x1:px(lo), y1:0, x2:px(lo), y2:H }));
  for (var la = 5; la >= -10; la -= 5) lGrat.appendChild(el('line', { x1:0, y1:py(la), x2:W, y2:py(la) }));
  lsvg.appendChild(lGrat);

  var lLand = el('g');
  LAND_PTS.forEach(function(p){ lLand.appendChild(el('polygon', { class:'land', points:p })); });
  lsvg.appendChild(lLand);

  function entity(idName){
    for (var i = 0; i < DATA.length; i++) if (DATA[i].name.id === idName) return DATA[i];
    return null;
  }

  /* Same construction as the plate's blooms, including the tier scale,
     so a medium-confidence power reads as visibly more diffuse. */
  function bloomFor(e){
    var g = el('g', { class:'bloom', opacity:0 });
    e.nodes.forEach(function(n){
      var mult = n.kind === 'capital' ? 1 : (n.kind === 'port' ? 0.72 : 0.55);
      var r = e.reach * TIER_SCALE[e.conf] * mult * VIEW.k;
      g.appendChild(el('circle', {
        cx: px(n.lon).toFixed(1), cy: py(n.lat).toFixed(1), r: r.toFixed(1),
        fill: 'url(#bloom-' + e.conf + ')'
      }));
    });
    return g;
  }

  function nodesFor(e){
    var g = el('g', { opacity:0 });
    e.nodes.forEach(function(n){
      var cy = py(n.lat);
      var c = el('circle', { class:'lnode', cx:px(n.lon).toFixed(1), cy:cy.toFixed(1), r:3 });
      var t = el('text', { class:'lncap', x:px(n.lon).toFixed(1), y:(cy - 9).toFixed(1) });
      marks.push({ c:c, t:t, y:cy, label:n.label });
      g.appendChild(c); g.appendChild(t);
    });
    return g;
  }

  var SRI = entity('Sriwijaya');          /* Sumatra, high confidence */
  var MAJ = entity('Majapahit');          /* Java, medium confidence  */
  var NEI = entity('Hindia Belanda');     /* the surveyed edge        */

  var gInfL    = el('g', { class:'influence' });
  var sriBloom = bloomFor(SRI); gInfL.appendChild(sriBloom);
  var majBloom = bloomFor(MAJ); gInfL.appendChild(majBloom);
  lsvg.appendChild(gInfL);

  /* The only hard stroke permitted on this stage, by the Surveyed Edge
     Rule. Same ring-within-reach test the plate runs. */
  var lHard = el('g', { class:'hard', opacity:0 });
  LAND.forEach(function(ring, ri){
    var pts = ring.split(' '), within = false;
    for (var q = 0; q < pts.length && !within; q += 2){
      var c = pts[q].split(','), rlo = +c[0], rla = +c[1];
      within = NEI.nodes.some(function(n){
        var dx = rlo - n.lon, dy = rla - n.lat;
        return Math.sqrt(dx * dx + dy * dy) <= NEI.reach;
      });
    }
    if (within) lHard.appendChild(el('polygon', { class:'hp', points: LAND_PTS[ri] }));
  });
  lsvg.appendChild(lHard);

  var sriNodes = nodesFor(SRI); lsvg.appendChild(sriNodes);
  var majNodes = nodesFor(MAJ); lsvg.appendChild(majNodes);

  function fillCaps(){
    for (var i = 0; i < marks.length; i++) marks[i].t.textContent = marks[i].label[S.lang];
  }

  /* ---- what is drawn at each point in the scroll ---- */
  var panels = Array.prototype.slice.call(landing.querySelectorAll('.lpanel'));
  function inAt(s, at){ return clamp01((s - at) / 0.7); }

  function stageAt(s){
    var sri = inAt(s, 0.45) * (1 - inAt(s, 1.50));
    var maj = inAt(s, 1.50) * (1 - inAt(s, 2.50));
    sriBloom.setAttribute('opacity', sri.toFixed(3));
    sriNodes.setAttribute('opacity', sri.toFixed(3));
    majBloom.setAttribute('opacity', maj.toFixed(3));
    majNodes.setAttribute('opacity', maj.toFixed(3));
    lHard.setAttribute('opacity', inAt(s, 2.40).toFixed(3));
    applyCam(camAt(s));
  }

  var curS = 0, ticking = false, flying = false;
  function onScroll(){
    if (flying || ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var max = landing.scrollHeight - landing.clientHeight;
      curS = (max > 0 ? landing.scrollTop / max : 0) * (panels.length - 1);
      stageAt(curS);
    });
  }

  /* ---- crossing in and back out ---- */
  var closing = null;

  function openDoor(){
    clearTimeout(closing);
    flying = false;
    landing.hidden = false;
    void landing.offsetHeight;               /* so a reopen fades rather than jumps */
    landing.classList.remove('dismissing');
    document.body.classList.add('landing-open');
    landing.scrollTop = 0;
    curS = 0;
    fillCaps();
    if (REDUCED){
      /* No scroll dependency: the whole argument is present at rest. */
      sriBloom.setAttribute('opacity', 0.7); sriNodes.setAttribute('opacity', 1);
      majBloom.setAttribute('opacity', 0.7); majNodes.setAttribute('opacity', 1);
      lHard.setAttribute('opacity', 1);
      applyCam(FULL);
      panels.forEach(function(p){ p.classList.add('in'); });
    } else {
      panels.forEach(function(p){ p.classList.remove('in'); });
      panels[0].classList.add('in');
      stageAt(0);
    }
    document.getElementById('l-skip').focus({ preventScroll:true });
  }

  function closeDoor(){
    if (landing.hidden) return;
    document.body.classList.remove('landing-open');
    landing.classList.add('dismissing');
    /* The scrubber rises into place as the door clears, so the reader
       arrives at the control the last panel just told them to use. */
    app.classList.remove('arriving');
    void app.offsetHeight;
    app.classList.add('arriving');
    var done = function(){
      landing.hidden = true;
      flying = false;
      /* Arrive with the detail panel already open, so the map is never
         handed over with its right column looking empty or hidden. */
      if (!S.rail){ S.rail = true; applyRail(); LS.set('nusantara-map-rail', '1'); }
      render();
      var er = document.getElementById('era-range');
      if (er) er.focus();
    };
    if (REDUCED) done(); else closing = setTimeout(done, 520);
  }

  /* The last camera move, and the only one the reader does not drive:
     Borneo pulls back to the whole archipelago before the door clears,
     so the instrument is already framed when it arrives. */
  function zoomOutAndEnter(){
    if (REDUCED || flying){ closeDoor(); return; }
    flying = true;
    var from = camAt(curS), t0 = null, D = 900;
    var step = function(ts){
      if (t0 === null) t0 = ts;
      var t = clamp01((ts - t0) / D);
      applyCam(lerpBox(from, FULL, 1 - Math.pow(1 - t, 4)));
      if (t < 1) requestAnimationFrame(step); else closeDoor();
    };
    requestAnimationFrame(step);
  }

  landing.addEventListener('scroll', onScroll, { passive:true });
  document.getElementById('l-enter').addEventListener('click', zoomOutAndEnter);
  document.getElementById('l-skip').addEventListener('click', closeDoor);
  landing.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeDoor(); });

  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if (en.isIntersecting) en.target.classList.add('in'); });
    }, { root: landing, threshold: 0.3 });
    panels.forEach(function(p){ io.observe(p); });
  } else {
    panels.forEach(function(p){ p.classList.add('in'); });
  }

  /* The door carries its own language pair, because the header's sits
     behind it. setLang is the map's own, so the two cannot drift. */
  var lId = document.getElementById('l-id'), lEn = document.getElementById('l-en');
  function markLang(){
    lId.classList.toggle('active', S.lang === 'id');
    lEn.classList.toggle('active', S.lang === 'en');
    fillCaps();
  }
  lId.addEventListener('click', function(){ setLang('id'); markLang(); });
  lEn.addEventListener('click', function(){ setLang('en'); markLang(); });
  document.getElementById('btn-id').addEventListener('click', markLang);
  document.getElementById('btn-en').addEventListener('click', markLang);
  markLang();

  /* The way back, in the header where the other controls live. */
  var introBtn = document.getElementById('intro-btn');
  if (introBtn) introBtn.addEventListener('click', openDoor);

  /* The door opens on every visit, by request. */
  openDoor();
})();


})();
</script>
