<title>Peta Nusantara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Peta Nusantara commits to a dark ground deliberately (PRD 16): influence
     renders as radial bloom, which reads as a stain on paper and as light on
     near-black. Single visual world, every color painted explicitly. */
  :root{
    color-scheme: dark;
    --ground:      #0c0b09;
    --ocean:       #0f1115;
    --ocean-deep:  #0b0d10;
    --land:        #272219;
    --land-edge:   #3d3626;
    --land-hi:     #332c20;
    --gold:        #d9ab55;
    --gold-warm:   #f0c877;
    --route:       #3f9d92;
    --route-hi:    #63c8bb;
    --colonial:    #9085e9;
    --ink-1:       #f3ecdd;
    --ink-2:       #a89b83;
    --ink-3:       #6e6555;
    --line:        #2a2419;
    --surface:     #14120e;
    --surface-2:   #1c1913;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--ground);
    color: var(--ink-1);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; font-weight:700; margin:0; text-wrap: balance; }

  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .app{
    display: grid;
    grid-template-rows: auto minmax(0,1fr) auto;
    min-height: 100vh;
  }

  /* ============================ Header ============================ */
  .head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 20px; flex-wrap: wrap;
    padding: 16px 22px 13px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.15em;
    text-transform: uppercase; color: var(--gold); font-weight:600; margin-bottom:5px;
  }
  .head h1{ font-size: clamp(1.25rem, 2.4vw, 1.7rem); letter-spacing:-0.01em; line-height:1.1; }
  .head .sub{ color: var(--ink-2); font-size:0.84rem; margin-top:4px; max-width: 54ch; }

  .controls{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
  .ctl-row{ display:flex; gap:8px; align-items:center; flex-wrap: wrap; justify-content:flex-end; }

  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background: var(--surface-2); }
  .seg button{
    appearance:none; border:none; background:transparent; color: var(--ink-2);
    font: inherit; font-weight:600; font-size:0.76rem; padding:7px 14px; cursor:pointer;
    transition: background .14s, color .14s;
  }
  .seg button:hover{ color: var(--ink-1); }
  .seg button.active{ background: var(--gold); color: #1a1408; }
  .seg button:focus-visible{ outline:2px solid var(--gold-warm); outline-offset:-2px; }

  .pill{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-radius:999px; background: var(--surface-2);
    padding:6px 13px 6px 6px; cursor:pointer; font:inherit; font-weight:600;
    font-size:0.75rem; color: var(--ink-2);
    transition: color .14s, border-color .14s;
  }
  .pill .knob{
    width:28px; height:17px; border-radius:999px; background:#241f16;
    border:1px solid var(--line); position:relative; flex-shrink:0; transition: background .15s;
  }
  .pill .knob::after{
    content:''; position:absolute; top:1px; left:1px; width:13px; height:13px;
    border-radius:50%; background: var(--ink-3); transition: transform .15s, background .15s;
  }
  .pill.on{ color: var(--gold); border-color:#4a3c1e; }
  .pill.on .knob{ background: var(--gold); }
  .pill.on .knob::after{ transform: translateX(11px); background:#1a1408; }
  .pill:focus-visible{ outline:2px solid var(--gold-warm); outline-offset:2px; }

  /* ============================ Stage ============================ */
  .stage{
    display: grid;
    grid-template-columns: minmax(0,1fr) 336px;
    min-height: 0;
  }

  .map-wrap{
    position: relative;
    background:
      radial-gradient(120% 90% at 50% 42%, #12151a 0%, var(--ocean) 45%, var(--ocean-deep) 100%);
    overflow: hidden;
    min-height: 340px;
  }
  svg.map{ display:block; width:100%; height:100%; }

  /* Standing caveat — PRD 08 binding rule 2. Present in every era view. */
  .caveat{
    position:absolute; left:16px; bottom:12px; pointer-events:none;
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.09em;
    text-transform: uppercase; color: var(--ink-3); max-width: 46ch; line-height:1.5;
  }
  .caveat b{ color: var(--gold); font-weight:600; }

  .era-badge{
    position:absolute; left:16px; top:14px; pointer-events:none;
  }
  .era-badge .yr{
    font-family:'IBM Plex Mono', monospace; font-size:1.55rem; font-weight:600;
    color: var(--ink-1); line-height:1; letter-spacing:-0.01em;
  }
  .era-badge .nm{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.13em;
    text-transform: uppercase; color: var(--gold); margin-top:6px; font-weight:600;
  }
  .era-badge .ct{ font-size:0.74rem; color: var(--ink-3); margin-top:3px; }

  .legend-map{
    position:absolute; right:14px; top:14px; pointer-events:none;
    display:grid; gap:5px; justify-items:end;
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.05em;
    color: var(--ink-3);
  }
  .legend-map div{ display:flex; align-items:center; gap:7px; }
  .legend-map i{ width:22px; height:0; display:block; flex-shrink:0; }
  .lg-bloom{ height:9px; border-radius:2px; background: linear-gradient(90deg, rgba(217,171,85,.62), rgba(217,171,85,0)); }
  .lg-hard{ height:9px; border-radius:2px; border:1px solid var(--colonial); background: rgba(144,133,233,.14); }
  .lg-route{ border-top:1.5px dashed var(--route); }

  /* ============================ Detail rail ============================ */
  .rail{
    border-left:1px solid var(--line);
    background: var(--surface);
    padding: 18px 20px 22px;
    overflow-y: auto;
    min-height: 0;
  }
  .rail-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600; margin-bottom:4px;
  }
  .rail h2{ font-size:1.12rem; letter-spacing:-0.005em; }
  .rail-count{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color: var(--gold); margin-top:5px; }
  .rail-empty{ color: var(--ink-3); font-size:0.86rem; line-height:1.6; margin-top:14px; }

  .ent-list{ display:grid; gap:9px; margin-top:15px; }
  .ent{
    background: var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:11px 13px; cursor:pointer; text-align:left;
    font:inherit; color:inherit; width:100%;
    border-left:3px solid var(--ink-3);
    transition: border-color .14s, background .14s;
  }
  .ent:hover{ background:#231e16; }
  .ent:focus-visible{ outline:2px solid var(--gold-warm); outline-offset:2px; }
  .ent.sel{ border-color:#4a3c1e; border-left-color: var(--gold); background:#231e16; }
  .ent.c-classical{ border-left-color:#3987e5; }
  .ent.c-islamic{ border-left-color:#e07a44; }
  .ent.c-colonial{ border-left-color: var(--colonial); }
  .ent.c-modern{ border-left-color:#e06666; }
  .ent .en{ font-weight:600; font-size:0.88rem; line-height:1.3; }
  .ent .ey{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color: var(--ink-2); margin-top:3px; }
  .ent .ed{ font-size:0.82rem; color: var(--ink-2); line-height:1.55; margin-top:7px; display:none; }
  .ent.sel .ed{ display:block; }
  .ent .tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.06em; text-transform:uppercase; color: var(--colonial);
    border:1px solid #3a3560; border-radius:3px; padding:1px 5px; margin-left:6px;
    vertical-align:1px;
  }
  .ent .conf{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color: var(--ink-3);
    margin-top:6px; display:none;
  }
  .ent.sel .conf{ display:block; }

  /* Study mode blurs names until revealed (FR-7). */
  .app.study .ent .en, .app.study .ent .ey{ filter: blur(5px); transition: filter .13s; }
  .app.study .ent:hover .en, .app.study .ent:hover .ey,
  .app.study .ent.sel .en, .app.study .ent.sel .ey,
  .app.study .ent.rv .en, .app.study .ent.rv .ey{ filter:none; }
  .app.study .rlabel text{ filter: blur(4px); transition: filter .13s; }
  .app.study .rlabel.rv text, .app.study .rlabel:hover text{ filter:none; }

  .study-hint{
    font-size:0.76rem; color: var(--gold); line-height:1.55;
    margin-top:12px; display:none;
  }
  .app.study .study-hint{ display:block; }

  /* ============================ Scrubber ============================ */
  .scrub{
    background: var(--surface);
    border-top:1px solid var(--line);
    padding: 12px 22px 15px;
  }
  .scrub-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:16px; margin-bottom:7px; flex-wrap:wrap;
  }
  .scrub-title{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600;
  }
  .scrub-hint{ font-size:0.72rem; color: var(--ink-3); }

  .track{ position: relative; height: 62px; }

  /* density histogram + engraved ruler live in one SVG behind the input */
  svg.ruler{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  input[type=range].era{
    -webkit-appearance:none; appearance:none;
    position:absolute; left:0; right:0; top:20px;
    width:100%; height:26px; margin:0; background:transparent; cursor:pointer;
  }
  input[type=range].era::-webkit-slider-runnable-track{ height:26px; background:transparent; }
  input[type=range].era::-moz-range-track{ height:26px; background:transparent; }
  input[type=range].era::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:15px; height:15px; border-radius:50%;
    background: var(--gold-warm); border:none; margin-top:5.5px;
    box-shadow: 0 0 0 4px rgba(217,171,85,0.20), 0 0 14px 4px rgba(217,171,85,0.34);
  }
  input[type=range].era::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%;
    background: var(--gold-warm); border:none;
    box-shadow: 0 0 0 4px rgba(217,171,85,0.20), 0 0 14px 4px rgba(217,171,85,0.34);
  }
  input[type=range].era:focus{ outline:none; }
  input[type=range].era:focus-visible::-webkit-slider-thumb{
    box-shadow: 0 0 0 3px var(--ground), 0 0 0 6px var(--gold-warm);
  }
  input[type=range].era:focus-visible::-moz-range-thumb{
    box-shadow: 0 0 0 3px var(--ground), 0 0 0 6px var(--gold-warm);
  }

  .era-names{
    position:relative; height:15px; margin-top:2px;
  }
  .era-names span{
    position:absolute; transform: translateX(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem; letter-spacing:0.06em;
    color: var(--ink-3); white-space:nowrap; top:0;
    transition: color .14s;
  }
  .era-names span.on{ color: var(--gold); }

  /* ============================ Map primitives ============================ */
  .land{ fill: var(--land); stroke: var(--land-edge); stroke-width:0.7; stroke-linejoin:round; }
  .graticule{ stroke:#1a1e24; stroke-width:0.5; fill:none; }

  .region-hit{ fill: transparent; cursor:pointer; outline:none; }
  .region-hit:hover + .region-glow, .region-hit:focus-visible + .region-glow{ opacity:1; }
  .region-glow{
    fill: rgba(217,171,85,0.05); stroke: rgba(217,171,85,0.30);
    stroke-width:0.8; stroke-dasharray:4 4; opacity:0; pointer-events:none;
    transition: opacity .16s;
  }
  .region-glow.sel{ opacity:1; fill: rgba(217,171,85,0.075); stroke: rgba(217,171,85,0.55); stroke-dasharray:none; }
  .region-hit:focus-visible + .region-glow{ stroke: var(--gold-warm); stroke-width:1.4; stroke-dasharray:none; }

  .rlabel text{
    font-family:'IBM Plex Mono', monospace; font-size:8.5px; letter-spacing:0.11em;
    text-transform: uppercase; fill: var(--ink-3); text-anchor:middle;
    pointer-events:none; transition: fill .16s;
  }
  .rlabel.sel text, .rlabel.hot text{ fill: var(--ink-2); }

  .influence{ mix-blend-mode: screen; pointer-events:none; }
  .bloom{ transition: opacity .3s ease; }

  .hard{ pointer-events:none; }
  .hard .hp{
    fill: rgba(144,133,233,0.10); stroke: var(--colonial);
    stroke-width:0.9; stroke-linejoin:round;
    transition: opacity .3s ease;
  }

  .route{
    fill:none; stroke: var(--route); stroke-width:1.1; stroke-dasharray:5 4;
    opacity:0.30; transition: opacity .3s ease, stroke .3s ease;
  }
  .route.hot{ opacity:0.95; stroke: var(--route-hi); stroke-width:1.5; }
  .route-label{
    font-family:'IBM Plex Mono', monospace; font-size:7.5px; letter-spacing:0.13em;
    text-transform:uppercase; fill: var(--route); opacity:0.5;
    pointer-events:none; transition: opacity .3s, fill .3s;
  }
  .route-label.hot{ opacity:1; fill: var(--route-hi); }

  .node{ pointer-events:none; transition: opacity .3s ease; }
  .node circle{ fill: var(--gold-warm); }
  .node text{
    font-family:'IBM Plex Mono', monospace; font-size:8px; letter-spacing:0.06em;
    fill: var(--ink-1); text-anchor:middle;
    paint-order: stroke; stroke: rgba(8,7,5,0.85); stroke-width:2.6px; stroke-linejoin:round;
  }
  .app.study .node text{ filter: blur(4px); }
  .app.study .node.rv text{ filter:none; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      transition-duration: .001ms !important;
      animation-duration: .001ms !important;
    }
  }

  /* ============================ Responsive ============================ */
  @media (max-width: 900px){
    .stage{ grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(300px, 52vh) auto; }
    .rail{ border-left:none; border-top:1px solid var(--line); max-height: none; }
    .legend-map{ display:none; }
    .caveat{ font-size:0.58rem; max-width: 36ch; }
    .head{ padding:13px 16px 11px; }
    .scrub{ padding:11px 16px 14px; }
    .controls{ align-items:flex-start; }
    .era-badge .yr{ font-size:1.25rem; }
  }
  @media (max-width: 560px){
    .head{ flex-direction:column; gap:12px; }
    .controls{ align-items:stretch; width:100%; }
    .ctl-row{ justify-content:flex-start; }
  }
</style>

<div class="app" id="app">

  <header class="head">
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <div class="sub" data-i18n="subtitle"></div>
    </div>
    <div class="controls">
      <div class="ctl-row">
        <div class="seg" role="group" aria-label="Language / Bahasa">
          <button type="button" id="btn-id">Bahasa Indonesia</button>
          <button type="button" id="btn-en">English</button>
        </div>
      </div>
      <div class="ctl-row">
        <button type="button" class="pill" id="study-btn" aria-pressed="false">
          <span class="knob"></span><span data-i18n="studyToggle"></span>
        </button>
        <button type="button" class="pill" id="routes-btn" aria-pressed="true">
          <span class="knob"></span><span data-i18n="routesToggle"></span>
        </button>
      </div>
    </div>
  </header>

  <div class="stage">
    <div class="map-wrap">
      <svg class="map" id="map" role="img" aria-labelledby="map-title"><title id="map-title"></title></svg>

      <div class="era-badge">
        <div class="yr mono" id="badge-year"></div>
        <div class="nm" id="badge-era"></div>
        <div class="ct" id="badge-count"></div>
      </div>

      <div class="legend-map" aria-hidden="true">
        <div><span data-i18n="lgBloom"></span><i class="lg-bloom"></i></div>
        <div><span data-i18n="lgHard"></span><i class="lg-hard"></i></div>
        <div><span data-i18n="lgRoute"></span><i class="lg-route"></i></div>
      </div>

      <div class="caveat"><b data-i18n="caveatLead"></b> <span data-i18n="caveatBody"></span></div>
    </div>

    <aside class="rail" id="rail" aria-live="polite"></aside>
  </div>

  <div class="scrub">
    <div class="scrub-head">
      <div class="scrub-title" data-i18n="scrubTitle"></div>
      <div class="scrub-hint" data-i18n="scrubHint"></div>
    </div>
    <div class="track">
      <svg class="ruler" id="ruler" preserveAspectRatio="none" aria-hidden="true"></svg>
      <input type="range" class="era" id="era-range" min="0" max="1520" step="1" value="0">
    </div>
    <div class="era-names" id="era-names"></div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ==================================================================
   GEOMETRY — Natural Earth 50m, Douglas-Peucker simplified to ~3.9km,
   islets under ~18 km² dropped, coordinates at 2dp. Inlined because the
   artifact CSP forbids runtime fetches (NFR-1).
   ================================================================== */
/*__LAND__*/

/* Equirectangular. Near the equator the distortion is negligible and the
   map is explicitly not a navigational instrument (NG1). */
var VIEW = { w:93.0, e:141.6, s:-11.6, n:7.6, k:25 };
var W = (VIEW.e - VIEW.w) * VIEW.k;
var H = (VIEW.n - VIEW.s) * VIEW.k;
function px(lon){ return (lon - VIEW.w) * VIEW.k; }
function py(lat){ return (VIEW.n - lat) * VIEW.k; }

/* ==================================================================
   I18N CHROME
   ================================================================== */
var CHROME = {
  eyebrow:{ id:"Referensi pribadi — belum diverifikasi penuh", en:"Personal reference — not fully verified" },
  title:{ id:"Peta Nusantara", en:"Map of the Archipelago" },
  subtitle:{
    id:"Pendamping spasial untuk Garis Waktu Nusantara. Geser waktu, klik wilayah, lihat pengaruh memuai dan menyusut.",
    en:"A spatial companion to the Nusantara timeline. Scrub through time, click a region, watch influence expand and contract."
  },
  studyToggle:{ id:"Mode Belajar", en:"Study Mode" },

  scrubTitle:{ id:"Garis Waktu", en:"Era Scrubber" },
  scrubHint:{

  },
  caveatLead:{ id:"Perkiraan lingkup pengaruh.", en:"Approximate spheres of influence." },

    en:"Not territorial borders. Pre-colonial polities were mandala states — influence fading outward with no boundary line."
  },
  lgBloom:{ id:"pengaruh (memudar)", en:"influence (fading)" },
  lgHard:{ id:"batas administratif", en:"administrative border" },

    en:"Click any region on the map to see the powers active there in the selected year. Tab and press Enter to explore by keyboard."
  },
  railNone:{
    id:"Tidak ada entitas tercatat di wilayah ini pada tahun ini. Geser garis waktu untuk mencari periode lain.",
    en:"No entities recorded in this region at this year. Scrub the timeline to find another period."
  },
  /* PRD Q3 — the Papua gap gets a stated on-map treatment rather than a silent blank. */
  railGap:{
    id:"Wilayah ini nyaris tidak muncul dalam kumpulan data mana pun tahunnya. Itu bukan berarti tidak ada sejarah di sini — melainkan bahwa historiografi Nusantara dibangun di sekitar negara dan sumber tertulis, sehingga masyarakat tanpa negara terstruktur kurang tercatat. Kekosongan ini sendiri adalah temuan.",
    en:"This region is nearly absent from the dataset at every year. That does not mean no history happened here — it means the historiography of the archipelago is built around states and written sources, and structurally under-records non-state societies. The blank is itself a finding."

  wide:{ id:"se-Nusantara", en:"archipelago-wide" },

  entities:{ id:"kekuasaan aktif", en:"powers active" },
  studyHint:{
    id:"Mode Belajar aktif: nama disamarkan. Arahkan kursor untuk mengintip, klik untuk mengungkap dan menandainya sudah dihafal.",
    en:"Study Mode is on: names are blurred. Hover to peek, click to reveal and mark it as learned."
  },
  confHint:{
    id:"Keyakinan rendah digambar lebih kabur — ketidakpastian tampil sebagai sifat visual, bukan catatan kaki.",
    en:"Lower confidence renders blurrier — uncertainty shown as a visual property, not a footnote."
  },
  catNames:{
    classical:{ id:"Kerajaan Hindu-Buddha", en:"Hindu-Buddhist Kingdom" },
    islamic:{ id:"Kesultanan Islam", en:"Islamic Sultanate" },
    colonial:{ id:"Kekuatan Kolonial", en:"Colonial Power" },
    modern:{ id:"Republik Indonesia", en:"Republic of Indonesia" }
  },
  confLabel:{
    high:{ id:"Keyakinan tinggi pada tahun ini", en:"High confidence on these dates" },
    medium:{ id:"Keyakinan sedang — sejarawan berbeda pendapat", en:"Medium confidence — historians differ" },
    low:{ id:"Keyakinan rendah — tahun pasti tidak diketahui", en:"Low confidence — exact dates unknown" }
  }

    pts:[[128.4,-3.6],[126.4,-4.6],[123.6,-5.8],[120.4,-6.6],[117.2,-7.2],[114.6,-7.5],[112.8,-7.1]] },
  { id:'java-sea', label:{id:'Laut Jawa', en:'Java Sea'}, lab:[110.6,-4.6], rot:-4,
    pts:[[106.9,-5.5],[109.4,-5.2],[112.2,-5.3],[114.8,-5.0],[116.6,-4.4]] }
];

/* ==================================================================
   SCALE — the chart's three segments, reused verbatim. A linear scale
   would put 60% of the track before the first entity (FR-8a).
   ================================================================== */
var SEGMENTS = [
  { yStart:300,  yEnd:1500, pStart:0,    pEnd:640,  step:100 },
  { yStart:1500, yEnd:1945, pStart:640,  pEnd:1140, step:50  },
  { yStart:1945, yEnd:NOW,  pStart:1140, pEnd:1520, step:10  }
];
var PMAX = 1520;

function posFromYear(y){
  for (var i=0;i<SEGMENTS.length;i++){
    var s = SEGMENTS[i];
    if (y >= s.yStart && y <= s.yEnd){
      return s.pStart + ((y - s.yStart)/(s.yEnd - s.yStart)) * (s.pEnd - s.pStart);
    }
  }
  return y < SEGMENTS[0].yStart ? 0 : PMAX;
}
function yearFromPos(p){
  for (var i=0;i<SEGMENTS.length;i++){
    var s = SEGMENTS[i];
    if (p >= s.pStart && p <= s.pEnd){
      return Math.round(s.yStart + ((p - s.pStart)/(s.pEnd - s.pStart)) * (s.yEnd - s.yStart));
    }
  }
  return p < 0 ? SEGMENTS[0].yStart : NOW;
}

/* Named eras — recall needs stable, nameable states, not arbitrary years (FR-8b). */
var ERAS = [
  { y:350,  id:'Kerajaan Awal',        en:'Early Kingdoms' },
  { y:671,  id:'Zaman Sriwijaya',      en:'Srivijayan Age' },
  { y:1042, id:'Jawa Klasik',          en:'Classical Java' },
  { y:1293, id:'Zaman Majapahit',      en:'Majapahit Age' },
  { y:1500, id:'Zaman Kesultanan',     en:'Age of Sultanates' },
  { y:1602, id:'Zaman VOC',            en:'VOC Era' },
  { y:1800, id:'Hindia Belanda',       en:'Dutch East Indies' },
  { y:1942, id:'Perang & Revolusi',    en:'War & Revolution' },
  { y:1950, id:'Zaman Soekarno',       en:'Sukarno Years' },
  { y:1966, id:'Orde Baru',            en:'New Order' },
  { y:1998, id:'Reformasi',            en:'Reformasi' }
];

/* ==================================================================
   STATE
   ================================================================== */
var S = {
  lang: 'id',
  year: 1365,          /* opens on the Majapahit peak — a full first frame */
  region: null,
  entity: null,
  study: false,
  routes: true,
  revealed: {}
};

var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

function T(key){ return CHROME[key][S.lang]; }
function nameOf(e){ return e.name[S.lang]; }
function endLabel(e){ return e.end === NOW ? T('present') : e.end; }
function activeAt(e, y){ return y >= e.start && y <= e.end; }

function pointInPoly(lon, lat, poly){
  var inside = false;
  for (var i=0, j=poly.length-1; i<poly.length; j=i++){
    var xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if (((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}

function entitiesInRegion(region, year){
  var out = [];
  DATA.forEach(function(e, i){
    if (!activeAt(e, year)) return;
    var hit = e.wide || e.nodes.some(function(n){ return pointInPoly(n.lon, n.lat, region.poly); });
    if (hit) out.push(i);
  });
  return out;
}

/* Does this region ever hold a non-archipelago-wide entity? Drives the Q3
   treatment: a region blank at every year is a statement, not a bug. */
var REGION_EVER = {};
REGIONS.forEach(function(r){
  REGION_EVER[r.id] = DATA.some(function(e){
    return !e.wide && e.nodes.some(function(n){ return pointInPoly(n.lon, n.lat, r.poly); });
  });
});

/* ==================================================================
   MAP CONSTRUCTION — built once, then mutated by attribute only (NFR-3)
   ================================================================== */
var svg = document.getElementById('map');
var SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

/* --- gradient defs: one per confidence tier. Lower confidence diffuses
       wider and softer, so uncertainty is legible at a glance (rule 3). --- */
var defs = el('defs');
var TIERS = {
  high:   [[0,0.62],[0.28,0.34],[0.60,0.11],[1,0]],
  medium: [[0,0.44],[0.24,0.26],[0.62,0.09],[1,0]],
  low:    [[0,0.30],[0.20,0.20],[0.66,0.08],[1,0]]
};
var TIER_SCALE = { high:1.0, medium:1.16, low:1.34 };
for (var tk in TIERS){
  var g = el('radialGradient', { id:'bloom-'+tk });
  TIERS[tk].forEach(function(st){
    g.appendChild(el('stop', { offset:(st[0]*100)+'%', 'stop-color':'#d9ab55', 'stop-opacity':st[1] }));
  });
  defs.appendChild(g);
}
svg.appendChild(defs);

/* --- graticule: nautical-chart register, 5° --- */
var gGrat = el('g', { class:'graticule' });
for (var lon=95; lon<=140; lon+=5) gGrat.appendChild(el('line', { x1:px(lon), y1:0, x2:px(lon), y2:H }));
for (var lat=5; lat>=-10; lat-=5) gGrat.appendChild(el('line', { x1:0, y1:py(lat), x2:W, y2:py(lat) }));
svg.appendChild(gGrat);

/* --- landmass --- */
function ringPoints(str){
  return str.split(' ').map(function(pair){
    var c = pair.split(',');
    return px(+c[0]).toFixed(1) + ',' + py(+c[1]).toFixed(1);
  }).join(' ');
}
var LAND_PTS = LAND.map(ringPoints);
var gLand = el('g');
LAND_PTS.forEach(function(p){ gLand.appendChild(el('polygon', { class:'land', points:p })); });
svg.appendChild(gLand);

/* --- colonial hard edges (PRD 08 rule 4). The contrast between fuzzy
       pre-colonial bloom and surveyed colonial line IS the lesson. --- */
var gHard = el('g', { class:'hard' });
var hardNodes = {};
DATA.forEach(function(e, i){
  if (!e.hardEdge) return;
  var grp = el('g', { opacity:0 });
  LAND.forEach(function(ring, ri){
    /* include a landmass if any of its vertices fall within reach of a node */
    var pts = ring.split(' ');
    var within = false;
    for (var q=0; q<pts.length && !within; q+=2){
      var c = pts[q].split(',');
      var lo = +c[0], la = +c[1];
      within = e.nodes.some(function(n){
        var dx = lo - n.lon, dy = la - n.lat;
        return Math.sqrt(dx*dx + dy*dy) <= e.reach;
      });
    }
    if (within) grp.appendChild(el('polygon', { class:'hp', points:LAND_PTS[ri] }));
  });
  gHard.appendChild(grp);
  hardNodes[i] = grp;
});
svg.appendChild(gHard);

/* --- sea lanes --- */
var gRoutes = el('g');
var routeNodes = {};
ROUTES.forEach(function(r){
  var d = r.pts.map(function(p,i){ return (i?'L':'M') + px(p[0]).toFixed(1) + ' ' + py(p[1]).toFixed(1); }).join(' ');
  var path = el('path', { class:'route', d:d });
  var tx = el('text', { class:'route-label', x:px(r.lab[0]).toFixed(1), y:py(r.lab[1]).toFixed(1),
    transform:'rotate(' + r.rot + ' ' + px(r.lab[0]).toFixed(1) + ' ' + py(r.lab[1]).toFixed(1) + ')' });
  gRoutes.appendChild(path); gRoutes.appendChild(tx);
  routeNodes[r.id] = { path:path, text:tx, def:r };
});
svg.appendChild(gRoutes);

/* --- influence bloom, screen-blended so overlaps add like light --- */
var gInf = el('g', { class:'influence' });
var bloomNodes = {};
DATA.forEach(function(e, i){
  if (e.hardEdge && e.wide) return;      /* archipelago-wide powers use the hard edge instead */
  var grp = el('g', { class:'bloom', opacity:0 });
  e.nodes.forEach(function(n){
    var mult = n.kind === 'capital' ? 1 : (n.kind === 'port' ? 0.72 : 0.55);
    var r = e.reach * TIER_SCALE[e.conf] * mult * VIEW.k;
    grp.appendChild(el('circle', {
      cx:px(n.lon).toFixed(1), cy:py(n.lat).toFixed(1), r:r.toFixed(1),
      fill:'url(#bloom-' + e.conf + ')'
    }));
  });
  gInf.appendChild(grp);
  bloomNodes[i] = grp;
});
svg.appendChild(gInf);

/* --- region hit + highlight layer. Hit areas are their own layer so
       Ternate and Tidore stay tappable at true scale (NFR-5). --- */
var gRegions = el('g');
var regionNodes = {};
REGIONS.forEach(function(r, ri){
  var pts = r.poly.map(function(p){ return px(p[0]).toFixed(1) + ',' + py(p[1]).toFixed(1); }).join(' ');
  var hit = el('polygon', { class:'region-hit', points:pts, tabindex:'0', role:'button' });
  var glow = el('polygon', { class:'region-glow', points:pts });
  hit.addEventListener('click', function(){ selectRegion(r.id); });
  hit.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); selectRegion(r.id); }
    else if (ev.key === 'Escape'){ clearSelection(); }
  });
  hit.addEventListener('mouseenter', function(){ setHot(r.id, true); });
  hit.addEventListener('mouseleave', function(){ setHot(r.id, false); });
  gRegions.appendChild(hit); gRegions.appendChild(glow);
  regionNodes[r.id] = { hit:hit, glow:glow, def:r };
});
svg.appendChild(gRegions);

/* --- entity capital/port nodes --- */
var gNodes = el('g');
var entNodeEls = {};
DATA.forEach(function(e, i){
  var grp = el('g', { class:'node', opacity:0 });
  e.nodes.forEach(function(n){
    if (n.kind === 'vassal') return;               /* keep the map quiet; vassals show as bloom only */
    var r = n.kind === 'capital' ? 2.6 : 1.9;
    grp.appendChild(el('circle', { cx:px(n.lon).toFixed(1), cy:py(n.lat).toFixed(1), r:r }));
  });
  gNodes.appendChild(grp);
  entNodeEls[i] = grp;
});
svg.appendChild(gNodes);

/* --- region labels, above everything --- */
var gLabels = el('g');
var labelNodes = {};
REGIONS.forEach(function(r){
  var g = el('g', { class:'rlabel' });
  var t = el('text', { x:px(r.lab[0]).toFixed(1), y:py(r.lab[1]).toFixed(1) });
  g.appendChild(t);
  gLabels.appendChild(g);
  labelNodes[r.id] = { g:g, text:t };
});
svg.appendChild(gLabels);

/* ==================================================================
   SCRUBBER — engraved ruler + density track
   ================================================================== */
var ruler = document.getElementById('ruler');
var range = document.getElementById('era-range');
var eraNames = document.getElementById('era-names');
var RW = 1000, RH = 62;                 /* ruler is drawn in its own units and stretched */
ruler.setAttribute('viewBox', '0 0 ' + RW + ' ' + RH);
function rx(pos){ return (pos / PMAX) * RW; }

(function buildRuler(){
  /* density: how many entities are active at each sample. Sparse centuries
     then read as "little recorded here" rather than broken UI (FR-8c). */
  var SAMPLES = 200, counts = [], max = 0;
  for (var i=0;i<SAMPLES;i++){
    var y = yearFromPos((i + 0.5) / SAMPLES * PMAX);
    var c = 0;
    DATA.forEach(function(e){ if (activeAt(e, y)) c++; });
    counts.push(c); if (c > max) max = c;
  }
  var gd = el('g');
  var bw = RW / SAMPLES;
  counts.forEach(function(c, i){
    var h = max ? (c / max) * 20 : 0;
    gd.appendChild(el('rect', {
      x:(i*bw).toFixed(2), y:(20 - h).toFixed(2), width:(bw + 0.35).toFixed(2), height:h.toFixed(2),
      fill:'#d9ab55', 'fill-opacity':0.16
    }));
  });
  ruler.appendChild(gd);

  /* engraved ruler: dense hairline minors, sparse taller majors */
  var gt = el('g');
  gt.appendChild(el('line', { x1:0, y1:33, x2:RW, y2:33, stroke:'#2a2419', 'stroke-width':1 }));
  SEGMENTS.forEach(function(s){
    var minor = s.step / 2;
    for (var y = s.yStart; y <= s.yEnd; y += minor){
      var isMajor = (y % s.step === 0);
      var X = rx(posFromYear(y));
      gt.appendChild(el('line', {
        x1:X.toFixed(2), y1:33, x2:X.toFixed(2), y2:(isMajor ? 41 : 37).toFixed(2),
        stroke: isMajor ? '#4a4232' : '#2f2a1e', 'stroke-width':0.8
      }));
    }
  });
  ruler.appendChild(gt);

  /* scale-break marks: the scale changes, so the UI says so (FR-8a) */
  var gb = el('g');
  [SEGMENTS[1].pStart, SEGMENTS[2].pStart].forEach(function(p){
    var X = rx(p);
    gb.appendChild(el('line', { x1:X.toFixed(2), y1:8, x2:X.toFixed(2), y2:47,
      stroke:'#5a4a26', 'stroke-width':1, 'stroke-dasharray':'2 3' }));
  });
  ruler.appendChild(gb);

  /* throughline + handle bloom, so the current position is findable
     without hunting for the disc */
  var gh = el('g');
  var thr = el('line', { id:'thr', x1:0, y1:4, x2:0, y2:52, stroke:'#d9ab55', 'stroke-width':1, 'stroke-opacity':0.55 });
  gh.appendChild(thr);
  ruler.appendChild(gh);
  ruler._thr = thr;

  /* year labels under the majors, one per segment boundary + a few anchors */
  var gl = el('g');
  [300, 1000, 1500, 1800, 1945, NOW].forEach(function(y){
    var X = rx(posFromYear(y));
    var anchor = y === 300 ? 'start' : (y === NOW ? 'end' : 'middle');
    var t = el('text', { x:X.toFixed(2), y:57, 'text-anchor':anchor,
      fill:'#6e6555', 'font-size':'9', 'font-family':'IBM Plex Mono, monospace' });
    t.textContent = y === NOW ? String(NOW) : String(y);
    gl.appendChild(t);
  });
  ruler.appendChild(gl);
})();

/* era tick names under the track */
ERAS.forEach(function(era, i){
  var s = document.createElement('span');
  s.style.left = ((posFromYear(era.y) / PMAX) * 100).toFixed(3) + '%';
  s.dataset.i = i;
  eraNames.appendChild(s);
});

function currentEra(){
  var found = ERAS[0];
  for (var i=0;i<ERAS.length;i++) if (S.year >= ERAS[i].y) found = ERAS[i];
  return found;
}
function nearestEraIndex(year){
  var best = 0, bd = Infinity;
  ERAS.forEach(function(e, i){
    var d = Math.abs(posFromYear(e.y) - posFromYear(year));
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}

/* Free scrub while dragging; the handle settles on an era on release. */
range.addEventListener('input', function(){
  S.year = yearFromPos(+range.value);
  render();
});
range.addEventListener('change', function(){
  var idx = nearestEraIndex(S.year);
  setYear(ERAS[idx].y);
});
range.addEventListener('keydown', function(ev){
  var idx = nearestEraIndex(S.year), next = null;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp'){
    next = Math.min(ERAS.length - 1, S.year >= ERAS[idx].y && idx < ERAS.length-1 ? idx + 1 : idx);
  } else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown'){
    next = Math.max(0, S.year <= ERAS[idx].y ? idx - 1 : idx);
  } else if (ev.key === 'Home'){ next = 0; }
  else if (ev.key === 'End'){ next = ERAS.length - 1; }
  if (next !== null){ ev.preventDefault(); setYear(ERAS[next].y); }
});

function setYear(y){
  S.year = y;
  range.value = Math.round(posFromYear(y));
  LS.set('nusantara-map-year', String(y));
  render();
}

/* ==================================================================
   SELECTION
   ================================================================== */
var hotRegion = null;
function setHot(id, on){
  hotRegion = on ? id : null;
  var n = labelNodes[id];
  if (n) n.g.classList.toggle('hot', on);
}
function selectRegion(id){
  S.region = id;
  S.entity = null;
  var n = labelNodes[id];
  if (n) n.g.classList.add('rv');
  render();
}
function clearSelection(){
  S.region = null; S.entity = null;
  render();
}
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape') clearSelection();
});

/* ==================================================================
   RENDER
   ================================================================== */
var rail = document.getElementById('rail');
var badgeYear = document.getElementById('badge-year');
var badgeEra = document.getElementById('badge-era');
var badgeCount = document.getElementById('badge-count');

function render(){
  var y = S.year;

  /* --- map layers --- */
  var activeRouteIds = {};
  var activeCount = 0;
  DATA.forEach(function(e, i){
    var on = activeAt(e, y);
    if (on){
      activeCount++;
      e.routes.forEach(function(r){ activeRouteIds[r] = true; });
    }
    if (bloomNodes[i]) bloomNodes[i].setAttribute('opacity', on ? 1 : 0);
    if (hardNodes[i]) hardNodes[i].setAttribute('opacity', on ? 1 : 0);
    if (entNodeEls[i]) entNodeEls[i].setAttribute('opacity', on ? 0.9 : 0);
  });

  ROUTES.forEach(function(r){
    var n = routeNodes[r.id];
    var show = S.routes;
    n.path.style.display = show ? '' : 'none';
    n.text.style.display = show ? '' : 'none';
    n.path.classList.toggle('hot', !!activeRouteIds[r.id]);
    n.text.classList.toggle('hot', !!activeRouteIds[r.id]);
    n.text.textContent = r.label[S.lang];
  });

  REGIONS.forEach(function(r){
    var n = regionNodes[r.id], l = labelNodes[r.id];
    n.glow.classList.toggle('sel', S.region === r.id);
    l.g.classList.toggle('sel', S.region === r.id);
    l.text.textContent = r.label[S.lang];
    n.hit.setAttribute('aria-label', r.label[S.lang]);
  });

  /* --- era badge --- */
  var era = currentEra();
  badgeYear.textContent = y >= NOW ? String(NOW) : String(y);
  badgeEra.textContent = era[S.lang];
  badgeCount.textContent = activeCount + ' ' + T('entities');

  /* --- era name strip --- */
  var curIdx = ERAS.indexOf(era);
  Array.prototype.forEach.call(eraNames.children, function(s, i){
    s.textContent = ERAS[i][S.lang];
    s.classList.toggle('on', i === curIdx);
  });

  /* --- scrubber throughline --- */
  var X = rx(posFromYear(y));
  ruler._thr.setAttribute('x1', X.toFixed(2));
  ruler._thr.setAttribute('x2', X.toFixed(2));

  renderRail();
}

function renderRail(){
  if (!S.region){
    rail.innerHTML =
      '<div class="rail-label">' + esc(T('railIdle')) + '</div>' +
      '<div class="rail-empty">' + esc(T('railIdleBody')) + '</div>' +
      (S.study ? '<div class="study-hint">' + esc(T('studyHint')) + '</div>' : '') +
      '<div class="rail-empty" style="margin-top:16px;font-size:0.78rem;">' + esc(T('confHint')) + '</div>';
    return;
  }

  var region = REGIONS.filter(function(r){ return r.id === S.region; })[0];
  var idxs = entitiesInRegion(region, S.year);

  var html =
    '<div class="rail-label">' + esc(T('activeHere')) + '</div>' +
    '<h2>' + esc(region.label[S.lang]) + '</h2>' +
    '<div class="rail-count mono">' + (S.year >= NOW ? NOW : S.year) + ' · ' + idxs.length + ' ' + esc(T('entities')) + '</div>';

  if (!idxs.length){
    html += '<div class="rail-empty">' +
      esc(REGION_EVER[region.id] ? T('railNone') : T('railGap')) + '</div>';
  } else {
    html += '<div class="ent-list">';
    idxs.forEach(function(i){
      var e = DATA[i];
      html +=
        '<button type="button" class="ent c-' + e.cat + (S.entity === i ? ' sel' : '') +
          (S.revealed[i] ? ' rv' : '') + '" data-i="' + i + '">' +
          '<div class="en">' + esc(nameOf(e)) +
            (e.wide ? '<span class="tag">' + esc(T('wide')) + '</span>' : '') + '</div>' +
          '<div class="ey">' + e.start + '–' + esc(String(endLabel(e))) +
            ' · ' + esc(CHROME.catNames[e.cat][S.lang]) + '</div>' +
          '<div class="ed">' + esc(e.desc[S.lang]) + '</div>' +
          '<div class="conf">' + esc(CHROME.confLabel[e.conf][S.lang]) + '</div>' +
        '</button>';
    });
    html += '</div>';
  }

  if (S.study && idxs.length) html += '<div class="study-hint">' + esc(T('studyHint')) + '</div>';
  rail.innerHTML = html;

  Array.prototype.forEach.call(rail.querySelectorAll('.ent'), function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.i;
      S.entity = (S.entity === i) ? null : i;
      S.revealed[i] = true;
      LS.set('nusantara-map-revealed', JSON.stringify(S.revealed));
      renderRail();
    });
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* ==================================================================
   CHROME + TOGGLES
   ================================================================== */
var app = document.getElementById('app');

function applyChrome(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(n){
    n.textContent = CHROME[n.getAttribute('data-i18n')][S.lang];
  });
  document.getElementById('btn-id').classList.toggle('active', S.lang === 'id');
  document.getElementById('btn-en').classList.toggle('active', S.lang === 'en');
  document.getElementById('map-title').textContent = T('title') + ' — ' + T('caveatLead');
  document.documentElement.lang = S.lang;
}

function setLang(l){
  S.lang = l;
  LS.set('nusantara-map-lang', l);
  applyChrome();
  render();
}
document.getElementById('btn-id').addEventListener('click', function(){ setLang('id'); });
document.getElementById('btn-en').addEventListener('click', function(){ setLang('en'); });

var studyBtn = document.getElementById('study-btn');
studyBtn.addEventListener('click', function(){
  S.study = !S.study;
  app.classList.toggle('study', S.study);
  studyBtn.classList.toggle('on', S.study);
  studyBtn.setAttribute('aria-pressed', S.study ? 'true' : 'false');
  LS.set('nusantara-map-study', S.study ? '1' : '0');
  renderRail();
});

var routesBtn = document.getElementById('routes-btn');
routesBtn.addEventListener('click', function(){
  S.routes = !S.routes;
  routesBtn.classList.toggle('on', S.routes);
  routesBtn.setAttribute('aria-pressed', S.routes ? 'true' : 'false');
  LS.set('nusantara-map-routes', S.routes ? '1' : '0');
  render();
});

/* ==================================================================
   BOOT
   ================================================================== */
S.lang  = LS.get('nusantara-map-lang', 'id') === 'en' ? 'en' : 'id';
S.study = LS.get('nusantara-map-study', '0') === '1';
S.routes = LS.get('nusantara-map-routes', '1') === '1';
try { S.revealed = JSON.parse(LS.get('nusantara-map-revealed', '{}')) || {}; } catch(e){ S.revealed = {}; }
var savedYear = parseInt(LS.get('nusantara-map-year', '1365'), 10);
S.year = isNaN(savedYear) ? 1365 : savedYear;

app.classList.toggle('study', S.study);
studyBtn.classList.toggle('on', S.study);
studyBtn.setAttribute('aria-pressed', S.study ? 'true' : 'false');
routesBtn.classList.toggle('on', S.routes);
routesBtn.setAttribute('aria-pressed', S.routes ? 'true' : 'false');

range.value = Math.round(posFromYear(S.year));
applyChrome();
render();

})();
</script>
