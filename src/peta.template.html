<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Nusantara — Sejarah Kerajaan Indonesia dalam Peta & Garis Waktu</title>
<meta name="description" content="Jelajahi sejarah Nusantara lewat peta interaktif: dari migrasi Austronesia hingga kerajaan Sriwijaya dan Majapahit, setiap kekuatan dijelaskan lewat letak geografisnya. — Explore the history of the Indonesian archipelago on an interactive map, from Austronesian migration to Srivijaya and Majapahit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Two designed themes, not one inverted (PRD NFR-7).

     PRD 16's objection to a light ground was real: a gold radial gradient on
     paper reads as a stain. The fix is to change what the bloom IS per theme.
     On near-black it is screen-blended light, radiating from a centre. On
     paper it is multiply-blended pigment — an ink wash, as on a hand-tinted
     chart. Same data, different physics. The light ground echoes the timeline
     artifact's paper so the two views read as siblings.

     Three viewer states: an explicit choice stamps data-theme on the root;
     the default "system" state stamps nothing and only prefers-color-scheme
     applies. So: bare :root is the complete LIGHT set, the media query
     redefines to dark unless light was chosen, and [data-theme="dark"] wins
     the other way. Every token exists here first. */
  :root{
    color-scheme: light;
    --ease-out:      cubic-bezier(.22, 1, .36, 1);   /* theme-independent */
    --ground:        #f3ede0;
    /* Paper chart: the sea leans cool and the land leans warm so that ochre
       pigment multiplied onto land reads as a tint, not as mud. */
    --ocean:         oklch(92.5% 0.014 215);
    --ocean-hi:      oklch(95% 0.010 215);
    --ocean-deep:    oklch(88.5% 0.018 215);
    --land:          oklch(91.5% 0.026 88);
    --land-edge:     oklch(76% 0.055 85);
    --gold:          #96691a;
    --gold-warm:     #b5822a;
    --route:         #1f7a70;
    --route-hi:      #146a60;
    --colonial:      #4a3aa7;
    --colonial-fill: rgba(74,58,167,0.12);
    --ink-1:         #221c14;
    --ink-2:         #5b5347;
    --ink-3:         #8c8371;
    --line:          #ddd2ba;
    --surface:       #fbf8f1;
    --surface-2:     #f1eadb;
    --surface-3:     #e8dfcb;
    --accent-line:   #cfa863;
    --panel-bg:      rgba(251,248,241,0.92);
    --swatch-line:   rgba(34,28,20,0.18);
    --halo:          rgba(251,248,241,0.92);   /* text halo, so labels sit on the ground */

    /* Controls are ink, not gold. Gold is a legend entry (influence, the time
       cursor); a language button must not share a colour with Majapahit. */
    --ui:            oklch(24% 0.012 70);
    --ui-on:         #fbf8f1;
    --ui-ring:       oklch(30% 0.02 70);
    --sel-wash:      rgba(150,105,26,0.07);    /* selected power: a wash of its own colour */
    --terracotta:    #905831;
    --terracotta-soft: rgba(144, 88, 49, 0.12);
    --terracotta-wash: rgba(144, 88, 49, 0.08);
    --terracotta-hi:   #7d4b29;
    --terracotta-fg:   #fbf8f1;
    --shadow-soft:   0 18px 40px rgba(31, 24, 17, 0.12);

    /* Influence: pigment on paper. Sienna rather than the UI gold, multiplied. */
    --bloom:         oklch(56% 0.13 55);
    --bloom-swatch:  oklch(56% 0.13 55 / 0.55);
    --blend:         multiply;
    --bh0:.62; --bh1:.36; --bh2:.13; --bh3:0;    /* high confidence: tight */
    --bm0:.46; --bm1:.28; --bm2:.10; --bm3:0;    /* medium */
    --bl0:.32; --bl1:.21; --bl2:.08; --bl3:0;    /* low: diffuse — uncertainty is visible */
    --glow-fill:       oklch(56% 0.13 55 / 0.07);
    --glow-stroke:     oklch(56% 0.13 55 / 0.45);
    --glow-fill-sel:   oklch(56% 0.13 55 / 0.10);
    --glow-stroke-sel: oklch(56% 0.13 55 / 0.75);
    --gold-glow-a:     rgba(150,105,26,0.22);
    --gold-glow-b:     rgba(150,105,26,0.30);
    --vanmook:       #2a2116;

    /* Faction channel — separate from the influence channel, because these
       are 20th-century political blocs, not mandala spheres. */
    --f-nat:         #b8402f;   /* republican / nationalist (PNI) */
    --f-islam:       #2f7d4f;   /* Islamic (Masyumi, NU, Darul Islam) */
    --f-komunis:     #a8446f;   /* communist (PKI) — deliberately not red, see README */
    --f-kristen:     #2f6fae;   /* Christian parties (Parkindo, Partai Katolik) */
    --f-none:        #b3a892;
    /* 1965-66 — its own channel, never "influence". Burnt umber, not red:
       red is PNI's and the Republic's colour, and the killings are a record. */
    --violence:      oklch(38% 0.08 35);
    --violence-text: oklch(38% 0.08 35);
    --mig:           #2c7d93;   /* Austronesian migration */
    --mig-text:      #1f6478;

    /* Scrubber ruler */
    --rl-base:  #ddd2ba; --rl-major: #a89b83; --rl-minor: #cfc4aa;
    --rl-break: #b5905a; --rl-lab:   #8c8371;
    --dens:     #96691a; --dens-a: .18; --thr: #96691a;
    --grat:     #d3dcdd;

    /* Timeline category colours, light variants — carried from the chart.
       Modern is near-ink rather than the chart's red: red already belongs to
       the Republic here, and modern is the era the chrome itself lives in. */
    --cat-classical: #2a78d6; --cat-islamic: #eb6834; --cat-modern: oklch(40% 0.02 60);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:        #0c0b09;
      --ocean:         #0f1115;
      --ocean-hi:      #12151a;
      --ocean-deep:    #0b0d10;
      --land:          #272219;
      --land-edge:     #3d3626;
      --gold:          #d9ab55;
      --gold-warm:     #f0c877;
      --route:         #3f9d92;
      --route-hi:      #63c8bb;
      --colonial:      #9085e9;
      --colonial-fill: rgba(144,133,233,0.10);
      --ink-1:         #f3ecdd;
      --ink-2:         #a89b83;
      --ink-3:         #6e6555;
      --line:          #2a2419;
      --surface:       #14120e;
      --surface-2:     #1c1913;
      --surface-3:     #231e16;
      --accent-line:   #4a3c1e;
      --panel-bg:      rgba(14,12,9,0.90);
      --swatch-line:   rgba(255,255,255,0.18);
      --halo:          rgba(12,11,9,0.90);
      --ui:            oklch(92% 0.012 80);
      --ui-on:         #14120e;
      --ui-ring:       oklch(88% 0.02 80);
      --sel-wash:      rgba(217,171,85,0.07);
      --bloom:         #d9ab55;
      --bloom-swatch:  rgba(217,171,85,0.62);
      --terracotta:    #c98a5e;
      --terracotta-soft: rgba(201, 138, 94, 0.16);
      --terracotta-wash: rgba(201, 138, 94, 0.10);
      --terracotta-hi:   #d99e73;
      --terracotta-fg:   #1a1209;
      --blend:         screen;
      --bh0:.62; --bh1:.34; --bh2:.11; --bh3:0;
      --bm0:.44; --bm1:.26; --bm2:.09; --bm3:0;
      --bl0:.30; --bl1:.20; --bl2:.08; --bl3:0;
      --glow-fill:       rgba(217,171,85,0.05);
      --glow-stroke:     rgba(217,171,85,0.30);
      --glow-fill-sel:   rgba(217,171,85,0.075);
      --glow-stroke-sel: rgba(217,171,85,0.55);
      --gold-glow-a:     rgba(217,171,85,0.20);
      --gold-glow-b:     rgba(217,171,85,0.34);
      --vanmook:       #e8dcc0;
      --f-nat:         #d0503f;
      --f-islam:       #46a06a;
      --f-komunis:     #c9628f;
      --f-kristen:     #5b9bd5;
      --f-none:        #574f42;
      --violence:      oklch(55% 0.09 35);
      --violence-text: oklch(80% 0.06 35);
      --mig:           #7fb6c9;
      --mig-text:      #9fd0de;
      --rl-base:  #2a2419; --rl-major: #4a4232; --rl-minor: #2f2a1e;
      --rl-break: #5a4a26; --rl-lab:   #6e6555;
      --dens:     #d9ab55; --dens-a: .16; --thr: #d9ab55; --grat: #1a1e24;
      --cat-classical: #3987e5; --cat-islamic: #e07a44; --cat-modern: oklch(78% 0.02 80);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:        #0c0b09;
    --ocean:         #0f1115;
    --ocean-hi:      #12151a;
    --ocean-deep:    #0b0d10;
    --land:          #272219;
    --land-edge:     #3d3626;
    --gold:          #d9ab55;
    --gold-warm:     #f0c877;
    --route:         #3f9d92;
    --route-hi:      #63c8bb;
    --colonial:      #9085e9;
    --colonial-fill: rgba(144,133,233,0.10);
    --ink-1:         #f3ecdd;
    --ink-2:         #a89b83;
    --ink-3:         #6e6555;
    --line:          #2a2419;
    --surface:       #14120e;
    --surface-2:     #1c1913;
    --surface-3:     #231e16;
    --accent-line:   #4a3c1e;
    --panel-bg:      rgba(14,12,9,0.90);
    --swatch-line:   rgba(255,255,255,0.18);
    --halo:          rgba(12,11,9,0.90);
    --ui:            oklch(92% 0.012 80);
    --ui-on:         #14120e;
    --ui-ring:       oklch(88% 0.02 80);
    --sel-wash:      rgba(217,171,85,0.07);
    --bloom:         #d9ab55;
    --bloom-swatch:  rgba(217,171,85,0.62);
    --terracotta:    #c98a5e;
    --terracotta-soft: rgba(201, 138, 94, 0.16);
    --terracotta-wash: rgba(201, 138, 94, 0.10);
    --terracotta-hi:   #d99e73;
    --terracotta-fg:   #1a1209;
    --blend:         screen;
    --bh0:.62; --bh1:.34; --bh2:.11; --bh3:0;
    --bm0:.44; --bm1:.26; --bm2:.09; --bm3:0;
    --bl0:.30; --bl1:.20; --bl2:.08; --bl3:0;
    --glow-fill:       rgba(217,171,85,0.05);
    --glow-stroke:     rgba(217,171,85,0.30);
    --glow-fill-sel:   rgba(217,171,85,0.075);
    --glow-stroke-sel: rgba(217,171,85,0.55);
    --gold-glow-a:     rgba(217,171,85,0.20);
    --gold-glow-b:     rgba(217,171,85,0.34);
    --vanmook:       #e8dcc0;
    --f-nat:         #d0503f;
    --f-islam:       #46a06a;
    --f-komunis:     #c9628f;
    --f-kristen:     #5b9bd5;
    --f-none:        #574f42;
    --violence:      oklch(55% 0.09 35);
    --violence-text: oklch(80% 0.06 35);
    --mig:           #7fb6c9;
    --mig-text:      #9fd0de;
    --rl-base:  #2a2419; --rl-major: #4a4232; --rl-minor: #2f2a1e;
    --rl-break: #5a4a26; --rl-lab:   #6e6555;
    --dens:     #d9ab55; --dens-a: .16; --thr: #d9ab55; --grat: #1a1e24;
    --cat-classical: #3987e5; --cat-islamic: #e07a44; --cat-modern: oklch(78% 0.02 80);
  }

  /* SVG built by script carries classes, not colours; these resolve them. */
  #bloom-high   .s0{ stop-color: var(--bloom); stop-opacity: var(--bh0); }
  #bloom-high   .s1{ stop-color: var(--bloom); stop-opacity: var(--bh1); }
  #bloom-high   .s2{ stop-color: var(--bloom); stop-opacity: var(--bh2); }
  #bloom-high   .s3{ stop-color: var(--bloom); stop-opacity: var(--bh3); }
  #bloom-medium .s0{ stop-color: var(--bloom); stop-opacity: var(--bm0); }
  #bloom-medium .s1{ stop-color: var(--bloom); stop-opacity: var(--bm1); }
  #bloom-medium .s2{ stop-color: var(--bloom); stop-opacity: var(--bm2); }
  #bloom-medium .s3{ stop-color: var(--bloom); stop-opacity: var(--bm3); }
  #bloom-low    .s0{ stop-color: var(--bloom); stop-opacity: var(--bl0); }
  #bloom-low    .s1{ stop-color: var(--bloom); stop-opacity: var(--bl1); }
  #bloom-low    .s2{ stop-color: var(--bloom); stop-opacity: var(--bl2); }
  #bloom-low    .s3{ stop-color: var(--bloom); stop-opacity: var(--bl3); }
  .dens{ fill: var(--dens); fill-opacity: var(--dens-a); }
  .rl-base{ stroke: var(--rl-base); stroke-width:1; }
  .rl-major{ stroke: var(--rl-major); stroke-width:.8; }
  .rl-minor{ stroke: var(--rl-minor); stroke-width:.8; }
  .rl-break{ stroke: var(--rl-break); stroke-width:1; stroke-dasharray:2 3; }
  .rl-lab{ fill: var(--rl-lab); font-size:9px; font-family:'IBM Plex Mono', monospace; }
  /* Year labels live in HTML, not the stretched SVG, so their glyphs keep
     their aspect ratio however wide the scrubber is drawn. */
  .rl-labs{ position:absolute; left:0; right:0; bottom:2px; height:11px; pointer-events:none; }
  .rl-labs span{ position:absolute; bottom:0; transform:translateX(-50%);
    color: var(--rl-lab); font:9px/1 'IBM Plex Mono', monospace; white-space:nowrap; }
  .rl-labs span[data-a="start"]{ transform:none; }
  .rl-labs span[data-a="end"]{ transform:translateX(-100%); }
  #thr{ stroke: var(--thr); stroke-width:1; stroke-opacity:.55; }
  .dutch-dot{ fill: var(--colonial); fill-opacity:.30; stroke: var(--colonial); stroke-width:1.1; vector-effect: non-scaling-stroke; r: calc(4.5px / var(--mz)); }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--ground);
    color: var(--ink-1);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; font-weight:700; margin:0; text-wrap: balance; }

  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .app{
    display: grid;
    grid-template-rows: auto minmax(0,1fr) auto;
    min-height: 100vh;
  }
  /* On desktop the middle row must be bounded, or a long rail (the prologue,
     a selected entity's three answers) stretches it past the viewport and the
     map's slice-fit zooms in to fill the taller box. Bounded, the rail scrolls
     inside itself and the map stays put. Mobile stacks and flows instead. */
  @media (min-width: 901px){
    .app{ height: 100vh; }
  }

  /* ============================ Header ============================ */
  .head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 20px; flex-wrap: wrap;
    padding: 16px 22px 13px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.15em;
    text-transform: uppercase; color: var(--ink-3); font-weight:600; margin-bottom:5px;
  }
  .head h1{ font-size: clamp(1.25rem, 2.4vw, 1.7rem); letter-spacing:-0.01em; line-height:1.1; }
  .head .sub{ color: var(--ink-2); font-size:0.84rem; margin-top:4px; max-width: 54ch; }

  .controls{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
  .ctl-row{ display:flex; gap:8px; align-items:center; flex-wrap: wrap; justify-content:flex-end; }

  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background: var(--surface-2); }
  .seg button{
    appearance:none; border:none; background:transparent; color: var(--ink-2);
    font: inherit; font-weight:600; font-size:0.76rem; padding:7px 14px; cursor:pointer;
    transition: background .14s, color .14s;
  }
  .seg button:hover{ color: var(--ink-1); }
  .seg button.active{ background: var(--ui); color: var(--ui-on); }
  .seg button:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:-2px; }

  /* Not a toggle, so no knob: a way back to the front door. Ink, like
     every other control on the plate. */
  .ghost{
    border:1px solid var(--line); border-radius:999px; background: var(--surface-2);
    padding:7px 14px; cursor:pointer; font:inherit; font-weight:600;
    font-size:0.75rem; color: var(--ink-2);
    transition: color .14s, border-color .14s;
  }
  .ghost:hover{ color: var(--ink-1); border-color: var(--ink-3); }
  .ghost:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }

  .pill{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-radius:999px; background: var(--surface-2);
    padding:6px 13px 6px 6px; cursor:pointer; font:inherit; font-weight:600;
    font-size:0.75rem; color: var(--ink-2);
    transition: color .14s, border-color .14s;
  }
  .pill .knob{
    width:28px; height:17px; border-radius:999px; background: var(--surface-3);
    border:1px solid var(--line); position:relative; flex-shrink:0; transition: background .15s;
  }
  .pill .knob::after{
    content:''; position:absolute; top:1px; left:1px; width:13px; height:13px;
    border-radius:50%; background: var(--ink-3); transition: transform .15s, background .15s;
  }
  .pill.on{ color: var(--ink-1); border-color: var(--ink-3); }
  .pill.on .knob{ background: var(--ui); border-color: var(--ui); }
  .pill.on .knob::after{ transform: translateX(11px); background: var(--ui-on); }
  /* The sea-lanes toggle wears the colour of the layer it switches on. */
  #routes-btn.on .knob{ background: var(--route); border-color: var(--route); }
  #routes-btn.on .knob::after{ background: var(--surface); }
  .pill:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }

  /* ============================ Stage ============================ */
  .stage{
    display: grid;
    grid-template-columns: minmax(0,1fr) 336px;
    min-height: 0;
  }

  .map-wrap{
    position: relative;
    background:
      radial-gradient(120% 90% at 50% 42%, var(--ocean-hi) 0%, var(--ocean) 45%, var(--ocean-deep) 100%);
    overflow: hidden;
    min-height: 340px;
  }
  /* --mz is the live zoom factor. The map scales; the chart's furniture does
     not, so anything that must hold its size on screen divides by it. Strokes
     use non-scaling-stroke, which does the same job natively. */
  svg.map{ display:block; width:100%; height:100%; --mz:1; touch-action:pan-y; }
  svg.map.grabbing{ cursor:grabbing; }

  /* Standing caveat — PRD 08 binding rule 2. Present in every era view. */
  .caveat{
    position:absolute; left:16px; bottom:12px; pointer-events:none;
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.09em;
    text-transform: uppercase; color: var(--ink-3); max-width: 46ch; line-height:1.5;
  }
  .caveat b{ color: var(--gold); font-weight:600; }

  .era-badge{
    position:absolute; left:16px; top:14px; pointer-events:none;
  }
  .era-badge .yr{
    font-family:'IBM Plex Mono', monospace; font-size:1.55rem; font-weight:600;
    color: var(--ink-1); line-height:1; letter-spacing:-0.01em;
  }
  .era-badge .nm{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.13em;
    text-transform: uppercase; color: var(--gold); margin-top:6px; font-weight:600;
  }
  .era-badge .ct{ font-size:0.74rem; color: var(--ink-3); margin-top:3px; }

  .legend-map{
    position:absolute; right:14px; top:14px; pointer-events:none;
    display:grid; gap:5px; justify-items:end;
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.05em;
    color: var(--ink-3);
  }
  .legend-map div{ display:flex; align-items:center; gap:7px; }
  .legend-map i{ width:22px; height:0; display:block; flex-shrink:0; }
  .lg-bloom{ height:9px; border-radius:2px; background: linear-gradient(90deg, var(--bloom-swatch), transparent); }
  .lg-hard{ height:9px; border-radius:2px; border:1px solid var(--colonial); background: var(--colonial-fill); }
  .lg-route{ border-top:1.5px dashed var(--route); }

  /* Zoom controls, typographic like the rest of the plate: a plus, a minus,
     and a readout that doubles as the way back to the whole archipelago. */
  .zoom-ctl{ position:absolute; right:14px; bottom:14px; display:grid; gap:4px; }
  .zoom-ctl button{
    appearance:none; cursor:pointer; padding:0; width:30px; height:26px; line-height:1;
    background: var(--panel-bg); border:1px solid var(--line); border-radius:6px;
    color: var(--ink-2); font:inherit; font-weight:600; font-size:0.82rem;
    transition: color .14s, border-color .14s;
  }
  .zoom-ctl button:hover:not(:disabled){ color: var(--ink-1); border-color: var(--ink-3); }
  .zoom-ctl button:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }
  .zoom-ctl button:disabled{ opacity:0.38; cursor:default; }
  #zoom-reset{
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.02em; height:22px; color: var(--ink-3);
  }

  /* ============================ Detail rail ============================ */
  .rail{
    border-left:1px solid var(--line);
    background: var(--surface);
    padding: 18px 20px 22px;
    overflow-y: auto;
    min-height: 0;
  }
  .rail-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600; margin-bottom:4px;
  }
  .rail h2{ font-size:1.12rem; letter-spacing:-0.005em; }
  .rail-count{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color: var(--gold); margin-top:5px; }
  .rail-empty{ color: var(--ink-3); font-size:0.86rem; line-height:1.6; margin-top:14px; }

  .ent-list{ display:grid; gap:9px; margin-top:15px; }
  .ent{
    --cat: var(--ink-3);
    background: var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:12px 14px; cursor:pointer; text-align:left;
    font:inherit; color:inherit; width:100%;
    transition: border-color .14s, background .14s;
  }
  .ent:hover{ background: var(--surface-3); }
  .ent:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }
  /* Selected = the power whose bloom you are looking at: a wash of its colour. */
  .ent.sel{ border-color: var(--gold); background: var(--sel-wash); }
  /* Timeline category as a leading mark, so the two views stay siblings. */
  .ent.c-classical{ --cat: var(--cat-classical); }
  .ent.c-islamic{ --cat: var(--cat-islamic); }
  .ent.c-colonial{ --cat: var(--colonial); }
  .ent.c-modern{ --cat: var(--cat-modern); }
  .ent .en{ font-weight:600; font-size:0.88rem; line-height:1.3; }
  .ent .en::before{
    content:''; display:inline-block; width:8px; height:8px; border-radius:50%;
    background: var(--cat); margin-right:8px; vertical-align:1px;
  }
  .ent .ey{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color: var(--ink-2); margin-top:3px; }
  .ent .ed{ font-size:0.82rem; color: var(--ink-2); line-height:1.55; margin-top:7px; display:none; }
  .ent.sel .ed{ display:block; }
  .ent .tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-2);
    border:1px solid var(--line); border-radius:3px; padding:1px 5px; margin-left:6px;
    vertical-align:1px;
  }
  .ent .conf{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color: var(--ink-3);
    margin-top:6px; display:none;
  }
  .ent.sel .conf{ display:block; }

  /* Why here / how power worked / how it ended — the study layer. Each answer
     is keyed by a hanging monospace label so the three read as a set. */
  .ent .lore{ display:none; margin-top:11px; }
  .ent.sel .lore{ display:grid; gap:9px; }
  /* Historical image for the selected entity. Rendered only for the open
     card and set just beneath it, so the credit link lives outside the
     card's own button rather than nesting interactive elements. */
  .ent-fig{ display:block; margin:-3px 0 2px; padding:0 2px; }
  .ent-fig img{ display:block; width:100%; height:auto; max-height:220px;
    object-fit:cover; border:1px solid var(--line); border-radius:3px;
    background: var(--surface-3); }
  .ent-cap{ font-size:0.68rem; color: var(--ink-3); line-height:1.5; margin-top:5px;
    font-family:'IBM Plex Mono', monospace; }
  .ent-cap a{ color: var(--ink-2); text-decoration:underline; text-underline-offset:2px; }
  .ent-cap a:hover{ color: var(--ink-1); }
  .ent-cap .unv{ color: var(--rl-break); }
  .lore .lr{ font-size:0.82rem; color: var(--ink-2); line-height:1.6; }
  .lore .lk{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.13em; text-transform:uppercase; color: var(--ink-3);
    font-weight:600; margin-bottom:2px;
  }

  /* Prologue milestone list */
  .ms-list{ display:grid; gap:7px; margin-top:10px; }
  .ms{ display:grid; gap:1px; }
  .ms-y{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.06em;
    color: var(--gold); font-variant-numeric: tabular-nums;
  }
  .ms-n{ font-size:0.8rem; color: var(--ink-2); line-height:1.45; }
  .conf-inline{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.64rem;
    color: var(--ink-3); margin-top:6px;
  }

  /* Study mode blurs names until revealed (FR-7). */
  .app.study .ent .en, .app.study .ent .ey{ filter: blur(5px); transition: filter .13s; }
  .app.study .ent:hover .en, .app.study .ent:hover .ey,
  .app.study .ent.sel .en, .app.study .ent.sel .ey,
  .app.study .ent.rv .en, .app.study .ent.rv .ey{ filter:none; }
  .app.study .rlabel text{ filter: blur(calc(4px / var(--mz))); transition: filter .13s; }
  .app.study .rlabel.rv text, .app.study .rlabel:hover text{ filter:none; }

  .study-hint{
    font-size:0.76rem; color: var(--ink-2); line-height:1.55;
    margin-top:12px; display:none;
  }
  .app.study .study-hint{ display:block; }

  /* ============================ Scrubber ============================ */
  .scrub{
    background: var(--surface);
    border-top:1px solid var(--line);
    padding: 12px 22px 15px;
  }
  /* The scrubber rises into place as the door clears, so the reader lands
     on the control the last panel just told them to use. Clipped for the
     duration so the rise cannot hand the page a scrollbar. */
  .app.arriving{ overflow:hidden; }
  .app.arriving .scrub{ animation: scrubRise .62s var(--ease-out) both; }
  @keyframes scrubRise{
    from{ transform: translateY(100%); opacity:0 }
    to{ transform:none; opacity:1 }
  }

  /* The rail slides out and the map takes the room. */
  .stage{ position:relative; transition: grid-template-columns .42s var(--ease-out); overflow:hidden; }

  /* The panel's control rides the panel's own edge, so it is where the
     thing it operates is rather than buried in the header. Ink and
     hairline, like every other control on the plate. */
  .rail-tab{
    position:absolute; top:50%; right:336px; z-index:4;
    transform: translateY(-50%);
    width:22px; height:56px; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-2);
    background: var(--panel-bg);
    border:1px solid var(--line); border-right:none;
    border-radius:6px 0 0 6px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: right .42s var(--ease-out), color .14s var(--ease-out), border-color .14s var(--ease-out);
  }
  .rail-tab:hover{ color: var(--ink-1); border-color: var(--ink-3); }
  .rail-tab:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }
  .rail-tab svg{
    width:8px; height:14px; fill:none; stroke:currentColor;
    stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
    transform: rotate(180deg);
    transition: transform .42s var(--ease-out);
  }
  .app.rail-off .rail-tab{ right:0; }
  .app.rail-off .rail-tab svg{ transform:none; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .rail{ transition: transform .42s var(--ease-out), opacity .26s var(--ease-out); }
  .app.rail-off .stage{ grid-template-columns: minmax(0,1fr) 0px; }
  .app.rail-off .rail{ transform: translateX(100%); opacity:0; }
  .scrub-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:16px; margin-bottom:7px; flex-wrap:wrap;
  }
  .scrub-title{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600;
  }
  .scrub-hint{ font-size:0.72rem; color: var(--ink-3); }
  .scrub-head-l{ display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; min-width:0; }

  .track{ position: relative; height: 62px; }

  /* density histogram + engraved ruler live in one SVG behind the input */
  svg.ruler{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  input[type=range].era{
    -webkit-appearance:none; appearance:none;
    position:absolute; left:0; right:0; top:20px;
    width:100%; height:26px; margin:0; background:transparent; cursor:pointer;
  }
  input[type=range].era::-webkit-slider-runnable-track{ height:26px; background:transparent; }
  input[type=range].era::-moz-range-track{ height:26px; background:transparent; }
  input[type=range].era::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:15px; height:15px; border-radius:50%;
    background: var(--gold-warm); border:none; margin-top:5.5px;
    box-shadow: 0 0 0 4px var(--gold-glow-a), 0 0 14px 4px var(--gold-glow-b);
  }
  input[type=range].era::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%;
    background: var(--gold-warm); border:none;
    box-shadow: 0 0 0 4px var(--gold-glow-a), 0 0 14px 4px var(--gold-glow-b);
  }
  input[type=range].era:focus{ outline:none; }
  input[type=range].era:focus-visible::-webkit-slider-thumb{
    box-shadow: 0 0 0 3px var(--ground), 0 0 0 5px var(--ui-ring);
  }
  input[type=range].era:focus-visible::-moz-range-thumb{
    box-shadow: 0 0 0 3px var(--ground), 0 0 0 5px var(--ui-ring);
  }

  /* Era ticks are dots, not labels: 15 eras will not fit as text on a phone,
     and the badge above already names the current one. Each dot is a jump. */
  .era-names{ position:relative; height:28px; margin-top:3px; }
  /* The hit area is wider than the dot: 24px so a thumb can land on it. */
  .era-dot{
    position:absolute; top:-3px; transform: translateX(-50%);
    width:24px; height:20px; padding:0; border:none; background:transparent; cursor:pointer;
  }
  .era-dot::after{
    content:''; display:block; width:5px; height:5px; border-radius:50%;
    background: var(--ink-3); margin:7px auto 0; transition: background .14s var(--ease-out), transform .14s var(--ease-out);
  }
  .era-dot:hover::after{ background: var(--ink-2); }
  .era-dot.on::after{ background: var(--gold); transform: scale(1.55); }
  .era-dot:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:1px; border-radius:4px; }
  .era-cur{
    position:absolute; top:15px; transform: translateX(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; letter-spacing:0.08em;
    color: var(--gold); white-space:nowrap; pointer-events:none;
  }


  /* ============================ Chapters ============================
     Six sub-themes under the plate. This is a table of contents for the
     scrubber, not a second telling: every milestone row is a jump that
     drives the map above. Ink and hairlines throughout — the only colour
     is the leading category dot, which is already a legend entry, so no
     new hue enters the system (DESIGN.md §2, "every hue is a legend entry").

     It lives OUTSIDE .app deliberately. The plate keeps its 100vh frame
     and the reader scrolls past it to reach the chapters, so nothing here
     can squeeze the map or change its slice-fit. */
  .chapters{
    background: var(--ground);
    border-top:1px solid var(--line);
    padding: 34px 22px 56px;
  }
  .chapters-in{ max-width: 1080px; margin:0 auto; }

  .chapters-head{ margin-bottom: 26px; }
  .chapters-kicker{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600;
  }
  .chapters-head h2{ font-size:1.12rem; line-height:1.25; margin-top:7px; }
  .chapters-lede{
    font-size:0.82rem; line-height:1.6; color: var(--ink-2);
    margin-top:8px; max-width:62ch;
  }

  .chap-list{ display:grid; gap:0; margin-top:20px; }

  /* No card grid, no nesting: chapters are plate sections separated by
     hairlines, the same way the rail separates its blocks. */
  .chap{
    border-top:1px solid var(--line);
    padding: 22px 0 24px;
    display:grid;
    grid-template-columns: 232px minmax(0,1fr);
    gap: 26px;
  }
  .chap:last-child{ border-bottom:1px solid var(--line); }

  .chap-id{ position:relative; }
  @media (min-width: 761px){
    .chap-id{ position:sticky; top:18px; align-self:start; }
  }
  .chap-no{
    font-family:'IBM Plex Mono', monospace; font-size:0.63rem; letter-spacing:0.14em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600;
    display:flex; align-items:center; gap:7px;
  }
  /* Category dot, exactly as the entity card does it. */
  .chap-no::before{
    content:''; width:8px; height:8px; border-radius:50%;
    background: var(--cat); flex:none;
  }
  .chap.c-prolog{ --cat: var(--mig); }
  .chap.c-classical{ --cat: var(--cat-classical); }
  .chap.c-islamic{ --cat: var(--cat-islamic); }
  .chap.c-colonial{ --cat: var(--colonial); }
  .chap.c-modern{ --cat: var(--cat-modern); }

  .chap-title{ font-size:1.12rem; line-height:1.25; margin-top:9px; }
  .chap-range{
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem;
    color: var(--ink-2); margin-top:5px;
  }
  .chap-open{
    margin-top:12px; padding:6px 12px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    letter-spacing:0.13em; text-transform:uppercase; font-weight:600;
    color: var(--ink-2); background: var(--surface-2);
    border:1px solid var(--line); border-radius:999px;
    transition: color .14s var(--ease-out), border-color .14s var(--ease-out);
  }
  .chap-open:hover{ color: var(--ink-1); border-color: var(--ink-3); }
  .chap-open:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:2px; }

  .chap-body p{
    font-size:0.82rem; line-height:1.6; color: var(--ink-2);
    margin:0 0 11px; max-width:68ch;
  }
  .chap-body p strong{ color: var(--ink-1); font-weight:600; }

  .chap-sub{
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem; letter-spacing:0.13em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600;
    margin:18px 0 9px;
  }

  .ms-list{ display:grid; gap:1px; background: var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .ms{
    display:grid; grid-template-columns: 92px minmax(0,1fr); gap:14px;
    align-items:baseline; width:100%; text-align:left;
    padding:11px 13px; cursor:pointer;
    background: var(--surface); border:none;
    transition: background .14s var(--ease-out);
  }
  .ms:hover{ background: var(--surface-3); }
  .ms:focus-visible{ outline:2px solid var(--ui-ring); outline-offset:-2px; }
  .ms-y{
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem;
    color: var(--gold); font-variant-numeric: tabular-nums;
  }
  .ms-t{ font-size:0.82rem; line-height:1.5; color: var(--ink-1); }
  .ms-d{ font-size:0.78rem; line-height:1.55; color: var(--ink-2); margin-top:3px; }
  .ms-t .ms-d{ font-weight:400; }

  /* The chapter's own honest note. Same treatment as the rail's overlay
     block — a hairline in the accent line and a gold wash — because it is
     the same kind of statement: this is what the record will and will not
     support. Never a warning colour; doubt is not an error. */
  .chap-note{
    margin-top:15px; padding:11px 13px;
    border:1px solid var(--accent-line); border-radius:8px;
    background: var(--sel-wash);
  }
  .chap-note .k{
    font-family:'IBM Plex Mono', monospace; font-size:0.58rem; letter-spacing:0.13em;
    text-transform:uppercase; color: var(--ink-3); font-weight:600; display:block; margin-bottom:5px;
  }
  .chap-note p{ margin:0; font-size:0.78rem; line-height:1.55; color: var(--ink-2); }

  /* Chapters overlap on purpose — Islam arrives while Majapahit still
     stands, the Portuguese are here through the sultanates' peak. Saying
     so is the point, so the overlap gets its own line rather than being
     smoothed away by tidy consecutive ranges. */
  .chap-overlap{
    margin-top:11px; font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem; line-height:1.5; letter-spacing:0.03em; color: var(--ink-3);
  }

  @media (max-width: 760px){
    .chapters{ padding: 26px 16px 44px; }
    .chap{ grid-template-columns: minmax(0,1fr); gap:14px; padding:18px 0 20px; }
    .ms{ grid-template-columns: 76px minmax(0,1fr); gap:10px; }
  }
  @media (prefers-reduced-motion: reduce){
    .chap-open, .ms{ transition:none; }
  }


  /* ===================== Scrubber, stretched =====================
     The same instrument with more vertical room — not a second timeline
     and not a chart beside it. Collapsed, the track is the engraved ruler
     it has always been. Stretched, the entities fan out into the four
     lanes they already carry in DATA (`lane`), on the SAME x-axis, under
     the SAME gold thumb, so what the scrubber was already sliding across
     becomes visible: Pasai running alongside Majapahit, the Portuguese
     starting mid-sultanate.

     Bars are HTML, not SVG, for two reasons: the ruler beneath them is
     stretched with preserveAspectRatio="none", which would distort any
     type drawn into it, and PRODUCT.md requires the text stay selectable
     and translatable.

     A bar's ends are feathered by its confidence tier, using a CSS mask
     rather than a border. A hard end is a claim that a date is known;
     most of these are not. VOC 1799 gets an edge; Majapahit 1527 does
     not (DESIGN.md, "edges match the evidence"). */
  .lanes{
    position:absolute; left:0; right:0; top:0; bottom:62px;
    overflow-y:auto; overflow-x:hidden;
    opacity:0; pointer-events:none;
    transition: opacity .2s var(--ease-out);
  }
  .track.wide .lanes{ opacity:1; pointer-events:auto; }
  .track{ transition: height .34s var(--ease-out); }

  /* Each lane opens with a hairline carrying its name, so the four
     lanes read as sections of one plate rather than as four charts. */
  .lane-head{
    position:relative; height:11px; margin-top:4px;
    border-top:1px solid var(--line);
  }
  .lane-head:first-child{ margin-top:0; }
  .lane-head span{
    position:absolute; left:0; top:2px;
    font-family:'IBM Plex Mono', monospace; font-size:0.55rem; letter-spacing:0.12em;
    text-transform:uppercase; color: var(--ink-3);
    background: var(--surface); padding-right:7px;
  }

  .lane-row{ position:relative; height:16px; }

  .bar{
    position:absolute; top:1px; height:13px;
    display:flex; align-items:center;
    padding:0 6px; min-width:3px;
    box-sizing:border-box; cursor:pointer;
    background: var(--wash);
    border:1px solid var(--cat);
    border-radius:2px;
    color: var(--ink-1);
    font-family:'IBM Plex Mono', monospace; font-size:0.55rem; letter-spacing:0.04em;
    white-space:nowrap; overflow:hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 var(--f), #000 calc(100% - var(--f)), transparent 100%);
    transition: background .14s var(--ease-out);
  }
  /* Confidence is the feather width. Low confidence has no edge to speak of. */
  .bar.t-high{   --f: 2px; }
  .bar.t-medium{ --f: 9px; }
  .bar.t-low{    --f: 18px; }

  .bar.c-classical{ --cat: var(--cat-classical); --wash: color-mix(in oklch, var(--cat-classical) 16%, transparent); }
  .bar.c-islamic{   --cat: var(--cat-islamic);   --wash: color-mix(in oklch, var(--cat-islamic) 16%, transparent); }
  .bar.c-colonial{  --cat: var(--colonial);      --wash: color-mix(in oklch, var(--colonial) 16%, transparent); }
  .bar.c-modern{    --cat: var(--cat-modern);    --wash: color-mix(in oklch, var(--cat-modern) 16%, transparent); }

  .bar:hover{ background: color-mix(in oklch, var(--cat) 30%, transparent); }
  /* The mask clips an outline, so selection and focus are carried by the
     fill and a thicker hairline instead of a ring outside the box. */
  .bar:focus-visible{ background: color-mix(in oklch, var(--cat) 34%, transparent); border-width:2px; }
  .bar.sel{ background: var(--sel-wash); border-color: var(--gold); border-width:2px; }
  /* Bars narrower than their own label drop it rather than clipping a name
     to two letters. Hidden by visibility, not display, so the label keeps a
     measurable scrollWidth and the test cannot oscillate between paints. */
  .bar.narrow{ padding:0; }
  .bar.narrow span{ visibility:hidden; }

  /* The time cursor runs the full stretched height, so the thumb below
     and the bars above are demonstrably the same instrument. */
  .lane-thr{
    position:absolute; top:0; bottom:0; width:1px;
    background: var(--gold); opacity:.55;
    pointer-events:none; transform: translateX(-0.5px);
  }

  @media (prefers-reduced-motion: reduce){
    .track, .lanes{ transition:none; }
  }

  /* ============================ Map primitives ============================ */
  .land{ fill: var(--land); stroke: var(--land-edge); stroke-width:0.7; stroke-linejoin:round; vector-effect: non-scaling-stroke; }
  .graticule{ stroke: var(--grat); stroke-width:0.5; fill:none; vector-effect: non-scaling-stroke; }

  .region-hit{ fill: transparent; cursor:pointer; outline:none; }
  .region-hit:hover + .region-glow, .region-hit:focus-visible + .region-glow{ opacity:1; }
  .region-glow{
    fill: var(--glow-fill); stroke: var(--glow-stroke);
    stroke-width:0.8; stroke-dasharray:4 4; opacity:0; pointer-events:none; vector-effect: non-scaling-stroke;
    transition: opacity .16s;
  }
  .region-glow.sel{ opacity:1; fill: var(--glow-fill-sel); stroke: var(--glow-stroke-sel); stroke-dasharray:none; }
  .region-hit:focus-visible + .region-glow{ stroke: var(--ui-ring); stroke-width:1.4; stroke-dasharray:none; }

  .rlabel text{
    font-family:'IBM Plex Mono', monospace; font-size: calc(8.5px / var(--mz)); letter-spacing:0.11em;
    text-transform: uppercase; fill: var(--ink-3); text-anchor:middle;
    pointer-events:none; transition: fill .16s;
  }
  .rlabel.sel text, .rlabel.hot text{ fill: var(--ink-2); }

  /* screen on dark (adds light), multiply on paper (adds pigment) */
  .influence{ mix-blend-mode: var(--blend); pointer-events:none; }
  .bloom{ transition: opacity .3s var(--ease-out); }

  .hard{ pointer-events:none; }
  .hard .hp{

  .ov{ pointer-events:none; }

/* Phase 0 gate: every entity must carry at least one node. */
(function integrityCheck(){
  var missing = [];
  DATA.forEach(function(e){
    var m = MAPX[e.name.id];
    if (!m || !m.nodes || !m.nodes.length) missing.push(e.name.id);
  });
  if (missing.length) console.warn('Peta Nusantara — entities without map nodes:', missing);
  var idN = 0, enN = 0;
  DATA.forEach(function(e){ if(e.name.id) idN++; if(e.name.en) enN++; });
  if (idN !== enN) console.warn('Peta Nusantara — bilingual string count mismatch', idN, enN);
})();

DATA.forEach(function(e){
  var m = MAPX[e.name.id] || { reach:1.5, routes:[], nodes:[] };
  e.nodes = m.nodes; e.reach = m.reach; e.routes = m.routes || [];
  e.wide = !!m.wide; e.hardEdge = !!m.hard;
});

/* ==================================================================
   LORE — the study layer. Three questions per polity, in the order a
   learner actually needs them:

     why   — why HERE? the geographic logic. This is the map's thesis:
             most of these powers are explained by position.
     power — how power was actually exercised. Rarely territory; usually
             chokepoints, tribute, rice surplus, or monopoly.
     end   — how it ended, because that is what the timeline shows and
             the map cannot.

   Kept separate from DATA for the same reason MAPX is: the timeline owns
   the entity records, this file only annotates them.
   ================================================================== */
function L(wId, wEn, pId, pEn, eId, eEn){
  return { why:{id:wId, en:wEn}, power:{id:pId, en:pEn}, end:{id:eId, en:eEn} };
}

/* ==================================================================
   STATE
   ================================================================== */
var S = {
  lang: 'id',
  theme: '',           /* '' = follow the viewer; 'light' | 'dark' = explicit choice */
  year: 1365,          /* opens on the Majapahit peak — a full first frame */
  region: null,
  entity: null,
  study: false,
  routes: true,
  revealed: {}
};

var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

function T(key){ return CHROME[key][S.lang]; }
function nameOf(e){ return e.name[S.lang]; }
function endLabel(e){ return e.end === NOW ? T('present') : e.end; }
function activeAt(e, y){ return y >= e.start && y <= e.end; }

function pointInPoly(lon, lat, poly){
  var inside = false;
  for (var i=0, j=poly.length-1; i<poly.length; j=i++){
    var xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if (((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}

function entitiesInRegion(region, year){
  var out = [];
  DATA.forEach(function(e, i){
    if (!activeAt(e, year)) return;
    var hit = e.wide || e.nodes.some(function(n){ return pointInPoly(n.lon, n.lat, region.poly); });
    if (hit) out.push(i);
  });
  return out;
}

/* Does this region ever hold a non-archipelago-wide entity? Drives the Q3
   treatment: a region blank at every year is a statement, not a bug. */
var REGION_EVER = {};
REGIONS.forEach(function(r){
  REGION_EVER[r.id] = DATA.some(function(e){
    return !e.wide && e.nodes.some(function(n){ return pointInPoly(n.lon, n.lat, r.poly); });
  });
});

/* ==================================================================
   MAP CONSTRUCTION — built once, then mutated by attribute only (NFR-3)
   ================================================================== */
var svg = document.getElementById('map');
var SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
/* meet, not slice: the archipelago is never cropped out of reach. The bands
   this leaves fall on the ocean gradient, so the plate simply continues. */
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

/* --- gradient defs: one per confidence tier. Lower confidence diffuses
       wider and softer, so uncertainty is legible at a glance (rule 3). --- */
var defs = el('defs');
var TIERS = {
  high:   [[0,0.62],[0.28,0.34],[0.60,0.11],[1,0]],
  medium: [[0,0.44],[0.24,0.26],[0.62,0.09],[1,0]],
  low:    [[0,0.30],[0.20,0.20],[0.66,0.08],[1,0]]
};
var TIER_SCALE = { high:1.0, medium:1.16, low:1.34 };
for (var tk in TIERS){
  var g = el('radialGradient', { id:'bloom-'+tk });
  /* Colour and opacity come from CSS (per theme); JS only sets the offsets. */
  TIERS[tk].forEach(function(st, si){
    g.appendChild(el('stop', { offset:(st[0]*100)+'%', class:'s' + si }));
  });
  defs.appendChild(g);
}

/* Hatch for 1965-66. Deliberately flat and graphic — a bloom would render
   mass killing in the same visual language as royal prestige. */
var hatch = el('pattern', { id:'hatch', width:6, height:6, patternUnits:'userSpaceOnUse', patternTransform:'rotate(45)' });
hatch.appendChild(el('rect', { width:6, height:6, style:'fill:var(--violence)', 'fill-opacity':0.10 }));
hatch.appendChild(el('line', { x1:0, y1:0, x2:0, y2:6, style:'stroke:var(--violence)', 'stroke-width':1.6, 'stroke-opacity':0.55 }));
defs.appendChild(hatch);

svg.appendChild(defs);

/* --- graticule: nautical-chart register, 5° --- */
var gGrat = el('g', { class:'graticule' });
for (var lon=95; lon<=140; lon+=5) gGrat.appendChild(el('line', { x1:px(lon), y1:0, x2:px(lon), y2:H }));
for (var lat=5; lat>=-10; lat-=5) gGrat.appendChild(el('line', { x1:0, y1:py(lat), x2:W, y2:py(lat) }));
svg.appendChild(gGrat);

/* --- landmass --- */
function ringPoints(str){
  return str.split(' ').map(function(pair){
    var c = pair.split(',');
    return px(+c[0]).toFixed(1) + ',' + py(+c[1]).toFixed(1);
  }).join(' ');
}
var LAND_PTS = LAND.map(ringPoints);
var gLand = el('g');
LAND_PTS.forEach(function(p){ gLand.appendChild(el('polygon', { class:'land', points:p })); });
svg.appendChild(gLand);

/* --- colonial hard edges (PRD 08 rule 4). The contrast between fuzzy
       pre-colonial bloom and surveyed colonial line IS the lesson. --- */
var gHard = el('g', { class:'hard' });
var hardNodes = {};
DATA.forEach(function(e, i){
  if (!e.hardEdge) return;
  var grp = el('g', { opacity:0 });
  LAND.forEach(function(ring, ri){
    /* include a landmass if any of its vertices fall within reach of a node */
    var pts = ring.split(' ');
    var within = false;
    for (var q=0; q<pts.length && !within; q+=2){
      var c = pts[q].split(',');
      var lo = +c[0], la = +c[1];
      within = e.nodes.some(function(n){
        var dx = lo - n.lon, dy = la - n.lat;
        return Math.sqrt(dx*dx + dy*dy) <= e.reach;
      });
    }
    if (within) grp.appendChild(el('polygon', { class:'hp', points:LAND_PTS[ri] }));
  });
  gHard.appendChild(grp);
  hardNodes[i] = grp;
});
svg.appendChild(gHard);

/* --- sea lanes --- */
var gRoutes = el('g');
var routeNodes = {};
ROUTES.forEach(function(r){
  var d = r.pts.map(function(p,i){ return (i?'L':'M') + px(p[0]).toFixed(1) + ' ' + py(p[1]).toFixed(1); }).join(' ');
  var path = el('path', { class:'route', d:d });
  var tx = el('text', { class:'route-label', x:px(r.lab[0]).toFixed(1), y:py(r.lab[1]).toFixed(1),
    transform:'rotate(' + r.rot + ' ' + px(r.lab[0]).toFixed(1) + ' ' + py(r.lab[1]).toFixed(1) + ')' });
  gRoutes.appendChild(path); gRoutes.appendChild(tx);
  routeNodes[r.id] = { path:path, text:tx, def:r };
});
svg.appendChild(gRoutes);

/* --- influence bloom, screen-blended so overlaps add like light --- */
var gInf = el('g', { class:'influence' });
var bloomNodes = {};
DATA.forEach(function(e, i){
  if (e.hardEdge && e.wide) return;      /* archipelago-wide powers use the hard edge instead */
  var grp = el('g', { class:'bloom', opacity:0 });
  e.nodes.forEach(function(n){
    var mult = n.kind === 'capital' ? 1 : (n.kind === 'port' ? 0.72 : 0.55);
    var r = e.reach * TIER_SCALE[e.conf] * mult * VIEW.k;
    grp.appendChild(el('circle', {
      cx:px(n.lon).toFixed(1), cy:py(n.lat).toFixed(1), r:r.toFixed(1),
      fill:'url(#bloom-' + e.conf + ')'
    }));
  });
  gInf.appendChild(grp);
  bloomNodes[i] = grp;
});
svg.appendChild(gInf);

/* --- which region does each landmass belong to? Used so the election and
       1965-66 layers tint actual land rather than the region rectangles,
       which would flood the sea with colour. --- */
var RING_REGION = LAND.map(function(ring){
  var pts = ring.split(' '), sx = 0, sy = 0, n = 0;
  for (var i=0;i<pts.length;i++){
    var c = pts[i].split(',');
    sx += +c[0]; sy += +c[1]; n++;
  }
  var clon = sx/n, clat = sy/n, hit = null;
  for (var r=0;r<REGIONS.length;r++){
    if (pointInPoly(clon, clat, REGIONS[r].poly)){ hit = REGIONS[r].id; break; }
  }
  return hit;
});

var gMarks = el('g', { class:'ov' });

defs.appendChild(arrow);

var gMig = el('g', { class:'mig' });
MIGRATION.forEach(function(line){

gMig.appendChild(migText);
gMig.style.display = 'none';
svg.appendChild(gMig);

function activeOverlay(y){
  if (y >= 1945 && y <= 1949){
    var ph = null;
    for (var i=0;i<REV_PHASES.length;i++){
      if (y >= REV_PHASES[i].from && y <= REV_PHASES[i].to){ ph = REV_PHASES[i]; break; }
    }
    return { id:'revolusi', phase:ph };
  }
  if (y >= 1955 && y <= 1958) return { id:'pemilu55' };
  if (y >= 1965 && y <= 1966) return { id:'killings' };
  return null;
}

function poly2pts(poly){
  return poly.map(function(p){ return px(p[0]).toFixed(1) + ',' + py(p[1]).toFixed(1); }).join(' ');
}

var ovSig = null;
function buildOverlay(ov){
  var sig = ov ? (ov.id + ':' + (ov.phase ? ov.phase.from : '') + ':' + S.lang) : 'none';
  if (sig === ovSig) return;
  ovSig = sig;
  while (gOv.firstChild) gOv.removeChild(gOv.firstChild);
  if (!ov) return;

  if (ov.id === 'revolusi' && ov.phase){
    var ph = ov.phase;

    /* Dutch claim first, so republican zones read as sitting inside it. */
    if (ph.dutchAll){
      LAND_PTS.forEach(function(p){
        gOv.appendChild(el('polygon', { class:'ov-zone z-belanda', points:p }));
      });
    }
    (ph.zones || []).forEach(function(z){
      gOv.appendChild(el('polygon', {
        class:'ov-zone z-' + z.fac + (z.soft ? ' soft' : ''), points:poly2pts(z.poly)
      }));
    });
    (ph.dutchDots || []).forEach(function(d){
      gOv.appendChild(el('circle', {
        cx:px(d[0]).toFixed(1), cy:py(d[1]).toFixed(1), r:4.5,
        class:'dutch-dot'
      }));
    });
    (ph.vanmook || []).forEach(function(poly){
      gOv.appendChild(el('polygon', { class:'vanmook', points:poly2pts(poly) }));
      var t = el('text', { class:'vanmook-label',
        x:px(110.6).toFixed(1), y:py(-8.7).toFixed(1), 'text-anchor':'middle' });
      t.textContent = S.lang === 'id' ? 'GARIS VAN MOOK · RENVILLE 1948' : 'VAN MOOK LINE · RENVILLE 1948';
      gOv.appendChild(t);
    });
  }

  if (ov.id === 'pemilu55'){
    LAND.forEach(function(ring, ri){
      var reg = RING_REGION[ri];
      var e = reg && PEMILU55[reg];
      if (!e) return;
      gOv.appendChild(el('polygon', { class:'ov-zone z-' + e.fac, points:LAND_PTS[ri] }));
    });

  if (ov.id === 'killings'){
    var kset = {};
    KILL_ZONES.forEach(function(k){ kset[k.region] = k; });

    KILL_ZONES.forEach(function(k){

      if (!reg) return;
      var t = el('text', { class:'kill-label',
        x:px(reg.lab[0]).toFixed(1), y:py(reg.lab[1]).toFixed(1) });
      t.textContent = k.note[S.lang];
      gOv.appendChild(t);
    });
  }
}

var markSig = null;
function buildMarks(y){
  var act = [];

  var sig = act.join(',') + ':' + S.lang;

  markSig = sig;

      cx:px(m.lon).toFixed(1), cy:py(m.lat).toFixed(1), r:5.5, style:'--r:5.5;stroke:' + (COL[m.fac] || 'var(--gold)')
    }));
    g.appendChild(el('circle', {
      cx:px(m.lon).toFixed(1), cy:py(m.lat).toFixed(1), r:1.8,
      style:'--r:1.8;fill:' + (COL[m.fac] || 'var(--gold)'), stroke:'none'
    }));

    g.appendChild(t);
    gMarks.appendChild(g);

}

/* --- region hit + highlight layer. Hit areas are their own layer so
       Ternate and Tidore stay tappable at true scale (NFR-5). --- */
var gRegions = el('g');
var regionNodes = {};
REGIONS.forEach(function(r, ri){

/* --- entity capital/port nodes --- */

DATA.forEach(function(e, i){

    var r = n.kind === 'capital' ? 2.6 : 1.9;

/* ==================================================================
   SCRUBBER — engraved ruler + density track
   ================================================================== */
var ruler = document.getElementById('ruler');
var range = document.getElementById('era-range');
var eraNames = document.getElementById('era-names');
var RW = 1000, RH = 62;                 /* ruler is drawn in its own units and stretched */
ruler.setAttribute('viewBox', '0 0 ' + RW + ' ' + RH);
function rx(pos){ return (pos / PMAX) * RW; }

(function buildRuler(){
  /* density: how many entities are active at each sample. Sparse centuries
     then read as "little recorded here" rather than broken UI (FR-8c). */
  var SAMPLES = 200, counts = [], max = 0;
  for (var i=0;i<SAMPLES;i++){
    var y = yearFromPos((i + 0.5) / SAMPLES * PMAX);
    var c = 0;
    DATA.forEach(function(e){ if (activeAt(e, y)) c++; });
    counts.push(c); if (c > max) max = c;
  }
  var gd = el('g');
  var bw = RW / SAMPLES;
  counts.forEach(function(c, i){
    var h = max ? (c / max) * 20 : 0;
    gd.appendChild(el('rect', {
      x:(i*bw).toFixed(2), y:(20 - h).toFixed(2), width:(bw + 0.35).toFixed(2), height:h.toFixed(2),
      class:'dens'
    }));
  });
  ruler.appendChild(gd);

  /* engraved ruler: dense hairline minors, sparse taller majors */
  var gt = el('g');
  gt.appendChild(el('line', { x1:0, y1:33, x2:RW, y2:33, class:'rl-base' }));
  SEGMENTS.forEach(function(s){
    var minor = s.step / 2;
    for (var y = s.yStart; y <= s.yEnd; y += minor){
      var isMajor = (y % s.step === 0);
      var X = rx(posFromYear(y));
      gt.appendChild(el('line', {
        x1:X.toFixed(2), y1:33, x2:X.toFixed(2), y2:(isMajor ? 41 : 37).toFixed(2),
        class: isMajor ? 'rl-major' : 'rl-minor'
      }));
    }
  });
  ruler.appendChild(gt);

  /* scale-break marks: the scale changes, so the UI says so (FR-8a) */
  var gb = el('g');
  [SEGMENTS[1].pStart, SEGMENTS[2].pStart].forEach(function(p){
    var X = rx(p);
    gb.appendChild(el('line', { x1:X.toFixed(2), y1:8, x2:X.toFixed(2), y2:47,
      class:'rl-break' }));
  });
  ruler.appendChild(gb);

  /* throughline + handle bloom, so the current position is findable
     without hunting for the disc */
  var gh = el('g');
  var thr = el('line', { id:'thr', x1:0, y1:4, x2:0, y2:52 });
  gh.appendChild(thr);
  ruler.appendChild(gh);
  ruler._thr = thr;

  /* Year labels under the majors, one per segment boundary + a few anchors.
     Drawn as HTML positioned by percent (like the era dots) so the stretched
     ruler never distorts their glyphs. */
  var labs = document.getElementById('rl-labs');
  [300, 1000, 1500, 1800, 1945, NOW].forEach(function(y){
    var pct = (posFromYear(y) / PMAX) * 100;
    var s = document.createElement('span');
    s.dataset.a = y === 300 ? 'start' : (y === NOW ? 'end' : 'middle');
    s.style.left = pct.toFixed(3) + '%';
    s.textContent = y === NOW ? String(NOW) : String(y);
    labs.appendChild(s);
  });
})();


/* ==================================================================
   THE STRETCHED SCRUBBER

   One instrument, two heights. Collapsed it is the engraved ruler.
   Stretched, the entities fan into the four lanes DATA already carries,
   sharing the ruler's x-mapping (posFromYear) exactly, so a bar's left
   edge sits over the same pixel the thumb stops at for that year.

   Within a lane, bars are packed greedily into as few rows as the
   overlaps allow. The packing is the whole point of the feature: two
   bars land on separate rows precisely when they were running at the
   same time, which is the fact the collapsed ruler cannot show.
   ================================================================== */
var track = document.querySelector('.track');
var lanesEl = document.createElement('div');
lanesEl.className = 'lanes';
track.insertBefore(lanesEl, track.firstChild);

var LANES = [
  { id:'sumatra',  label:{ id:'Sumatra',            en:'Sumatra' } },
  { id:'java',     label:{ id:'Jawa',               en:'Java' } },
  { id:'timur',    label:{ id:'Kalimantan & Timur', en:'Kalimantan & East' } },
  { id:'nasional', label:{ id:'Nasional',           en:'Archipelago-wide' } }
];

var ROW_H = 16, HEAD_H = 15, RULER_H = 62;
var laneThr = null;

/* Greedy interval packing: first row whose last bar ends before this one
   starts. The cushion is in percent of the whole axis, and small (0.6%,
   about eight years at the classical scale): it only has to stop two
   abutting reigns from touching and reading as one bar. Anything larger
   pushes non-overlapping entities onto separate rows and inflates the
   stretch for no reason. */
function packLane(items){
  var rows = [];
  items.forEach(function(it){
    for (var i = 0; i < rows.length; i++){
      if (rows[i][rows[i].length - 1].p1 <= it.p0 - 0.6){ rows[i].push(it); return; }
    }
    rows.push([it]);
  });
  return rows;
}

function buildLanes(){
  var L = S.lang;
  lanesEl.innerHTML = '';
  var rowCount = 0;

  LANES.forEach(function(lane){
    var items = [];
    DATA.forEach(function(e, i){
      if (e.lane !== lane.id) return;
      var end = Math.min(e.end, NOW);
      items.push({
        i:i, e:e,
        p0:(posFromYear(e.start) / PMAX) * 100,
        p1:(posFromYear(end) / PMAX) * 100
      });
    });
    if (!items.length) return;
    items.sort(function(a, b){ return a.p0 - b.p0; });

    var head = document.createElement('div');
    head.className = 'lane-head';
    var hs = document.createElement('span');
    hs.textContent = lane.label[L];
    head.appendChild(hs);
    lanesEl.appendChild(head);

    packLane(items).forEach(function(row){
      var rEl = document.createElement('div');
      rEl.className = 'lane-row';
      row.forEach(function(it){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'bar c-' + it.e.cat + ' t-' + it.e.conf;
        b.style.left = it.p0.toFixed(3) + '%';
        b.style.width = Math.max(0.25, it.p1 - it.p0).toFixed(3) + '%';
        b.dataset.i = it.i;
        var s = document.createElement('span');
        s.textContent = it.e.name[L];
        b.appendChild(s);
        b.title = it.e.name[L] + ' · ' + it.e.start + '–' + endLabel(it.e) +
                  ' · ' + CHROME.confLabel[it.e.conf][L];
        b.setAttribute('aria-label', b.title);
        b.addEventListener('click', function(){ openFromLane(it.i, it.e); });
        rEl.appendChild(b);
      });
      lanesEl.appendChild(rEl);
      rowCount++;
    });
  });

  laneThr = document.createElement('div');
  laneThr.className = 'lane-thr';
  lanesEl.appendChild(laneThr);

  lanesEl._h = rowCount * ROW_H + LANES.length * HEAD_H + 6;
  applyLanes();
  paintLanes();
}

/* A bar click is the same gesture as a milestone row or a map click:
   go to a year this entity was actually active, select its region, open
   it. Clamped into the entity's own span so the rail can never open a
   card for a year the map does not draw. */
function openFromLane(i, e){
  var y = Math.max(e.start, Math.min(S.year, Math.min(e.end, NOW)));
  if (y !== S.year) setYear(y);
  var reg = regionForEntity(e.name.id);
  if (reg){
    selectRegion(reg);
    var r = REGIONS.filter(function(x){ return x.id === reg; })[0];
    if (r && entitiesInRegion(r, S.year).indexOf(i) >= 0){
      S.entity = i;
      S.revealed[i] = true;
      LS.set('nusantara-map-revealed', JSON.stringify(S.revealed));
    }
  }
  if (!S.rail){ S.rail = true; applyRail(); LS.set('nusantara-map-rail', '1'); }
  render();
}

/* Height is measured from the packing, then capped against the viewport:
   the plate is bounded at 100vh on desktop, so an unbounded stretch would
   eat the map it is supposed to explain. Past the cap the lanes scroll
   inside themselves, exactly as the rail does. */
function laneCap(){ return Math.max(120, Math.round(window.innerHeight * 0.34)); }

function applyLanes(){
  track.classList.toggle('wide', S.lanes);
  var h = S.lanes ? RULER_H + Math.min(lanesEl._h || 0, laneCap()) : RULER_H;
  track.style.height = h + 'px';
  if (laneBtn){
    laneBtn.classList.toggle('on', S.lanes);
    laneBtn.setAttribute('aria-pressed', S.lanes ? 'true' : 'false');
  }
}

/* Cursor and selection follow the map, so the stretched view is never a
   second source of truth about where we are. */
function paintLanes(){
  if (laneThr) laneThr.style.left = ((posFromYear(S.year) / PMAX) * 100).toFixed(3) + '%';
  Array.prototype.forEach.call(lanesEl.querySelectorAll('.bar'), function(b){
    b.classList.toggle('sel', S.entity === +b.dataset.i);
    /* A label wider than its own bar is dropped rather than clipped. */
    b.classList.toggle('narrow', b.offsetWidth < b.firstChild.scrollWidth + 14);
  });
}

window.addEventListener('resize', function(){ if (S.lanes) applyLanes(); });

var laneBtn = document.getElementById('lane-btn');
if (laneBtn){
  laneBtn.addEventListener('click', function(){
    S.lanes = !S.lanes;
    LS.set('nusantara-map-lanes', S.lanes ? '1' : '0');
    applyLanes();
    if (S.lanes) paintLanes();
  });
}

/* Era ticks: clickable dots, with only the active era named beneath. */
var eraCur = document.createElement('div');
eraCur.className = 'era-cur';
ERAS.forEach(function(era, i){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'era-dot';
  b.style.left = ((posFromYear(era.y) / PMAX) * 100).toFixed(3) + '%';
  b.dataset.i = i;
  b.addEventListener('click', function(){ setYear(ERAS[i].y); });
  eraNames.appendChild(b);
});
eraNames.appendChild(eraCur);

function currentEra(){
  var found = ERAS[0];
  for (var i=0;i<ERAS.length;i++) if (S.year >= ERAS[i].y) found = ERAS[i];
  return found;
}
function nearestEraIndex(year){
  var best = 0, bd = Infinity;
  ERAS.forEach(function(e, i){
    var d = Math.abs(posFromYear(e.y) - posFromYear(year));
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}

/* Free scrub while dragging; the handle settles on an era on release. */
range.addEventListener('input', function(){
  S.year = yearFromPos(+range.value);
  render();
});
/* The handle used to settle on the nearest era when released, which meant
   the only reachable years were the 17 in ERAS. Across the 371-year gap
   between 671 and 1042 that discarded everything in between, and five
   polities became unreachable outright: Tarumanagara, the Sailendra
   dynasty, Ancient Mataram, Singhasari and Pajang. Borobudur and
   Prambanan had no year you could stand on. The dots below are still one
   jump each, and the arrow keys still step era to era, so the nameable
   states are not lost; the scrubber simply keeps the year you chose. */
range.addEventListener('keydown', function(ev){
  /* Shift steps year by year, for a reader aiming at a specific date. */
  if (ev.shiftKey) return;
  var idx = nearestEraIndex(S.year), next = null;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp'){
    next = Math.min(ERAS.length - 1, S.year >= ERAS[idx].y && idx < ERAS.length-1 ? idx + 1 : idx);
  } else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown'){
    next = Math.max(0, S.year <= ERAS[idx].y ? idx - 1 : idx);
  } else if (ev.key === 'Home'){ next = 0; }
  else if (ev.key === 'End'){ next = ERAS.length - 1; }
  if (next !== null){ ev.preventDefault(); setYear(ERAS[next].y); }
});

function setYear(y){
  S.year = y;
  range.value = Math.round(posFromYear(y));
  LS.set('nusantara-map-year', String(y));
  render();
}

/* ==================================================================
   SELECTION
   ================================================================== */
var hotRegion = null;
function setHot(id, on){
  hotRegion = on ? id : null;
  var n = labelNodes[id];
  if (n) n.g.classList.toggle('hot', on);
}
function selectRegion(id){
  S.region = id;
  S.entity = null;
  var n = labelNodes[id];
  if (n) n.g.classList.add('rv');
  render();
}
function clearSelection(){
  S.region = null; S.entity = null;
  render();
}
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape') clearSelection();
});

/* ==================================================================
   RENDER
   ================================================================== */
var rail = document.getElementById('rail');
var badgeYear = document.getElementById('badge-year');
var badgeEra = document.getElementById('badge-era');
var badgeCount = document.getElementById('badge-count');

function render(){
  var y = S.year;
  var ov = activeOverlay(y);

  /* --- map layers --- */
  var activeRouteIds = {};
  var activeCount = 0;
  DATA.forEach(function(e, i){
    var on = activeAt(e, y);
    if (on){
      activeCount++;
      e.routes.forEach(function(r){ activeRouteIds[r] = true; });
    }
    if (bloomNodes[i]) bloomNodes[i].setAttribute('opacity', on ? 1 : 0);
    /* While a faction overlay owns the map, the generic colonial hard edge
       would draw violet over every landmass and fight it. The overlay is the
       more precise statement for these years, so it wins. */
    if (hardNodes[i]) hardNodes[i].setAttribute('opacity', (on && !ov) ? 1 : 0);
    if (entNodeEls[i]) entNodeEls[i].setAttribute('opacity', on ? 0.9 : 0);
  });

  ROUTES.forEach(function(r){
    var n = routeNodes[r.id];
    var show = S.routes;
    n.path.style.display = show ? '' : 'none';
    n.text.style.display = show ? '' : 'none';
    n.path.classList.toggle('hot', !!activeRouteIds[r.id]);
    n.text.classList.toggle('hot', !!activeRouteIds[r.id]);
    n.text.textContent = r.label[S.lang];
  });

  REGIONS.forEach(function(r){
    var n = regionNodes[r.id], l = labelNodes[r.id];
    n.glow.classList.toggle('sel', S.region === r.id);
    l.g.classList.toggle('sel', S.region === r.id);
    l.text.textContent = r.label[S.lang];
    n.hit.setAttribute('aria-label', r.label[S.lang]);
  });

  /* --- era badge --- */
  var era = currentEra();
  badgeYear.textContent = y >= NOW ? String(NOW) : String(y);
  badgeEra.textContent = era[S.lang];
  badgeCount.textContent = activeCount + ' ' + T('entities');

  /* --- era dots: only the active one is named --- */
  var curIdx = ERAS.indexOf(era);
  Array.prototype.forEach.call(eraNames.querySelectorAll('.era-dot'), function(b, i){
    b.classList.toggle('on', i === curIdx);
    b.setAttribute('aria-label', ERAS[i][S.lang] + ' · ' + ERAS[i].y);
    b.title = ERAS[i][S.lang];
  });
  eraCur.textContent = era[S.lang];
  var curPct = (posFromYear(era.y) / PMAX) * 100;
  eraCur.style.left = Math.min(93, Math.max(7, curPct)).toFixed(2) + '%';

  /* --- faction overlays --- */
  buildOverlay(ov);
  buildMarks(y);
  renderOverlayLegend(ov);

  /* --- prologue: before any kingdom is recorded --- */
  var prologue = y < 350;
  gMig.style.display = prologue ? '' : 'none';
  migText.textContent = T('migrationLabel');

  /* --- scrubber throughline --- */
  var X = rx(posFromYear(y));
  ruler._thr.setAttribute('x1', X.toFixed(2));
  ruler._thr.setAttribute('x2', X.toFixed(2));
  paintLanes();

  renderRail();
}

var FAC_HEX = { nat:'var(--f-nat)', islam:'var(--f-islam)', komunis:'var(--f-komunis)', kristen:'var(--f-kristen)', none:'var(--f-none)', belanda:'var(--colonial)' };
var ovLegendEl = document.getElementById('ov-legend');

function renderOverlayLegend(ov){
  if (!ov){ ovLegendEl.classList.remove('on'); ovLegendEl.innerHTML = ''; return; }
  var title, rows = [], note;

  if (ov.id === 'revolusi'){
    title = T('ovRevolusi');
    rows = [['nat', T('facNat')], ['belanda', T('facBelanda')]];
    if (S.year === 1948) rows.push(['komunis', T('facKomunis')]);
    if (S.year >= 1949) rows.push(['islam', T('facIslam')]);
    note = T('ovRevolusiNote');
  } else if (ov.id === 'pemilu55'){
    title = T('ovPemilu');
    rows = [['nat','PNI'], ['islam','Masyumi · NU'], ['kristen', T('facKristen')], ['none', T('facNone')]];
    note = T('ovPemiluNote');
  } else {
    title = T('ovKill');
    rows = [];
    note = T('ovKillNote');
  }

  var html = '<h4>' + esc(title) + '</h4>';
  if (rows.length){
    html += '<div class="rows">';
    rows.forEach(function(r){
      html += '<div class="r"><span class="sw" style="background:' + FAC_HEX[r[0]] + '"></span>' + esc(r[1]) + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="note">' + esc(note) + '</div>';
  ovLegendEl.innerHTML = html;
  ovLegendEl.classList.add('on');
}

/* The rail carries the substance. The legend is a key; this is the argument. */
function overlayBlockHtml(ov){
  if (!ov) return '';

  if (ov.id === 'revolusi'){
    var ph = ov.phase;
    if (!ph) return '';
    var h = '<div class="ov-block">' +
      '<div class="kicker">' + esc(T('ovRevolusi')) + '</div>' +
      '<h3>' + esc(ph.title[S.lang]) + '</h3>' +
      '<p>' + esc(ph.body[S.lang]) + '</p>';
    if (S.year === 1948){
      h += '<div class="caution"><b>' + esc(T('facKomunis')) + '.</b> ' + esc(T('pkiNote')) + '</div>';
    }
    return h + '</div>';
  }

  if (ov.id === 'pemilu55'){
    var h2 = '<div class="ov-block">' +
      '<div class="kicker">' + esc(T('ovPemilu')) + '</div>' +
      '<h3>' + esc(S.lang === 'id' ? 'Empat blok, satu peta' : 'Four blocs, one map') + '</h3>' +
      '<p>' + esc(T('ovPemiluNote')) + '</p>';
    /* Runner-up is where the PKI actually lives on this map. */
    if (S.region && PEMILU55[S.region]){
      var e = PEMILU55[S.region];
      if (e.win){
        h2 += '<div class="ov-rows"><div class="r">' +
          '<span class="sw" style="background:' + FAC_HEX[e.fac] + '"></span>' +
          esc(e.win[S.lang]) +
          '<span class="rr">' + esc(T('secondPlace')) + ': ' + esc(e.second[S.lang]) + '</span>' +
          '</div></div>';
      } else {
        h2 += '<div class="caution">' + esc(T('outsideFranchise')) + '</div>';
      }
    }
    h2 += '<div class="caution"><b>' + esc(T('facKomunis')) + '.</b> ' + esc(T('pkiNote')) + '</div>';
    return h2 + '</div>';
  }

  return '<div class="ov-block grave">' +
    '<div class="kicker">' + esc(T('ovKill')) + '</div>' +
    '<h3>' + esc(S.lang === 'id' ? 'Sebaran kekerasan, bukan wilayah' : 'A distribution of violence, not a territory') + '</h3>' +
    '<p>' + esc(KILL_BODY[S.lang]) + '</p>' +
    '</div>';
}

/* Why here / how power worked / how it ended. Only rendered on the selected
   card — three questions at once on every card would be a wall of text. */
function loreHtml(e){
  var lo = LORE[e.name.id];
  if (!lo) return '';

    '<div class="lr"><span class="lk">' + esc(T('loreWhy')) + '</span>' + esc(lo.why[S.lang]) + '</div>' +

/* The selected entity's historical image, with an honest credit line.
   Only built for the open card, so a single image loads at a time. */
function imgFigureHtml(e){
  var im = IMG[e.name.id];

  if (im.lic === 'pd')       lic = S.lang === 'id' ? 'Domain publik' : 'Public domain';

    '<img src="' + src + '" alt="' + esc(nameOf(e)) + '" loading="lazy" decoding="async">' +
    '<figcaption class="ent-cap">' +
      '<a href="' + esc(im.p) + '" target="_blank" rel="noopener noreferrer">' + esc(via) + ' ↗</a>' +

  var h = '<div class="ov-block">' +

function renderRail(){
  var ovHtml = prologueBlockHtml() + overlayBlockHtml(activeOverlay(S.year));

  if (!S.region){
    rail.innerHTML = ovHtml +
      '<div class="rail-label">' + esc(T('railIdle')) + '</div>' +
      '<div class="rail-empty">' + esc(T('railIdleBody')) + '</div>' +

  }

  var region = REGIONS.filter(function(r){ return r.id === S.region; })[0];
  var idxs = entitiesInRegion(region, S.year);

  var html = ovHtml +
    '<div class="rail-label">' + esc(T('activeHere')) + '</div>' +
    '<h2>' + esc(region.label[S.lang]) + '</h2>' +
    '<div class="rail-count mono">' + (S.year >= NOW ? NOW : S.year) + ' · ' + idxs.length + ' ' + esc(T('entities')) + '</div>';

  if (!idxs.length){
    html += '<div class="rail-empty">' +
      esc(REGION_EVER[region.id] ? T('railNone') : T('railGap')) + '</div>';
  } else {
    html += '<div class="ent-list">';
    idxs.forEach(function(i){
      var e = DATA[i];
      html +=
        '<button type="button" class="ent c-' + e.cat + (S.entity === i ? ' sel' : '') +
          (S.revealed[i] ? ' rv' : '') + '" data-i="' + i + '">' +
          '<div class="en">' + esc(nameOf(e)) +
            (e.wide ? '<span class="tag">' + esc(T('wide')) + '</span>' : '') + '</div>' +
          '<div class="ey">' + e.start + '–' + esc(String(endLabel(e))) +
            ' · ' + esc(CHROME.catNames[e.cat][S.lang]) + '</div>' +
          '<div class="ed">' + esc(e.desc[S.lang]) + '</div>' +
          loreHtml(e) +
          '<div class="conf">' + esc(CHROME.confLabel[e.conf][S.lang]) + '</div>' +
        '</button>' +
        (S.entity === i ? imgFigureHtml(e) : '');
    });
    html += '</div>';
  }

  if (S.study && idxs.length) html += '<div class="study-hint">' + esc(T('studyHint')) + '</div>';
  rail.innerHTML = html;

  Array.prototype.forEach.call(rail.querySelectorAll('.ent'), function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.i;
      S.entity = (S.entity === i) ? null : i;
      S.revealed[i] = true;
      LS.set('nusantara-map-revealed', JSON.stringify(S.revealed));
      renderRail();
    });
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* Region for a milestone: explicit if given, otherwise derived from the
   entity's own nodes, so reshaping a region cannot silently break a jump. */
function regionForEntity(name){
  for (var i = 0; i < DATA.length; i++){
    var e = DATA[i];
    if (e.name.id !== name) continue;
    for (var j = 0; j < REGIONS.length; j++){
      var r = REGIONS[j];
      var hit = e.nodes.some(function(n){ return pointInPoly(n.lon, n.lat, r.poly); });
      if (hit) return r.id;
    }
  }
  return null;
}
function entityIndex(name){
  for (var i = 0; i < DATA.length; i++) if (DATA[i].name.id === name) return i;
  return -1;
}

var chapList = document.getElementById('chap-list');

function renderChapters(){
  if (!chapList) return;
  var L = S.lang;
  var html = '';

  CHAPTERS.forEach(function(c){
    html +=
      '<article class="chap c-' + c.cat + '">' +
        '<div class="chap-id">' +
          '<div class="chap-no">' + esc(T('chapWord') + ' ' + c.no) + '</div>' +
          '<h3 class="chap-title">' + esc(c.title[L]) + '</h3>' +
          '<div class="chap-range mono">' + esc(c.range[L]) + '</div>' +
          '<button type="button" class="chap-open" data-y="' + c.from + '">' + esc(T('chapOpen')) + '</button>' +
        '</div>' +
        '<div class="chap-body">' +
          c.body[L].map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
          '<div class="chap-sub">' + esc(T('chapMilestones')) + '</div>' +
          '<div class="ms-list">' +
            c.ms.map(function(m){
              /* The label carries its own year prefix before the middot, so
                 the two languages can date the same event differently
                 ("±abad 1–4 M" / "±1st–4th century CE") without a second field. */
              var parts = m.lab[L].split(' · ');
              var y = parts.shift();
              return '<button type="button" class="ms" data-y="' + m.y + '"' +
                (m.ent ? ' data-ent="' + esc(m.ent) + '"' : '') +
                (m.reg ? ' data-reg="' + esc(m.reg) + '"' : '') + '>' +
                '<span class="ms-y">' + esc(y) + '</span>' +
                '<span class="ms-t">' + esc(parts.join(' · ')) + '</span>' +
              '</button>';
            }).join('') +
          '</div>' +
          '<div class="chap-note">' +
            '<span class="k">' + esc(T('chapNote')) + '</span>' +
            c.note[L].map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
          '</div>' +
          (c.overlap ? '<div class="chap-overlap">' + esc(c.overlap[L]) + '</div>' : '') +
        '</div>' +
      '</article>';
  });

  chapList.innerHTML = html;

  /* A chapter jump is the same gesture as clicking the map: set the year,
     select the place, open the entity. The page then returns to the plate,
     because a jump the reader cannot see has not happened. Reduced motion
     gets the same jump without the travel. */
  Array.prototype.forEach.call(chapList.querySelectorAll('.ms, .chap-open'), function(b){
    b.addEventListener('click', function(){
      setYear(+b.dataset.y);

      var ent = b.dataset.ent || null;
      var reg = b.dataset.reg || (ent ? regionForEntity(ent) : null);
      if (reg){
        selectRegion(reg);
        if (ent){
          var i = entityIndex(ent);
          var r = REGIONS.filter(function(x){ return x.id === reg; })[0];
          /* Only open it if it is genuinely active at this year: the rail
             must never show a card the map does not also draw. */
          if (i >= 0 && r && entitiesInRegion(r, S.year).indexOf(i) >= 0){
            S.entity = i;
            S.revealed[i] = true;
            LS.set('nusantara-map-revealed', JSON.stringify(S.revealed));
            render();
          }
        }
      }

      /* The rail is where the jump's answer lands, so a jump reopens it. */
      if (!S.rail){ S.rail = true; applyRail(); LS.set('nusantara-map-rail', '1'); }

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
  });
}
